name: M5 V2-B Depth Plane Sidecar Correction

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Apply scoped sidecar correction
        run: python .github/m5_v2b_depth_plane_sidecar_fix.py
      - name: Validate diff
        run: git diff --check
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tools/Blender/write_production_sidecars.py Game/Submarine/ProductionAnteyAsset.cpp
          git commit -m "fix: bind depth planes through source-first sidecar"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
