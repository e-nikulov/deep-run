name: P700 CI repair

on:
  push:
    branches:
      - feature/p700-signature-launch-vfx

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Add one-shot P-700 CI repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p700-signature-launch-vfx
      - name: Apply compile fixes
        shell: python
        run: |
          from pathlib import Path

          vfx_path = Path('Game/Weapons/P700LaunchVfx.cpp')
          vfx = vfx_path.read_text(encoding='utf-8')
          old_append = 'const auto append = [&](Render::TransientVfxEmitter emitter) mutable'
          new_append = 'const auto append = [&](Render::TransientVfxEmitter emitter)'
          old_audio = 'const Weapons::P700GranitRuntimeState& missile, const bool underwater) mutable'
          new_audio = 'const Weapons::P700GranitRuntimeState& missile, const bool underwater)'
          if vfx.count(old_append) != 1 or vfx.count(old_audio) != 1:
              raise SystemExit('P700LaunchVfx.cpp no longer matches expected CI-fix anchors')
          vfx = vfx.replace(old_append, new_append, 1).replace(old_audio, new_audio, 1)
          vfx_path.write_text(vfx, encoding='utf-8')

          main_path = Path('DeepRun/Main.cpp')
          main = main_path.read_text(encoding='utf-8')
          old_create = 'const auto combat = DeepRun::Game::Combat::CombatPlaygroundWindowedComposition::Create('
          new_create = 'auto combat = DeepRun::Game::Combat::CombatPlaygroundWindowedComposition::Create('
          old_assign = 'combatPlayground = *combat;'
          new_assign = 'combatPlayground = std::move(*combat);'
          if main.count(old_create) != 1 or main.count(old_assign) != 1:
              raise SystemExit('Main.cpp no longer matches expected CI-fix anchors')
          main = main.replace(old_create, new_create, 1).replace(old_assign, new_assign, 1)
          main_path.write_text(main, encoding='utf-8')
      - name: Commit compile fixes
        shell: bash
        run: |
          git config user.name "Deep Run CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add Game/Weapons/P700LaunchVfx.cpp DeepRun/Main.cpp
          git diff --cached --check
          git commit -m "Fix P-700 VFX CI compile errors"
          git push origin HEAD:feature/p700-signature-launch-vfx
