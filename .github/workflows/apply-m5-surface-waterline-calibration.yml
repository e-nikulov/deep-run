name: Apply M5 surfaced waterline calibration

on:
  push:
    branches:
      - fix/m5-final-closure-gaps
    paths:
      - Tools/apply_m5_surface_waterline_calibration.py
      - .github/workflows/apply-m5-surface-waterline-calibration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-final-closure-gaps
      - name: Apply surfaced waterline calibration
        run: python Tools/apply_m5_surface_waterline_calibration.py
      - name: Commit calibration
        shell: bash
        run: |
          git config user.name "DeepRun CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No calibration changes to commit"
            exit 0
          fi
          git commit -m "fix: calibrate surfaced Antey waterline"
          git push origin HEAD:fix/m5-final-closure-gaps
