name: P700 full presentation patch

on:
  push:
    paths:
      - '.github/workflows/p700-full-presentation-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Apply patch
        run: python Tools/patch_p700_full_presentation.py
      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm -f Tools/patch_p700_full_presentation.py .github/workflows/p700-full-presentation-patch.yml
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git add -A
          git commit -m "feat: present complete production P-700 launch sequence"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
