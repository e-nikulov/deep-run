name: Temporary sync refined Antey compartments

on:
  push:
    branches:
      - feature/antey-compartment-reference-alignment

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python Tools/tmp_sync_antey_compartment_geometry.py
      - run: |
          rm Tools/tmp_sync_antey_compartment_geometry.py
          rm .github/workflows/tmp-sync-antey-compartment-geometry.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: sync refined Antey compartment geometry"
          git push origin HEAD:feature/antey-compartment-reference-alignment
