name: Apply M5 automated single-launch fix

on:
  push:
    branches:
      - fix/m5-weapon-ux-soft-envelopes
    paths:
      - Tools/apply_m5_automated_single_launch_fix.py
      - .github/workflows/apply-m5-automated-single-launch-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-weapon-ux-soft-envelopes
          fetch-depth: 0
      - name: Apply production and regression fix
        run: python Tools/apply_m5_automated_single_launch_fix.py
      - name: Validate patch
        run: git diff --check && git diff --stat
      - name: Commit fix and remove temporary scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm Tools/apply_m5_automated_single_launch_fix.py .github/workflows/apply-m5-automated-single-launch-fix.yml
          git add -A
          git commit -m "fix: keep automated M5 combat to one committed player launch"
          git push origin HEAD:fix/m5-weapon-ux-soft-envelopes
