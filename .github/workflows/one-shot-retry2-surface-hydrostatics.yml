name: One-shot retry2 surfaced hydrostatics calibration

on:
  push:
    branches:
      - fix/m5-surface-hydrostatics-calibration
    paths:
      - .github/workflows/one-shot-retry2-surface-hydrostatics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production patch
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path

          workflow_path = Path('.github/workflows/one-shot-apply-surface-hydrostatics.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          body = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(script, 'embedded_surface_hydrostatics_patch.py', 'exec'), {'__name__': '__main__'})

          test = Path('Tests/TestMain.cpp')
          text = test.read_text(encoding='utf-8')
          old = 'source.find("M2GameBuoyancyStabilityOffsetMeters") != std::string::npos &&'
          new = 'source.find("M2GameBuoyancyStabilityOffsetMeters") == std::string::npos &&'
          if text.count(old) != 1:
              raise SystemExit(f'TestMain offset policy expected once, got {text.count(old)}')
          text = text.replace(old, new)
          old2 = 'source.find("M5AnteySubmergedMassKg / water.Config().densityKgPerCubicMeter") != std::string::npos &&'
          new2 = 'source.find("Submarine::AnteyGameplayFullSubmergedMassKg") != std::string::npos &&\n        ' + old2
          if text.count(old2) != 1:
              raise SystemExit(f'TestMain displaced-volume policy expected once, got {text.count(old2)}')
          text = text.replace(old2, new2)
          test.write_text(text, encoding='utf-8')

          for path in [
              Path('.github/workflows/one-shot-retry-surface-hydrostatics.yml'),
              Path('.github/workflows/one-shot-retry2-surface-hydrostatics.yml'),
          ]:
              if path.exists():
                  path.unlink()
          PY2

      - name: Verify mass/displacement-only surface equilibrium
        shell: bash
        run: |
          if grep -R "M2GameBuoyancyStabilityOffsetMeters" -n Game; then
            echo "special buoyancy offset still present in production code" >&2
            exit 1
          fi
          grep -q "AnteyGameplayFullSubmergedMassKg = 20'622'267.0F" Game/Submarine/AnteyHandlingModel.h
          grep -q "productionBuoyancy.centerOfBuoyancy.y," Game/PhysicalPlayground.cpp
          git diff --check

      - name: Commit calibrated hydrostatics
        shell: bash
        run: |
          git config user.name "Deep Run automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(m5): calibrate surfaced hydrostatics by mass and displacement"
          git push origin HEAD:fix/m5-surface-hydrostatics-calibration
