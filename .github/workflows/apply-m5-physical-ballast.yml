name: Apply M5 physical ballast and speed calibration

on:
  push:
    branches:
      - fix/m5-final-closure-gaps
    paths:
      - .github/workflows/apply-m5-physical-ballast.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-final-closure-gaps
      - name: Apply physical ballast and performance calibration
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise RuntimeError(f'{path}: expected one exact match, found {n}: {old[:240]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')

          def sub_once(path, pattern, repl, flags=0):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s2, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise RuntimeError(f'{path}: expected one regex match, found {n}: {pattern[:240]!r}')
              p.write_text(s2, encoding='utf-8', newline='\n')

          # Public 949A canonical values and a thrust policy compatible with the published speed/power envelope.
          sub_once(
              'Game/Submarine/AnteyHandlingModel.h',
              r'// Project 949A public sources commonly publish about 24,000 t full/submerged displacement\..*?\.spinDownRateRpmPerSecond = 45\.0F\};',
              '''// Public Project 949A figures are not perfectly uniform, so Deep Run fixes one documented canonical set:
// Apalkov/Deepstorm-style 14,700 t surfaced, 19,400 t submerged, 32 kn submerged and 15 kn surfaced.
// The 4,700 t difference is treated as main-ballast water, giving 31.97% reserve buoyancy relative to surfaced
// displacement. These are public-source gameplay authorities, not claims about classified loading conditions.
inline constexpr float AnteyPublicSurfaceDisplacementMassKg = 14'700'000.0F;
inline constexpr float AnteyPublicSubmergedDisplacementMassKg = 19'400'000.0F;
inline constexpr float AnteyMainBallastWaterCapacityKg =
    AnteyPublicSubmergedDisplacementMassKg - AnteyPublicSurfaceDisplacementMassKg;
inline constexpr float AnteyPublicReserveBuoyancyFraction =
    AnteyMainBallastWaterCapacityKg / AnteyPublicSurfaceDisplacementMassKg;
inline constexpr float AnteyPublicMaximumSubmergedSpeedKnots = 32.0F;
inline constexpr float AnteyPublicMaximumSurfacedSpeedKnots = 15.0F;
inline constexpr float KnotsToMetersPerSecond = 0.514444F;
inline constexpr float AnteyPublicMaximumSubmergedSpeedMetersPerSecond =
    AnteyPublicMaximumSubmergedSpeedKnots * KnotsToMetersPerSecond;
inline constexpr float AnteyPublicMaximumSurfacedSpeedMetersPerSecond =
    AnteyPublicMaximumSurfacedSpeedKnots * KnotsToMetersPerSecond;
// Compatibility name retained for existing acoustic/runtime code: fully submerged neutral mass is 19,400 t.
inline constexpr float AnteyCanonicalFullSubmergedMassKg = AnteyPublicSubmergedDisplacementMassKg;

// GAME POLICY calibrated jointly with hydrodynamic drag so full ahead asymptotically matches the public 32 kn
// submerged / 15 kn surfaced envelope. Public sources give roughly 2 x 50,000 hp shaft power; the thrust value
// itself is not published and is therefore not presented as a historical hardware specification.
inline constexpr Marine::PropulsionComponent AnteyGameplayPropulsion{
    .maxForwardRpm = 180.0F,
    .maxReverseRpm = 90.0F,
    .maxForwardThrustNewtons = 3'350'000.0F,
    .maxReverseThrustNewtons = 837'500.0F,
    .spinUpRateRpmPerSecond = 30.0F,
    .spinDownRateRpmPerSecond = 45.0F};''',
              flags=re.S)

          replace_once(
              'Game/Submarine/AnteyHandlingModel.h',
              '''static_assert(AnteyCanonicalFullSubmergedMassKg == 24'000'000.0F);
          ''',
              '''static_assert(AnteyPublicSurfaceDisplacementMassKg == 14'700'000.0F);
          static_assert(AnteyCanonicalFullSubmergedMassKg == 19'400'000.0F);
          static_assert(AnteyMainBallastWaterCapacityKg == 4'700'000.0F);
          static_assert(AnteyPublicReserveBuoyancyFraction > 0.319F && AnteyPublicReserveBuoyancyFraction < 0.321F);
          ''')

          # Generic physics boundary: allow Game to change a dynamic body's physical mass/inertia through Jolt.
          replace_once(
              'Engine/Physics/PhysicsWorld.h',
              '''    bool DestroyBody(PhysicsBodyHandle handle, PhysicsError* error = nullptr);

              // Returns a copy of the body state.''',
              '''    bool DestroyBody(PhysicsBodyHandle handle, PhysicsError* error = nullptr);

              // Changes the physical mass of an existing dynamic body and scales its inertia consistently.
              // This is a generic physics operation; callers own the domain reason (fuel, ballast, cargo, etc.).
              // Position and velocity are not teleported or rewritten. Static bodies are rejected.
              bool SetDynamicBodyMass(PhysicsBodyHandle handle, float massKg, PhysicsError* error = nullptr);

              // Returns a copy of the body state.''')

          replace_once(
              'Engine/Physics/PhysicsWorld.cpp',
              '''#include <Jolt/Physics/Body/BodyInterface.h>
          ''',
              '''#include <Jolt/Physics/Body/BodyInterface.h>
          #include <Jolt/Physics/Body/BodyLock.h>
          #include <Jolt/Physics/Body/MotionProperties.h>
          ''')

          replace_once(
              'Engine/Physics/PhysicsWorld.cpp',
              '''        logger.Info(Diagnostics::LogCategory::Physics, "Physics body destroyed (slot " + std::to_string(handle.Slot()) + ")");
                  return true;
              }

              std::optional<PhysicsBodyState> GetBodyState''',
              '''        logger.Info(Diagnostics::LogCategory::Physics, "Physics body destroyed (slot " + std::to_string(handle.Slot()) + ")");
                  return true;
              }

              bool SetDynamicBodyMass(PhysicsBodyHandle handle, const float massKg, PhysicsError* error)
              {
                  const auto fail = [this, error](const PhysicsErrorCode code, const std::string& message) -> bool {
                      if (error != nullptr)
                          *error = PhysicsError{code, message};
                      logger.Warning(Diagnostics::LogCategory::Physics, "Dynamic body mass change rejected: " + message);
                      return false;
                  };
                  if (!initialized)
                      return fail(PhysicsErrorCode::NotInitialized, "physics world is not initialized");
                  if (!std::isfinite(massKg) || massKg <= 0.0F)
                      return fail(PhysicsErrorCode::InvalidInput, "dynamic body mass must be finite and positive");
                  BodySlot* slot = Resolve(handle);
                  if (slot == nullptr)
                      return fail(PhysicsErrorCode::InvalidHandle, "handle is invalid, foreign, or stale");
                  if (slot->kind != BodyKind::Dynamic)
                      return fail(PhysicsErrorCode::InvalidInput, "mass can only be changed on a dynamic body");

                  {
                      JPH::BodyLockWrite lock(physicsSystem->GetBodyLockInterface(), slot->bodyId);
                      if (!lock.Succeeded())
                          return fail(PhysicsErrorCode::InvalidHandle, "Jolt body lock failed");
                      JPH::MotionProperties* motion = lock.GetBody().GetMotionProperties();
                      if (motion == nullptr)
                          return fail(PhysicsErrorCode::InvalidInput, "dynamic body has no motion properties");
                      // Jolt 5.5.0 ScaleToMass updates inverse mass and scales inverse inertia by the same ratio.
                      motion->ScaleToMass(massKg);
                  }
                  physicsSystem->GetBodyInterface().ActivateBody(slot->bodyId);
                  return true;
              }

              std::optional<PhysicsBodyState> GetBodyState''')

          replace_once(
              'Engine/Physics/PhysicsWorld.cpp',
              '''bool PhysicsWorld::DestroyBody(PhysicsBodyHandle handle, PhysicsError* error)
          {
              assert(impl_ != nullptr);
              return impl_->DestroyBody(handle, error);
          }

          std::optional<PhysicsBodyState> PhysicsWorld::GetBodyState''',
              '''bool PhysicsWorld::DestroyBody(PhysicsBodyHandle handle, PhysicsError* error)
          {
              assert(impl_ != nullptr);
              return impl_->DestroyBody(handle, error);
          }

          bool PhysicsWorld::SetDynamicBodyMass(PhysicsBodyHandle handle, const float massKg, PhysicsError* error)
          {
              assert(impl_ != nullptr);
              return impl_->SetDynamicBodyMass(handle, massKg, error);
          }

          std::optional<PhysicsBodyState> PhysicsWorld::GetBodyState''')

          # PhysicalPlayground: one displacement volume, real ballast-water mass, no surfaced-mode force hack.
          replace_once(
              'Game/PhysicalPlayground.cpp',
              '''// Fully-submerged Project 949A gameplay mass. The public-source basis and displacement-definition caveat live
          // in AnteyHandlingModel.h; collision/buoyancy proxy geometry remains spatial authority only.
          constexpr float M2GameAnteyMassTuningKg = Submarine::AnteyCanonicalFullSubmergedMassKg;
          ''',
              '''// Public-source Project 949A mass/displacement authority lives in AnteyHandlingModel.h. The production
          // collision/buoyancy proxy remains spatial authority only; ballast water changes Jolt mass at runtime.
          constexpr float M2GameAnteyMassTuningKg = Submarine::AnteyPublicSubmergedDisplacementMassKg;
          ''')

          sub_once(
              'Game/PhysicalPlayground.cpp',
              r'// Surface-waterplane calibration is explicit Game policy\..*?constexpr float M5SurfaceHydrostaticModeArmDepthMeters = 2\.8F;\n',
              '''// One physical displacement model serves both surfaced and submerged states. The fully flooded/immersed
          // displacement supports 19,400 t; empty main ballast leaves the public 14,700 t surfaced mass. With the
          // calibrated waterplane half-height the resulting hydrostatic equilibrium is 2.242 m body-centre depth.
          constexpr float M2GameBuoyancyStabilityOffsetMeters = 0.0F;
          constexpr float M2BuoyancySubmersionHalfHeightMeters = 4.35F;
          constexpr float M5AnteySurfaceMassKg = Submarine::AnteyPublicSurfaceDisplacementMassKg;
          constexpr float M5AnteySubmergedMassKg = Submarine::AnteyPublicSubmergedDisplacementMassKg;
          constexpr float M5AnteyMainBallastCapacityKg = Submarine::AnteyMainBallastWaterCapacityKg;
          constexpr float M5SurfaceEquilibriumSubmergedFraction = M5AnteySurfaceMassKg / M5AnteySubmergedMassKg;
          constexpr float M5SurfaceEquilibriumBodyCenterDepthMeters =
              M2GameBuoyancyStabilityOffsetMeters +
              M2BuoyancySubmersionHalfHeightMeters * (2.0F * M5SurfaceEquilibriumSubmergedFraction - 1.0F);
          static_assert(M5SurfaceEquilibriumBodyCenterDepthMeters > 2.23F &&
                        M5SurfaceEquilibriumBodyCenterDepthMeters < 2.25F);
          // Exact 949A tank sequencing/rates are not public. This rate is explicit GAME POLICY; it changes real
          // ballast-water mass rather than applying an artificial vertical force. Full empty<->full takes 40 s.
          constexpr float M5MainBallastFillRateFractionPerSecond = 0.025F;
          constexpr float M5MainBallastBlowRateFractionPerSecond = 0.025F;
          // Current low-speed trim controller is reinterpreted as a small equivalent trim-water mass delta.
          constexpr float M5MaximumTrimMassFractionOfSubmergedMass = 0.015F;
          // Effective longitudinal Cd*A values calibrated with AnteyGameplayPropulsion so quadratic drag balances
          // full-ahead thrust at the public 32 kn submerged / 15 kn surfaced canonical speeds.
          constexpr float M5SubmergedLongitudinalEffectiveAreaSquareMeters = 24.11986F;
          constexpr float M5SurfacedLongitudinalEffectiveAreaSquareMeters = 109.77216F;
          ''',
              flags=re.S)

          replace_once(
              'Game/PhysicalPlayground.cpp',
              '''constexpr Physics::PhysicsVector3 M2LinearEffectiveAreaSquareMeters{150.0F, 1800.0F, 2200.0F};
          ''',
              '''constexpr Physics::PhysicsVector3 M2LinearEffectiveAreaSquareMeters{
              M5SubmergedLongitudinalEffectiveAreaSquareMeters, 1800.0F, 2200.0F};
          ''')

          replace_once(
              'Game/PhysicalPlayground.cpp',
              '''    const float neutralDisplacedVolume = M2GameAnteyMassTuningKg / water.Config().densityKgPerCubicMeter;
              const float totalDisplacedVolume = neutralDisplacedVolume * (1.0F + M5AnteyReserveBuoyancyFraction);
          ''',
              '''    const float totalDisplacedVolume =
              M5AnteySubmergedMassKg / water.Config().densityKgPerCubicMeter;
          ''')

          replace_once(
              'Game/PhysicalPlayground.cpp',
              '''    bodyInfo.mass = M2GameAnteyMassTuningKg; // temporary Game-owned neutral-mass tuning
          ''',
              '''    bodyInfo.mass = M5AnteySubmergedMassKg; // fully flooded main ballast: neutral submerged condition
          ''')

          replace_once(
              'Game/PhysicalPlayground.cpp',
              '''    // IG1-C: production buoyancy proxy supplies spatial extent/COB only. Effective neutral displacement
              // remains the accepted Game-owned mass / density policy and is split across four bounded points.
              Marine::BuoyancyComponent buoyancy = BuildM2Buoyancy(*water, buoyancyProxy, collisionProxy);
              const double neutralVolume = static_cast<double>(M2GameAnteyMassTuningKg) /
                                           static_cast<double>(water->Config().densityKgPerCubicMeter);
              const double expectedVolume = neutralVolume * (1.0 + static_cast<double>(M5AnteyReserveBuoyancyFraction));
          ''',
              '''    // IG1-C: production buoyancy proxy supplies spatial extent/COB only. Potential displaced volume is
              // the public 19,400 t submerged displacement divided by seawater density; ballast changes mass, not volume.
              Marine::BuoyancyComponent buoyancy = BuildM2Buoyancy(*water, buoyancyProxy, collisionProxy);
              const double expectedVolume = static_cast<double>(M5AnteySubmergedMassKg) /
                                            static_cast<double>(water->Config().densityKgPerCubicMeter);
          ''')

          replace_once(
              'Game/PhysicalPlayground.cpp',
              '''    const double expectedWeight = static_cast<double>(M2GameAnteyMassTuningKg) * *gravityMagnitude;
              const double expectedFullySubmergedBuoyancy =
                  expectedWeight * (1.0 + static_cast<double>(M5AnteyReserveBuoyancyFraction));
          ''',
              '''    const double expectedWeight = static_cast<double>(M5AnteySubmergedMassKg) * *gravityMagnitude;
              const double expectedFullySubmergedBuoyancy = expectedWeight;
          ''')

          # Dynamic longitudinal drag from actual immersion fraction.
          replace_once(
              'Game/PhysicalPlayground.cpp',
              '''    // F2 consumes the SAME beginning-of-tick body snapshot as buoyancy. Both force producers finish before
              // any output is applied, so neither observes state affected by the other in this fixed tick.
              const auto dragResult = Marine::HydroDragSystem::Calculate(
                  *water_,
                  hydroDrag_,
                  Marine::HydroDragState{
                      .worldOrientation = state->orientation,
                      .worldLinearVelocityMetersPerSecond = state->linearVelocity,
                      .worldAngularVelocityRadiansPerSecond = state->angularVelocity});
          ''',
              '''    // F2 consumes the SAME beginning-of-tick body snapshot as buoyancy. Longitudinal resistance rises
              // continuously as the hull emerges; this lets the same propulsion model converge to 32 kn submerged
              // and 15 kn surfaced without a hidden velocity clamp.
              float meanSubmergedFraction = 0.0F;
              for (const Marine::BuoyancyPointResult& point : buoyancyResult->points)
                  meanSubmergedFraction += point.submergedFraction;
              meanSubmergedFraction /= static_cast<float>(buoyancyResult->points.size());
              const float surfacedExposureFraction = std::clamp(
                  (1.0F - meanSubmergedFraction) / (1.0F - M5SurfaceEquilibriumSubmergedFraction),
                  0.0F,
                  1.0F);
              Marine::HydroDragComponent liveHydroDrag = hydroDrag_;
              liveHydroDrag.linearEffectiveAreaSquareMeters.x =
                  M5SubmergedLongitudinalEffectiveAreaSquareMeters +
                  (M5SurfacedLongitudinalEffectiveAreaSquareMeters - M5SubmergedLongitudinalEffectiveAreaSquareMeters) *
                      surfacedExposureFraction;
              const auto dragResult = Marine::HydroDragSystem::Calculate(
                  *water_,
                  liveHydroDrag,
                  Marine::HydroDragState{
                      .worldOrientation = state->orientation,
                      .worldLinearVelocityMetersPerSecond = state->linearVelocity,
                      .worldAngularVelocityRadiansPerSecond = state->angularVelocity});
          ''')

          # Replace mode/force hack with physical ballast mass computation.
          sub_once(
              'Game/PhysicalPlayground.cpp',
              r'    const float vesselWeightNewtons = M2GameAnteyMassTuningKg \* \*gravityMagnitude;\n.*?    if \(!variableBallast\)\n    \{\n        return std::unexpected\("physical playground variable-ballast evaluation failed: " \+ variableBallast\.error\(\)\);\n    \}\n',
              '''    const float mainBallastRate = command.depthCommandFraction >= 0.0F
              ? M5MainBallastFillRateFractionPerSecond
              : M5MainBallastBlowRateFractionPerSecond;
          const float nextMainBallastFillFraction = std::clamp(
              mainBallastFillFraction_ + command.depthCommandFraction * mainBallastRate * fixedDeltaSeconds,
              0.0F,
              1.0F);
          const float baseMassKg = M5AnteySurfaceMassKg + M5AnteyMainBallastCapacityKg * nextMainBallastFillFraction;
          const float baseWeightNewtons = baseMassKg * *gravityMagnitude;
          const auto variableBallast = Submarine::CalculateVariableBallastDepthControl(
              M5LowSpeedBallastDepthControl,
              command.depthCommandFraction,
              sternControl->bodyForwardSpeedMetersPerSecond,
              state->linearVelocity.y,
              baseWeightNewtons);
          if (!variableBallast)
          {
              return std::unexpected("physical playground variable-ballast evaluation failed: " + variableBallast.error());
          }
          // Convert the old force-domain low-speed trim request into real equivalent water mass. Positive upward
          // request means less water mass; a downward request means more. Main-ballast-empty mass is the hard
          // lower bound so maximum positive buoyancy always settles at the calibrated 2.242 m surface equilibrium.
          const float requestedTrimMassDeltaKg = -variableBallast->forceNewtons.y / *gravityMagnitude;
          const float maximumTrimMassKg = M5AnteySubmergedMassKg * M5MaximumTrimMassFractionOfSubmergedMass;
          const float trimMassDeltaKg = std::clamp(requestedTrimMassDeltaKg, -maximumTrimMassKg, maximumTrimMassKg);
          const float nextDynamicMassKg = std::clamp(
              baseMassKg + trimMassDeltaKg,
              M5AnteySurfaceMassKg,
              M5AnteySubmergedMassKg + maximumTrimMassKg);
          const float vesselWeightNewtons = nextDynamicMassKg * *gravityMagnitude;
          ''',
              flags=re.S)

          sub_once(
              'Game/PhysicalPlayground.cpp',
              r'    // Submerged mode cancels reserve buoyancy above vessel weight, preserving neutral deep/periscope-depth\n.*?    if \(!physics_->AddForceAtWorldPosition\(\n            physicsBody_, combinedBallastTrimForce, state->position, &ballastForceError\)\)\n    \{\n        return std::unexpected\(\n            "physical playground variable-ballast force application failed: " \+ ballastForceError\.message\);\n    \}\n',
              '''    // Main ballast and trim now act by changing the Jolt rigid body's physical mass/inertia. Buoyancy
          // remains purely Archimedean. No reserve-compensation or direct vertical ballast force is applied.
          if (std::abs(nextDynamicMassKg - committedDynamicMassKg_) > 0.5F)
          {
              Physics::PhysicsError massError;
              if (!physics_->SetDynamicBodyMass(physicsBody_, nextDynamicMassKg, &massError))
              {
                  return std::unexpected("physical playground ballast mass update failed: " + massError.message);
              }
          }
          ''',
              flags=re.S)

          replace_once(
              'Game/PhysicalPlayground.cpp',
              '''    surfacedHydrostaticMode_ = nextSurfacedHydrostaticMode;
              consumedTurnAroundPressSequence_ = command.turnAroundPressSequence;
          ''',
              '''    mainBallastFillFraction_ = nextMainBallastFillFraction;
              committedDynamicMassKg_ = nextDynamicMassKg;
              consumedTurnAroundPressSequence_ = command.turnAroundPressSequence;
          ''')

          # Initialization state fields.
          replace_once(
              'Game/PhysicalPlayground.cpp',
              '''    surfacedHydrostaticMode_ = false;
          ''',
              '''    mainBallastFillFraction_ = 1.0F;
              committedDynamicMassKg_ = M5AnteySubmergedMassKg;
          ''')

          # Diagnostics: remove names of the old force/mode hack and expose physical ballast/mass instead.
          replace_once(
              'Game/PhysicalPlayground.cpp',
              '''        const double weightMagnitude = static_cast<double>(M2GameAnteyMassTuningKg) * *gravityMagnitude;
          ''',
              '''        const double weightMagnitude = static_cast<double>(nextDynamicMassKg) * *gravityMagnitude;
          ''')
          replace_once(
              'Game/PhysicalPlayground.cpp',
              '''                " m/s, ballast/trim force " + FormatVector(combinedBallastTrimForce) +
                          ", reserve buoyancy excess " + std::to_string(reserveExcessBuoyancyNewtons) +
                          " N, reserve trim " + std::to_string(reserveTrimCompensationNewtons) +
                          " N, released reserve " + std::to_string(reserveReleaseNewtons) +
                          " N, hydrostatic mode " + std::string(nextSurfacedHydrostaticMode ? "SURFACED" : "SUBMERGED_TRIM") +
                          ", drag force " +
          ''',
              '''                " m/s, main ballast fill " + std::to_string(nextMainBallastFillFraction) +
                          ", trim mass delta " + std::to_string(trimMassDeltaKg) +
                          " kg, dynamic mass " + std::to_string(nextDynamicMassKg) +
                          " kg, surface exposure " + std::to_string(surfacedExposureFraction) +
                          ", drag force " +
          ''')

          replace_once(
              'Game/PhysicalPlayground.h',
              '''    bool surfacedHydrostaticMode_ = false;
          ''',
              '''    // Physical ballast state: 0 = public surfaced displacement, 1 = public submerged displacement.
              float mainBallastFillFraction_ = 1.0F;
              float committedDynamicMassKg_ = 0.0F;
          ''')

          # Add public canonical regression checks alongside existing low-speed/periscope checks.
          replace_once(
              'Tests/PeriscopeBallastGameplayChecks.h',
              '''#include "Game/Submarine/VariableBallastDepthControl.h"
          ''',
              '''#include "Game/Submarine/AnteyHandlingModel.h"
          #include "Game/Submarine/VariableBallastDepthControl.h"
          ''')
          replace_once(
              'Tests/PeriscopeBallastGameplayChecks.h',
              '''    constexpr float WeightNewtons = 100'000'000.0F;
          ''',
              '''    constexpr float WeightNewtons = 100'000'000.0F;
              constexpr float SeaWaterDensity = 1025.0F;
              constexpr float SurfaceWaterplaneHalfHeight = 4.35F;
              const float reserve = AnteyMainBallastWaterCapacityKg / AnteyPublicSurfaceDisplacementMassKg;
              const float surfacedFraction = AnteyPublicSurfaceDisplacementMassKg / AnteyPublicSubmergedDisplacementMassKg;
              const float surfaceCenterDepth = SurfaceWaterplaneHalfHeight * (2.0F * surfacedFraction - 1.0F);
              const float submergedTerminal = std::sqrt(
                  2.0F * AnteyGameplayPropulsion.maxForwardThrustNewtons /
                  (SeaWaterDensity * 24.11986F));
              const float surfacedTerminal = std::sqrt(
                  2.0F * AnteyGameplayPropulsion.maxForwardThrustNewtons /
                  (SeaWaterDensity * 109.77216F));
              if (std::abs(reserve - 0.32F) > 0.001F ||
                  std::abs(surfaceCenterDepth - 2.242268F) > 0.01F ||
                  std::abs(submergedTerminal - AnteyPublicMaximumSubmergedSpeedMetersPerSecond) > 0.02F ||
                  std::abs(surfacedTerminal - AnteyPublicMaximumSurfacedSpeedMetersPerSecond) > 0.02F)
              {
                  return false;
              }
          ''')

          # Document the new authority clearly.
          p = Path('docs/development/periscope-ballast-gameplay.md')
          s = p.read_text(encoding='utf-8')
          anchor = '## Scope A — low/zero-speed depth control\n'
          if anchor not in s:
              raise RuntimeError('ballast doc scope heading missing')
          insert = '''## Physical ballast / hydrostatic authority\n\nDeep Run now uses one Archimedean model across surfaced and submerged operation. The public-source gameplay canonical is 14,700 t surfaced and 19,400 t submerged; the 4,700 t difference is main-ballast water (~31.97% reserve buoyancy relative to surfaced displacement). The fully immersed buoyancy volume corresponds to 19,400 t in 1025 kg/m^3 seawater. Jolt rigid-body mass and inertia change with ballast fill. With main ballast empty, the calibrated waterplane settles the body reference at ~2.242 m below mean sea level in flat water; with main ballast full, 19,400 t is neutrally buoyant when fully submerged. There is no surfaced-mode buoyancy switch and no reserve-compensation vertical force.\n\nExact Project 949A flooding/blowing timings are not asserted from public data; the current 40 s full-range ballast transition is explicit GAME POLICY. Small low-speed trim authority is represented as bounded equivalent water mass, not as a direct vertical force.\n\nPerformance calibration uses the public 32 kn submerged / 15 kn surfaced canonical. The thrust-domain propulsion policy and immersion-dependent quadratic drag are calibrated so these are terminal full-ahead speeds rather than hard velocity clamps. Public sources do not provide a trustworthy Project-949A-specific maximum vertical rate; generic open literature for nuclear submarines quotes roughly 6–9 m/s, so Deep Run does not label any number in that range as an Antey TTX.\n\n'''
          p.write_text(s.replace(anchor, insert + anchor, 1), encoding='utf-8', newline='\n')

          # Guard against the superseded implementation surviving anywhere in the production composition.
          playground = Path('Game/PhysicalPlayground.cpp').read_text(encoding='utf-8')
          for forbidden in ('surfacedHydrostaticMode_', 'reserveTrimCompensationNewtons',
                            'combinedBallastTrimForce', 'M5SurfaceHydrostaticModeArmDepthMeters'):
              if forbidden in playground:
                  raise RuntimeError(f'stale hydrostatic-force hack remains: {forbidden}')

      - name: Commit physical ballast calibration
        shell: bash
        run: |
          git config user.name "DeepRun CI"
          git config user.email "actions@users.noreply.github.com"
          git add Engine/Physics/PhysicsWorld.h Engine/Physics/PhysicsWorld.cpp Game/Submarine/AnteyHandlingModel.h Game/PhysicalPlayground.cpp Game/PhysicalPlayground.h Tests/PeriscopeBallastGameplayChecks.h docs/development/periscope-ballast-gameplay.md
          git commit -m "fix: calibrate Antey ballast and speed physically"
          git push origin HEAD:fix/m5-final-closure-gaps