name: Apply M5 physical ballast control closure

on:
  push:
    branches:
      - fix/m5-final-closure-gaps
    paths:
      - .github/workflows/apply-m5-ballast-control.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-final-closure-gaps
      - name: Apply ballast control closure
        run: python .github/apply_m5_ballast_control.py
      - name: Commit ballast control closure
        shell: bash
        run: |
          git config user.name "DeepRun CI"
          git config user.email "actions@users.noreply.github.com"
          git add Game/PhysicalPlayground.cpp Game/PhysicalPlayground.h Game/Combat/CombatCommandUi.cpp Game/Combat/CombatCommandUi.h DeepRun/Main.cpp Tests/PeriscopeBallastGameplayChecks.h docs/development/periscope-ballast-gameplay.md
          git commit -m "fix: separate main ballast from depth trim"
          git push origin HEAD:fix/m5-final-closure-gaps