name: M5 V2 Inspect Antey GLB

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant GLB node names
        shell: python
        run: |
          import json, struct
          from pathlib import Path
          path = Path('Content/submarines/Antey/Antey.glb')
          data = path.read_bytes()
          magic, version, length = struct.unpack_from('<4sII', data, 0)
          assert magic == b'glTF' and version == 2 and length == len(data)
          offset = 12
          gltf = None
          while offset < len(data):
              chunk_len, chunk_type = struct.unpack_from('<II', data, offset)
              offset += 8
              chunk = data[offset:offset + chunk_len]
              offset += chunk_len
              if chunk_type == 0x4E4F534A:
                  gltf = json.loads(chunk.rstrip(b'\x00 '))
                  break
          assert gltf is not None
          names = [node.get('name', '') for node in gltf.get('nodes', [])]
          relevant = [name for name in names if any(token in name.lower() for token in ('plane', 'propeller', 'rudder', 'tail'))]
          print('GLB_RELEVANT_NODE_NAMES_BEGIN')
          for name in relevant:
              print(name)
          print('GLB_RELEVANT_NODE_NAMES_END')
          print(f'node_count={len(names)} relevant_count={len(relevant)}')
