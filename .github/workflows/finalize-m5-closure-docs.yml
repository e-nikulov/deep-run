name: Finalize M5 closure documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-m5-closure-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record final M5 acceptance
        shell: python
        run: |
          from pathlib import Path

          p = Path("docs/development/periscope-ballast-gameplay.md")
          text = p.read_text(encoding="utf-8")
          old = "Status: CORRECTIVE CLOSURE CANDIDATE — FINAL CI / HUMAN ACCEPTANCE PENDING"
          new = """Status: ACCEPTED / M5 COMPLETE

          Final corrective acceptance is anchored by PR #11 head `0efd5ff2eaa6fa504c2f60a02a381cec93331626` and GitHub Actions run `34775791243` (#770). Both Windows Debug and Release passed production Antey contract validation, configure, build, all registered CTest targets, windowed acoustic smoke, P-700 production launch smoke, and M5/P-700 acceptance-artifact retention. The accepted tree was merged to `main` as `678201074d093fb71806101cf21be375d0e271fc`."""
          if text.count(old) != 1:
              raise RuntimeError("periscope/ballast status marker is missing or duplicated")
          p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          p = Path("docs/development/m5-combat-playground.md")
          text = p.read_text(encoding="utf-8")
          marker = "## Milestone closure\n\n"
          addition = """## Milestone closure

          Final corrective M5 closure is anchored by PR #11 head `0efd5ff2eaa6fa504c2f60a02a381cec93331626`, GitHub Actions run `34775791243` (#770), and merge commit `678201074d093fb71806101cf21be375d0e271fc`. Debug and Release both passed production Antey contract validation, configure, build, the complete registered CTest set, windowed acoustic smoke, P-700 production launch smoke, and M5/P-700 acceptance-artifact retention. This supersedes the earlier technical closure anchor below while preserving it as milestone history.

"""
          if text.count(marker) != 1:
              raise RuntimeError("M5 closure heading is missing or duplicated")
          p.write_text(text.replace(marker, addition, 1), encoding="utf-8", newline="\n")
      - name: Commit final documentation and remove helper
        shell: bash
        run: |
          git config user.name "DeepRun CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/finalize-m5-closure-docs.yml
          git add docs/development/periscope-ballast-gameplay.md docs/development/m5-combat-playground.md
          git commit -m "docs: record final M5 corrective acceptance"
          git push origin HEAD:main
