name: M5 Propeller Binding Repair

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar
    paths:
      - Tools/patch_m5_propeller_binding.py
      - .github/workflows/m5-propeller-diagnostic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply production propeller binding repair
        run: python Tools/patch_m5_propeller_binding.py
      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          grep -q "drawableMeshNodeIndices" Engine/Assets/ModelAsset.h
          grep -q "ModelBindingTransformOverride" Engine/Render/ModelDraw.h
          grep -q "propellerNodeBindingIndices_" Game/PhysicalPlayground.h
          ! grep -q "propellerMeshNodeIndices_" Game/PhysicalPlayground.cpp
      - name: Commit repair and remove temporary patch workflow
        shell: bash
        run: |
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git add Engine Game Tests
          git rm Tools/patch_m5_propeller_binding.py .github/workflows/m5-propeller-diagnostic.yml
          git commit -m "fix: animate transform-only production propeller roots"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
