name: H4 Apply Visual Acceptance Fix

on:
  push:
    branches:
      - tmp/m5-h4-scalable-environment
    paths:
      - .github/workflows/h4-visual-acceptance-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply H4 visual acceptance fix
        shell: pwsh
        run: ./Tools/CI/apply_h4_visual_acceptance_fix.ps1
        # Strict anchor replacement; the script removes this workflow after a successful patch.
