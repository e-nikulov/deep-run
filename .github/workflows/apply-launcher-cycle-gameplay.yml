name: Apply launcher cycle gameplay

on:
  push:
    branches:
      - fix/m5-weapon-ux-soft-envelopes
    paths:
      - Tools/apply_launcher_cycle_gameplay.py
      - .github/workflows/apply-launcher-cycle-gameplay.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-weapon-ux-soft-envelopes
          fetch-depth: 0
      - name: Apply launcher-cycle patch
        shell: pwsh
        run: python Tools/apply_launcher_cycle_gameplay.py
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-debug
      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-debug --parallel
      - name: Test
        shell: pwsh
        run: ctest --preset windows-debug --output-on-failure
      - name: Commit patch and remove temporary scaffolding
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm Tools/apply_launcher_cycle_gameplay.py .github/workflows/apply-launcher-cycle-gameplay.yml
          git add -A
          git commit -m "feat: model launcher cycles and sequential weapon ripples"
          git push origin HEAD:fix/m5-weapon-ux-soft-envelopes
