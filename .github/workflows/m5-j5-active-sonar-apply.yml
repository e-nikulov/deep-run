name: M5 J5 Active Sonar Apply

on:
  push:
    branches:
      - tmp/m5-j5-active-sonar-command
    paths:
      - Tools/CI/apply_m5_j5_active_sonar.ps1
      - .github/workflows/m5-j5-active-sonar-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply J5 patch
        shell: pwsh
        run: ./Tools/CI/apply_m5_j5_active_sonar.ps1
      - name: Commit clean J5 tree
        shell: pwsh
        run: |
          Remove-Item Tools/CI/apply_m5_j5_active_sonar.ps1
          Remove-Item .github/workflows/m5-j5-active-sonar-apply.yml
          git add -A
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git config user.name "Deep Run CI"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "feat: add M5 J5 explicit active sonar command"
            git push origin HEAD:tmp/m5-j5-active-sonar-command
          }
