name: One-shot surfaced hydrostatics audit

on:
  push:
    branches:
      - fix/m5-surface-hydrostatics-calibration
    paths:
      - Tools/Blender/audit_surface_hydrostatics.py
      - .github/workflows/one-shot-surface-hydrostatics-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Blender 5.2.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'blender-5.2.1-windows-x64.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'blender-5.2.1'
          if (-not (Test-Path $dir)) {
            curl.exe -L --fail --retry 4 --retry-delay 5 `
              -o $zip `
              https://download.blender.org/release/Blender5.2/blender-5.2.1-windows-x64.zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
          }
          $blender = Get-ChildItem -Path $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $blender) { throw 'Blender 5.2.1 executable not found' }
          "BLENDER_EXE=$($blender.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $blender.FullName --version

      - name: Audit production surfaced geometry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:BLENDER_EXE `
            --background `
            'Content/submarines/Antey/Antey_GameReady.blend' `
            --python 'Tools/Blender/audit_surface_hydrostatics.py'
          if ($LASTEXITCODE -ne 0) { throw "Surface hydrostatics audit failed with exit code $LASTEXITCODE" }
          Get-Content -Raw 'artifacts/surface-hydrostatics/audit.json'

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: surface-hydrostatics-audit
          if-no-files-found: error
          path: artifacts/surface-hydrostatics/audit.json
