name: Apply P700 cruise range repair

on:
  push:
    branches:
      - fix/weapon-runtime-range-budgets

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/weapon-runtime-range-budgets
          fetch-depth: 0

      - name: Apply scoped repair
        shell: pwsh
        run: python Tools/fix_p700_cruise_range.py

      - name: Validate patch
        shell: pwsh
        run: git diff --check

      - name: Commit repaired runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Tools/fix_p700_cruise_range.py
          Remove-Item .github/workflows/apply-p700-cruise-fix.yml
          if (Test-Path .github/workflows/fix-p700-cruise-range.yml) {
            Remove-Item .github/workflows/fix-p700-cruise-range.yml
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: terminate P-700 cleanly at cruise range limit"
          if ($LASTEXITCODE -ne 0) { throw "P-700 cruise-range commit failed" }
          git push origin HEAD:fix/weapon-runtime-range-budgets
          if ($LASTEXITCODE -ne 0) { throw "P-700 cruise-range push failed" }
