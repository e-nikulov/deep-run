name: M5 P700 shared physics fix

on:
  push:
    paths:
      - '.github/workflows/m5-p700-shared-physics-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Reuse the existing M5 PhysicsWorld
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("Tests/M5P700Checks.h"); s=p.read_text(); s=s.replace("[[nodiscard]] inline bool RunM5P700Checks()", "[[nodiscard]] inline bool RunM5P700Checks(Physics::PhysicsWorld& physicsWorld)", 1); old="    Diagnostics::Logger logger;\n    Physics::PhysicsWorld physicsWorld(logger);\n    if (!physicsWorld.Initialize())\n    {\n        return fail(\"PhysicsWorld initialization\");\n    }\n\n"; assert s.count(old)==1; p.write_text(s.replace(old,"",1))'
          python -c 'from pathlib import Path; p=Path("Tests/M5CombatImpactChecks.h"); s=p.read_text(); assert s.count("RunM5P700Checks()") == 1; p.write_text(s.replace("RunM5P700Checks()", "RunM5P700Checks(physicsWorld)", 1))'
          grep -q 'RunM5P700Checks(Physics::PhysicsWorld& physicsWorld)' Tests/M5P700Checks.h
          grep -q 'RunM5P700Checks(physicsWorld)' Tests/M5CombatImpactChecks.h
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/m5-p700-shared-physics-fix.yml
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git add -A
          git commit -m 'test: reuse shared physics for P-700 lifecycle'
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
