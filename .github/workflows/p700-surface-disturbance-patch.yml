name: P700 surface disturbance patch

on:
  push:
    branches:
      - feature/p700-signature-launch-vfx

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'stage P-700 surface disturbance patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p700-signature-launch-vfx
      - name: Apply production surface disturbance integration
        run: python Tools/p700_surface_disturbance_patch.py
      - name: Commit patch and remove one-shot helpers
        shell: bash
        run: |
          git rm .github/workflows/p700-surface-disturbance-patch.yml Tools/p700_surface_disturbance_patch.py
          git add Engine/Render/GerstnerSurface.h Engine/Render/GerstnerSurface.cpp Engine/Render/D3D12Renderer.h Engine/Render/D3D12Renderer.cpp Shaders/GerstnerSurface.hlsl Game/Weapons/P700LaunchVfx.h Game/Weapons/P700LaunchVfx.cpp Game/Weapons/P700SurfacePresentation.h Config/p700_vfx.json Game/Combat/CombatPlaygroundView.h Game/Combat/CombatPlaygroundWindowedComposition.h Game/PhysicalPlayground.h Game/PhysicalPlayground.cpp DeepRun/Main.cpp Tests/P700LaunchVfxTest.cpp
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git commit -m "vfx: deform surface around P-700 breach"
          git push origin HEAD:feature/p700-signature-launch-vfx
