  patch:
    if: github.event.head_commit.message == 'stage P-700 surface disturbance patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p700-signature-launch-vfx
      - name: Apply production surface disturbance integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

