name: Fix civilian scenario boundary

on:
  push:
    branches:
      - feature/periscope-ballast-gameplay

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch production civilian enable boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Game/Combat/CombatPlaygroundRuntime.h'
          $text = [IO.File]::ReadAllText($path)

          $oldGuard = 'if (civilian_ || p700AcceptanceMode_)'
          $newGuard = 'if (civilian_ || !civilianGameplayEnabled_ || p700AcceptanceMode_)'
          if (($text.Split($oldGuard).Count - 1) -ne 1) { throw 'civilian guard anchor not unique' }
          $text = $text.Replace($oldGuard, $newGuard)

          $oldFactory = @'
        runtime->p700CarrierLaunchContract_ = std::move(p700CarrierLaunchContract);
        runtime->p700LauncherInventory_ = std::move(p700LauncherInventory);
        return std::move(*runtime);
'@
          $newFactory = @'
        runtime->p700CarrierLaunchContract_ = std::move(p700CarrierLaunchContract);
        runtime->p700LauncherInventory_ = std::move(p700LauncherInventory);
        runtime->civilianGameplayEnabled_ = !p700AcceptanceMode;
        return std::move(*runtime);
'@
          if (($text.Split($oldFactory).Count - 1) -ne 1) { throw 'production factory anchor not unique' }
          $text = $text.Replace($oldFactory, $newFactory)

          $oldMember = '    bool p700AcceptanceMode_ = false;'
          $newMember = "    bool p700AcceptanceMode_ = false;`r`n    bool civilianGameplayEnabled_ = false;"
          if (($text.Split($oldMember).Count - 1) -ne 1) { throw 'runtime member anchor not unique' }
          $text = $text.Replace($oldMember, $newMember)

          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          git diff --check
          git diff -- Game/Combat/CombatPlaygroundRuntime.h

      - name: Commit fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Game/Combat/CombatPlaygroundRuntime.h
          git commit -m 'fix: keep civilian traffic production-only'
          git push origin HEAD:feature/periscope-ballast-gameplay
