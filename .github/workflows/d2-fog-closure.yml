name: Apply D2 fog closure

on:
  push:
    branches:
      - design/perception-fog-salvo-awareness
    paths:
      - Tools/Dev/apply_d2_fog_closure.py
      - .github/workflows/d2-fog-closure.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/perception-fog-salvo-awareness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python Tools/Dev/apply_d2_fog_closure.py
      - name: Commit fog closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Engine Game Simulation DeepRun Tests docs
          if git diff --cached --quiet; then
            echo "Patch produced no changes"
            exit 1
          fi
          git commit -m "feat: close D2 normal-play fog-of-war presentation"
          git push origin HEAD:design/perception-fog-salvo-awareness
