name: M5 V1.7 Local Surface Continuity Repair

on:
  push:
    branches:
      - fix/m5-v1-2-underwater-camera-scale

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/m5-v1-2-underwater-camera-scale
          fetch-depth: 0
      - name: Apply scoped local surface continuity repair
        run: python .github/m5_v17_local_surface_continuity_fix.py
      - name: Validate diff
        run: git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Game/PhysicalPlayground.h Tests/M5ScalableEnvironmentPresentationChecks.h
          git commit -m "fix: remove local camera surface snap"
          git push origin HEAD:fix/m5-v1-2-underwater-camera-scale
