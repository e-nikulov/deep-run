name: Final Antey Runtime Material Contract Fix

on:
  push:
    branches:
      - fix/antey-pacific-visuals
    paths:
      - .github/workflows/fix-antey-runtime-material-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch production runtime guard and self-remove
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Game/PhysicalPlayground.cpp'
          $text = Get-Content -Raw $path
          $old = '(*model)->materials.size() != 2U)'
          $new = '(*model)->materials.size() != 3U)'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one stale Antey runtime material guard, found $count" }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Runtime contract diff check failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          git rm '.github/workflows/fix-antey-runtime-material-contract.yml'
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged runtime contract diff check failed' }
          git commit -m 'fix: align Antey runtime material contract'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime contract commit failed' }
          git push origin HEAD:fix/antey-pacific-visuals
          if ($LASTEXITCODE -ne 0) { throw 'Runtime contract push failed' }
