name: Apply M5 surfaced hydrostatic correction

on:
  push:
    branches:
      - fix/m5-final-closure-gaps
    paths:
      - Tools/apply_m5_surface_hydrostatic_mode.py
      - .github/workflows/apply-m5-surface-hydrostatic-mode.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-final-closure-gaps
      - name: Apply surfaced hydrostatic correction
        run: python Tools/apply_m5_surface_hydrostatic_mode.py
      - name: Commit generated repair
        shell: bash
        run: |
          git config user.name "DeepRun CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "fix: add surfaced hydrostatic equilibrium mode"
          git push origin HEAD:fix/m5-final-closure-gaps
