name: P700 Runtime Covers LOD Repair

on:
  push:
    paths:
      - '.github/workflows/p700-runtime-covers-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0

      - name: Restore pre-migration GameReady LOD partition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git checkout 0700a1819fc3c7e0f77c0ec1d053ef8404487f8a -- Content/submarines/Antey/Antey_GameReady.blend
          if ($LASTEXITCODE -ne 0) { throw 'Failed to restore pre-migration Antey GameReady BLEND' }

      - name: Download Blender 5.2.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'blender-5.2.1-windows-x64.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'blender-5.2.1'
          curl.exe -L --fail --retry 4 --retry-delay 5 `
            -o $zip `
            https://download.blender.org/release/Blender5.2/blender-5.2.1-windows-x64.zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $blender = Get-ChildItem -Path $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $blender) { throw 'Blender 5.2.1 executable not found' }
          "BLENDER_EXE=$($blender.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Promote covers without changing their authored LOD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:BLENDER_EXE `
            --background `
            --python 'Tools/Blender/fix_antey_animation_ownership.py' `
            -- `
            --blend 'Content/submarines/Antey/Antey_GameReady.blend'
          if ($LASTEXITCODE -ne 0) { throw "Antey P-700 cover LOD promotion failed: $LASTEXITCODE" }

      - name: Export and validate canonical LOD0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'artifacts/p700-cover-lod-repair' | Out-Null
          & $env:BLENDER_EXE `
            --background 'Content/submarines/Antey/Antey_GameReady.blend' `
            --python 'Tools/Blender/export_runtime_glb.py' `
            -- `
            --output 'Content/submarines/Antey/Antey.glb' `
            --lod 0 `
            --animation-contract none
          if ($LASTEXITCODE -ne 0) { throw "Antey runtime GLB export failed: $LASTEXITCODE" }
          & $env:BLENDER_EXE `
            --background `
            --python 'Tools/Blender/validate_runtime_glb.py' `
            -- `
            --glb 'Content/submarines/Antey/Antey.glb' `
            --output 'artifacts/p700-cover-lod-repair/runtime-glb.json' `
            --asset antey
          if ($LASTEXITCODE -ne 0) { throw "Antey runtime GLB validation failed: $LASTEXITCODE" }
          python Tools/Blender/validate_animation_ownership.py `
            -- `
            --antey 'Content/submarines/Antey/Antey.glb' `
            --p700 'Content/Weapons/P700/P700_Granit.glb' `
            --output 'artifacts/p700-cover-lod-repair/animation-ownership.json'
          if ($LASTEXITCODE -ne 0) { throw "Animation ownership validation failed: $LASTEXITCODE" }

      - name: Regenerate canonical sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:BLENDER_EXE `
            --background 'Content/submarines/Antey/Antey_GameReady.blend' `
            --python 'Tools/Blender/write_production_sidecars.py' `
            -- `
            --asset antey `
            --source 'Content/submarines/Antey/Source/Antey_Source.blend' `
            --glb 'Content/submarines/Antey/Antey.glb' `
            --asset-json 'Content/submarines/Antey/Antey.asset.json' `
            --authoring-json 'Content/submarines/Antey/Antey.authoring.json'
          if ($LASTEXITCODE -ne 0) { throw "Antey sidecar regeneration failed: $LASTEXITCODE" }
          $asset = Get-Content -Raw 'Content/submarines/Antey/Antey.asset.json' | ConvertFrom-Json -Depth 100
          foreach ($lod in @('LOD0','LOD1','LOD2','LOD3')) {
            if ([int]$asset.lods.$lod.objects -ne 78) {
              throw "P-700 cover LOD partition regression: $lod objects=$($asset.lods.$lod.objects), expected 78"
            }
          }
          Write-Host 'P-700 cover LOD partition PASS: 12 source-derived covers retained in each authored LOD'

      - name: Mirror runtime assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Force 'Content/submarines/Antey/Antey.glb' 'Engine/Assets/submarines/Antey/Antey.glb'
          Copy-Item -Force 'Content/submarines/Antey/Antey.asset.json' 'Engine/Assets/submarines/Antey/Antey.asset.json'
          Copy-Item -Force 'Content/submarines/Antey/Antey.authoring.json' 'Engine/Assets/submarines/Antey/Antey.authoring.json'

      - name: Commit corrected production assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git add `
            Content/submarines/Antey/Antey_GameReady.blend `
            Content/submarines/Antey/Antey.glb `
            Content/submarines/Antey/Antey.asset.json `
            Content/submarines/Antey/Antey.authoring.json `
            Engine/Assets/submarines/Antey/Antey.glb `
            Engine/Assets/submarines/Antey/Antey.asset.json `
            Engine/Assets/submarines/Antey/Antey.authoring.json
          git diff --cached --check
          if (git diff --cached --quiet) { throw 'No corrected P-700 cover asset changes generated' }
          git commit -m 'fix: preserve Antey P-700 cover LOD partition'
          git push origin HEAD:feature/m5-v2-player-navigation-sonar

      - name: Upload LOD repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p700-cover-lod-repair
          if-no-files-found: warn
          path: artifacts/p700-cover-lod-repair/**
