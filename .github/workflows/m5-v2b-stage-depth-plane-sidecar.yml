name: M5 V2-B Stage Depth Plane Sidecar

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Patch canonical and staged authoring sidecars
        run: python .github/m5_v2b_stage_depth_plane_sidecar.py
      - name: Validate diff
        run: git diff --check
      - name: Commit sidecars
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Content/submarines/Antey/Antey.authoring.json Engine/Assets/submarines/Antey/Antey.authoring.json
          git commit -m "content: publish production depth-plane node bindings"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
