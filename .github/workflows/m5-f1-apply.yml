name: M5 F1 Apply Enemy Active Ranging

on:
  push:
    branches:
      - tmp/m5-f1-enemy-active-ranging
    paths:
      - Tools/CI/apply_m5_f1_enemy_active_ranging.ps1
      - .github/workflows/m5-f1-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m5-f1-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/m5-f1-enemy-active-ranging
          fetch-depth: 0

      - name: Apply M5-F.1 enemy active ranging
        shell: pwsh
        run: .\Tools\CI\apply_m5_f1_enemy_active_ranging.ps1

      - name: Commit clean implementation
        shell: pwsh
        run: |
          Remove-Item .\Tools\CI\apply_m5_f1_enemy_active_ranging.ps1
          Remove-Item .\.github\workflows\m5-f1-apply.yml
          git config user.name "Deep Run CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add destroyer active fire-control ranging"
          git push origin HEAD:tmp/m5-f1-enemy-active-ranging
