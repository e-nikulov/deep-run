name: M5 V2-B Dive Presentation Repair

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Apply scoped dive presentation repair
        run: python .github/m5_v2b_dive_presentation_fix.py
      - name: Validate diff
        run: git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DeepRun/Main.cpp Game/Combat/CombatCommandUi.h Game/Combat/CombatCommandUi.cpp Game/PhysicalPlayground.h Game/PhysicalPlayground.cpp Game/Submarine/ProductionAnteyAsset.h Game/Submarine/ProductionAnteyAsset.cpp
          git commit -m "feat: present dive controls and vessel telemetry"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
