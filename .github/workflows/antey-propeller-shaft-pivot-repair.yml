name: Antey Propeller Shaft Pivot Repair

on:
  push:
    branches:
      - fix/antey-propeller-runtime-presentation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair shaft-centre source and regression
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one patch match, got {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'Tools/Blender/write_production_sidecars.py',
              '''    hubs = [mesh for mesh in meshes if "_Hub" in mesh.name]\n    if not hubs:\n        raise RuntimeError(f"Propeller assembly has no source-first hub geometry: {name}")\n    hub_minimum, hub_maximum = bounds(hubs)\n    pivot = (hub_minimum + hub_maximum) * 0.5\n    if not all(math.isfinite(value) for value in pivot):\n        raise RuntimeError(f"Propeller hub pivot is non-finite: {name}")''',
              '''    # The source-first propeller partition contains seven equal blade-sector meshes.\n    # Historical naming called the first sector *_Hub even though it is not a standalone hub;\n    # using that sector's AABB centre moves the shaft axis roughly 0.88 m off the true\n    # seven-fold rotational centre.  Match build_antey_source_first.py: the physical shaft\n    # centre is the centroid of the complete authored propeller vertex set.\n    world_points = [\n        mesh.matrix_world @ vertex.co\n        for mesh in meshes\n        for vertex in mesh.data.vertices\n    ]\n    if not world_points:\n        raise RuntimeError(f"Propeller assembly has no production vertices: {name}")\n    pivot = sum(world_points, Vector()) / len(world_points)\n    if not all(math.isfinite(value) for value in pivot):\n        raise RuntimeError(f"Propeller shaft pivot is non-finite: {name}")''')

          authoring_path = Path('Content/submarines/Antey/Antey.authoring.json')
          authoring = json.loads(authoring_path.read_text(encoding='utf-8'))
          corrected = {
              'propeller.port': [-76.05402327389548, 2.6607370456596278, -0.4349635061550418],
              'propeller.starboard': [-76.05406508671558, -2.6606815571805074, -0.43480268245667947],
          }
          for record in authoring['propellers']:
              semantic = record['semanticId']
              if semantic not in corrected:
                  raise RuntimeError(f'unexpected propeller semantic: {semantic}')
              origin = corrected[semantic]
              record['origin'] = origin
              transform = record['transform']
              transform[0][3], transform[1][3], transform[2][3] = origin
          authoring_path.write_text(json.dumps(authoring, indent=2) + '\n', encoding='utf-8')

          test_insert_marker = '''        const std::array<DeepRun::Render::ModelBindingTransformOverride, 1> overrides{{\n            {.bindingIndex = propeller.presentationNodeBindingIndex,\n             .bindingLocalPostTransform = quarterTurn,\n             .modelSpacePivot = propeller.localOrigin}}};'''
          test_insert = r'''        // The production subtree is seven equal blade-sector draws.  The historical
        // *_Hub label is only the first sector and must never define the shaft pivot.
        if (binding.drawableMeshNodeIndices.size() != 7U)
        {
            std::cerr << "[IG1-A] production propeller must resolve exactly seven blade-sector draws\n";
            return false;
        }
        DeepRun::Assets::ModelVector3 completeVertexSum{};
        std::size_t completeVertexCount = 0U;
        std::size_t expectedBladeTriangleCount = 0U;
        std::vector<float> bladeAngles;
        std::vector<float> bladeRadii;
        bladeAngles.reserve(binding.drawableMeshNodeIndices.size());
        bladeRadii.reserve(binding.drawableMeshNodeIndices.size());
        for (const std::size_t nodeIndex : binding.drawableMeshNodeIndices)
        {
            const auto& node = model->Get()->nodes[nodeIndex];
            DeepRun::Assets::ModelVector3 bladeVertexSum{};
            std::size_t bladeVertexCount = 0U;
            std::size_t bladeTriangleCount = 0U;
            for (const std::size_t primitiveIndex : node.primitiveIndices)
            {
                if (primitiveIndex >= model->Get()->primitives.size())
                {
                    return false;
                }
                const auto baselineDraw = std::find_if(
                    baselineDraws->begin(), baselineDraws->end(), [&](const auto& candidate) {
                        return candidate.nodeIndex == nodeIndex && candidate.primitiveIndex == primitiveIndex;
                    });
                if (baselineDraw == baselineDraws->end())
                {
                    return false;
                }
                const auto& primitive = model->Get()->primitives[primitiveIndex];
                bladeTriangleCount += primitive.indices.size() / 3U;
                for (const auto& vertex : primitive.vertices)
                {
                    const auto point = transformPoint(baselineDraw->modelToWorld, vertex.position);
                    bladeVertexSum.x += point.x;
                    bladeVertexSum.y += point.y;
                    bladeVertexSum.z += point.z;
                    completeVertexSum.x += point.x;
                    completeVertexSum.y += point.y;
                    completeVertexSum.z += point.z;
                    ++bladeVertexCount;
                    ++completeVertexCount;
                }
            }
            if (bladeVertexCount == 0U || bladeTriangleCount == 0U)
            {
                return false;
            }
            if (expectedBladeTriangleCount == 0U)
            {
                expectedBladeTriangleCount = bladeTriangleCount;
            }
            else if (bladeTriangleCount != expectedBladeTriangleCount)
            {
                std::cerr << "[IG1-A] production seven-blade partition is not topology-equivalent\n";
                return false;
            }
            const float inverseBladeVertexCount = 1.0F / static_cast<float>(bladeVertexCount);
            const DeepRun::Assets::ModelVector3 bladeCentroid{
                .x = bladeVertexSum.x * inverseBladeVertexCount,
                .y = bladeVertexSum.y * inverseBladeVertexCount,
                .z = bladeVertexSum.z * inverseBladeVertexCount};
            const float dy = bladeCentroid.y - propeller.localOrigin.y;
            const float dz = bladeCentroid.z - propeller.localOrigin.z;
            bladeRadii.push_back(std::hypot(dy, dz));
            float angle = std::atan2(dz, dy);
            if (angle < 0.0F)
            {
                angle += 6.28318530717958647692F;
            }
            bladeAngles.push_back(angle);
        }
        if (completeVertexCount == 0U)
        {
            return false;
        }
        const float inverseCompleteVertexCount = 1.0F / static_cast<float>(completeVertexCount);
        const DeepRun::Assets::ModelVector3 completeGeometryCentroid{
            .x = completeVertexSum.x * inverseCompleteVertexCount,
            .y = completeVertexSum.y * inverseCompleteVertexCount,
            .z = completeVertexSum.z * inverseCompleteVertexCount};
        if (distanceSquared(completeGeometryCentroid, propeller.localOrigin) > 2.5e-5F)
        {
            std::cerr << "[IG1-A] propeller sidecar pivot does not match the complete seven-blade shaft centre\n";
            return false;
        }
        float meanBladeRadius = 0.0F;
        for (const float radius : bladeRadii)
        {
            meanBladeRadius += radius;
        }
        meanBladeRadius /= static_cast<float>(bladeRadii.size());
        if (meanBladeRadius <= 0.5F ||
            std::any_of(bladeRadii.begin(), bladeRadii.end(), [&](const float radius) {
                return std::abs(radius - meanBladeRadius) > 0.08F;
            }))
        {
            std::cerr << "[IG1-A] seven blade centroids do not share one shaft-centred radius\n";
            return false;
        }
        std::sort(bladeAngles.begin(), bladeAngles.end());
        constexpr float SevenBladeStepRadians = 6.28318530717958647692F / 7.0F;
        for (std::size_t index = 0; index < bladeAngles.size(); ++index)
        {
            const float next = index + 1U < bladeAngles.size()
                                   ? bladeAngles[index + 1U]
                                   : bladeAngles.front() + 6.28318530717958647692F;
            if (std::abs((next - bladeAngles[index]) - SevenBladeStepRadians) > 0.08F)
            {
                std::cerr << "[IG1-A] production propeller centroids do not form a 360/7 blade ring\n";
                return false;
            }
        }

        const std::array<DeepRun::Render::ModelBindingTransformOverride, 1> overrides{{
            {.bindingIndex = propeller.presentationNodeBindingIndex,
             .bindingLocalPostTransform = quarterTurn,
             .modelSpacePivot = propeller.localOrigin}}};'''
          replace_once('Tests/TestMain.cpp', test_insert_marker, test_insert)

          vertex_marker = '''                if (!std::isfinite(beforeRadiusSquared) || !std::isfinite(afterRadiusSquared) ||\n                    std::abs(beforeRadiusSquared - afterRadiusSquared) > tolerance)\n                {\n                    return false;\n                }\n                checkedGeometry = true;'''
          vertex_replacement = '''                if (!std::isfinite(beforeRadiusSquared) || !std::isfinite(afterRadiusSquared) ||\n                    std::abs(beforeRadiusSquared - afterRadiusSquared) > tolerance)\n                {\n                    return false;\n                }\n                // A shaft rotation is explicitly model-space X through the seven-blade centre:\n                // X must stay invariant and the Y/Z offset must receive the quarter turn.\n                const float expectedY = propeller.localOrigin.y - (before.z - propeller.localOrigin.z);\n                const float expectedZ = propeller.localOrigin.z + (before.y - propeller.localOrigin.y);\n                if (std::abs(after.x - before.x) > 2.0e-3F ||\n                    std::abs(after.y - expectedY) > 2.0e-3F ||\n                    std::abs(after.z - expectedZ) > 2.0e-3F)\n                {\n                    std::cerr << "[IG1-A] propeller presentation is not a model-space X shaft rotation\\n";\n                    return false;\n                }\n                checkedGeometry = true;'''
          replace_once('Tests/TestMain.cpp', vertex_marker, vertex_replacement)

          doc = Path('docs/development/antey-propeller-runtime-presentation-fix.md')
          text = doc.read_text(encoding='utf-8')
          text += '''\n\n## Shaft-axis follow-up\n\nHuman close-up review rejected the first double-sided-only result: only one sampled phase resembled the canonical propeller. Raw `Antey.glb` inspection proved the disk lies in model Y/Z and therefore the physical shaft axis is model-space X. The remaining defect was the axis **position**, not its direction.\n\nThe production GLB contains seven equal 819-triangle blade-sector draws per propeller. The historically named `*_Hub` draw is one of those seven sectors, not an independent hub. `write_production_sidecars.py` incorrectly used that one sector's bounding-box centre as the shaft pivot, placing the parallel X axis about 0.88 m away from the seven-fold rotational centre. The source-first assembler already used the correct complete-geometry centroid. Sidecar generation now uses the same complete seven-blade vertex centroid, while the canonical GLB remains unchanged.\n\nRegression now proves seven equal blade draws, approximately uniform 360/7 centroid spacing about the authored pivot, complete-geometry-centroid/pivot agreement, and explicit model-space-X quarter-turn behaviour in addition to the existing rigid-radius invariant.\n'''
          doc.write_text(text, encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 .tmp_shaft_pivot_repair.py
          python .tmp_shaft_pivot_repair.py
          Remove-Item .tmp_shaft_pivot_repair.py
          git diff --check

      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git rm .github/workflows/antey-propeller-shaft-pivot-repair.yml
          git add Content/submarines/Antey/Antey.authoring.json Tools/Blender/write_production_sidecars.py Tests/TestMain.cpp docs/development/antey-propeller-runtime-presentation-fix.md
          git commit -m "fix: rotate Antey propellers around true shaft centres"
          git push origin HEAD:fix/antey-propeller-runtime-presentation
