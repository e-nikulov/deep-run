name: W1-K live thunder patch

on:
  push:
    branches:
      - feature/w1-k-beaufort-weather-coupling
    paths:
      - Tools/CI/apply_w1_k_live_thunder.py
      - .github/workflows/w1-k-live-thunder-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w1-k-live-thunder-patch
  cancel-in-progress: true

jobs:
  apply-build-test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply live thunder patch
        shell: pwsh
        run: python Tools/CI/apply_w1_k_live_thunder.py

      - name: Configure Debug
        shell: pwsh
        run: cmake --preset windows-debug

      - name: Build Debug
        shell: pwsh
        run: cmake --build --preset windows-debug --parallel

      - name: Test Debug
        shell: pwsh
        run: ctest --preset windows-debug --output-on-failure

      - name: Commit validated runtime integration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Engine/Core/Engine.cpp Game/PhysicalPlayground.h Game/PhysicalPlayground.cpp DeepRun/Main.cpp
          if (git diff --cached --quiet) {
            throw "W1-K live thunder patch produced no product changes"
          }
          git commit -m "W1-K: connect live lightning to delayed thunder audio"
          git push origin HEAD:feature/w1-k-beaufort-weather-coupling
