name: Apply weapon runtime range repair

on:
  push:
    branches:
      - fix/weapon-runtime-range-budgets

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/weapon-runtime-range-budgets
          fetch-depth: 0

      - name: Apply scoped repair
        shell: pwsh
        run: python Tools/apply_weapon_range_fix.py

      - name: Validate patch
        shell: pwsh
        run: git diff --check

      - name: Commit repaired runtime
        shell: pwsh
        run: |
          Remove-Item Tools/apply_weapon_range_fix.py
          Remove-Item .github/workflows/apply-weapon-range-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: enforce weapon runtime range budgets"
            git push origin HEAD:fix/weapon-runtime-range-budgets
          }
