name: Apply weapon runtime range repair

on:
  push:
    branches:
      - fix/weapon-runtime-range-budgets

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/weapon-runtime-range-budgets
          fetch-depth: 0

      - name: Apply scoped repair
        id: repair
        continue-on-error: true
        shell: pwsh
        run: |
          python Tools/apply_weapon_range_fix.py 2>&1 | Tee-Object -FilePath weapon-range-repair.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve repair diagnostics
        if: steps.repair.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f weapon-range-repair.txt
          git commit -m "chore: capture weapon range repair failure"
          if ($LASTEXITCODE -ne 0) { throw "diagnostic commit failed" }
          git push origin HEAD:fix/weapon-runtime-range-budgets
          if ($LASTEXITCODE -ne 0) { throw "diagnostic push failed" }

      - name: Fail after diagnostics
        if: steps.repair.outcome == 'failure'
        shell: pwsh
        run: throw "weapon runtime range repair failed; diagnostic text committed"

      - name: Validate patch
        if: steps.repair.outcome == 'success'
        shell: pwsh
        run: git diff --check

      - name: Commit repaired runtime
        if: steps.repair.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Tools/apply_weapon_range_fix.py
          Remove-Item .github/workflows/apply-weapon-range-fix.yml
          if (Test-Path weapon-range-repair.txt) { Remove-Item weapon-range-repair.txt }
          if (Test-Path weapon-range-repair.log) { Remove-Item weapon-range-repair.log }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix: enforce weapon runtime range budgets"
            if ($LASTEXITCODE -ne 0) { throw "repair commit failed" }
            git push origin HEAD:fix/weapon-runtime-range-budgets
            if ($LASTEXITCODE -ne 0) { throw "repair push failed" }
          }
