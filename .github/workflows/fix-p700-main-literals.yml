name: Fix P700 smoke literals

on:
  push:
    paths:
      - '.github/workflows/fix-p700-main-literals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Apply fix
        run: python Tools/fix_p700_main_literals.py
      - name: Commit product fix
        shell: bash
        run: |
          rm -f Tools/fix_p700_main_literals.py .github/workflows/fix-p700-main-literals.yml
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git add -A
          git commit -m "fix: repair P-700 smoke lifecycle logging literals"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
