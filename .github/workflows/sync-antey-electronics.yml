name: Sync Antey Electronics

on:
  push:
    branches:
      - feature/antey-electronic-intelligence-suite
    paths:
      - Content/submarines/Antey/Antey.electronics.json
      - Tools/sync_antey_electronics_contract.py
      - Tools/apply_antey_device_control_hud_patch.py
      - .github/workflows/sync-antey-electronics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync production authoring mappings
        shell: pwsh
        run: python Tools/sync_antey_electronics_contract.py

      - name: Apply device control HUD patch
        shell: pwsh
        run: |
          python Tools/apply_antey_device_control_hud_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'device control HUD patch failed' }
          git diff --check

      - name: Build HUD integration
        shell: pwsh
        run: |
          cmake --preset windows-debug
          cmake --build --preset windows-debug --target DeepRun DeepRunTests DeepRunAnteyElectronicSuiteTests

      - name: Test HUD integration
        shell: pwsh
        run: ctest --preset windows-debug -R "DeepRunTests|DeepRunAnteyElectronicSuiteTests" --output-on-failure

      - name: Commit synced sidecars docs and HUD
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/sync-antey-electronics.yml | Set-Content -Encoding utf8 .github/workflows/sync-antey-electronics.yml
          Remove-Item -Force Tools/apply_antey_device_control_hud_patch.py -ErrorAction SilentlyContinue
          Remove-Item -Force .github/workflows/add-antey-device-control-hud.yml -ErrorAction SilentlyContinue
          Remove-Item -Force .github/workflows/add-antey-device-control-hud-v2.yml -ErrorAction SilentlyContinue
          git add -A
          git diff --cached --check
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "feat: add Antey device control menu to HUD"
          git push origin HEAD:feature/antey-electronic-intelligence-suite
