name: Apply M5 weapon UX follow-up

on:
  push:
    branches:
      - fix/m5-weapon-ux-soft-envelopes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-weapon-ux-soft-envelopes
          fetch-depth: 0
      - name: Apply follow-up patch
        run: python Tools/apply_weapon_ux_followup.py
      - name: Validate patch
        run: git diff --check && git diff --stat
      - name: Commit production/test follow-up and remove scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm Tools/apply_weapon_ux_followup.py .github/workflows/apply-m5-weapon-ux-followup.yml
          git add -A
          git commit -m "fix: align acceptance flow with automatic weapon readiness"
          git push origin HEAD:fix/m5-weapon-ux-soft-envelopes
