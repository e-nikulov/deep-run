name: Torpedo Off-Target Impact Refinement

on:
  push:
    paths:
      - '.github/workflows/torpedo-off-target-impact.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/torpedo-active-passive-seeker
          fetch-depth: 0
      - name: Apply refinement
        run: python Tools/patch_torpedo_off_target_impact.py
      - name: Verify refinement
        shell: bash
        run: |
          grep -q 'terrain/other-body contact is a legitimate terminal miss' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'ConventionalTorpedoTerminalReason::Impact' Tests/M5CombatImpactChecks.h
          git diff --check
      - name: Commit product refinement
        shell: bash
        run: |
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git add Game/Combat/CombatPlaygroundRuntime.h Tests/M5CombatImpactChecks.h
          git commit -m 'fix: treat off-target torpedo collisions as terminal misses'
          git push origin HEAD:feature/torpedo-active-passive-seeker
