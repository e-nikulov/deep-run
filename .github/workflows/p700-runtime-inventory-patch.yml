name: P700 runtime inventory patch

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar
    paths:
      - .github/workflows/p700-runtime-inventory-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Apply runtime inventory wiring
        run: python3 Tools/patch_p700_runtime_inventory.py
      - name: Validate runtime inventory wiring
        run: |
          grep -q 'Armament::P700LauncherInventory p700LauncherInventory' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'P700Launchers() const noexcept' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'p700CarrierLaunchContract_.CreateInventory' Game/Combat/CombatPlaygroundWindowedComposition.h
      - name: Commit wiring and remove temporary files
        run: |
          rm Tools/patch_p700_runtime_inventory.py .github/workflows/p700-runtime-inventory-patch.yml
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git add -A
          git commit -m "feat: own production P-700 launcher inventory in combat runtime"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
