name: W1-J meshlet ocean patch

on:
  push:
    branches:
      - feature/w1-j-meshlet-ocean
    paths:
      - Tools/CI/apply_w1_j_meshlet_ocean.py
      - .github/workflows/w1-j-meshlet-ocean-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w1-j-meshlet-ocean-patch
  cancel-in-progress: true

jobs:
  apply-build-test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply meshlet ocean patch
        shell: pwsh
        run: python Tools/CI/apply_w1_j_meshlet_ocean.py

      - name: Configure Debug
        shell: pwsh
        run: cmake --preset windows-debug

      - name: Build Debug
        shell: pwsh
        run: cmake --build --preset windows-debug --parallel

      - name: Test Debug
        shell: pwsh
        run: ctest --preset windows-debug --output-on-failure

      - name: Configure Release
        shell: pwsh
        run: cmake --preset windows-release

      - name: Build Release
        shell: pwsh
        run: cmake --build --preset windows-release --parallel

      - name: Test Release
        shell: pwsh
        run: ctest --preset windows-release --output-on-failure

      - name: Commit validated product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            throw "W1-J patch produced no staged product changes"
          }
          git commit -m "W1-J: add mesh-shader ocean path"
          git push origin HEAD:feature/w1-j-meshlet-ocean
