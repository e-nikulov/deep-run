name: Patch W1-J memory diagnostics

on:
  push:
    branches:
      - feature/w1-j-adaptive-sea-tessellation
    paths:
      - .github/workflows/patch-w1-j-memory.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/w1-j-adaptive-sea-tessellation
      - name: Apply W1-J memory diagnostics fix
        run: python Tools/patch_w1_j_memory_diagnostics.py
      - name: Commit production fix
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Engine/Render/D3D12Renderer.cpp
          git commit -m "W1-J: account for all sea surface LOD buffers"
          git push origin HEAD:feature/w1-j-adaptive-sea-tessellation
