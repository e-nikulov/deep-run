name: Fix SIGNAL-3 Gameplay Closure

on:
  push:
    branches: [feature/antey-electronic-intelligence-suite]
    paths:
      - .github/workflows/fix-signal3-gameplay-closure.yml
      - Tools/fix_signal3_gameplay_closure.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-test-commit:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch SIGNAL-3 runtime closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python Tools/fix_signal3_gameplay_closure.py
          if ($LASTEXITCODE -ne 0) { throw 'SIGNAL-3 closure patch failed' }
          git diff --check

      - name: Configure and build focused targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset windows-debug
          cmake --build --preset windows-debug --target DeepRun DeepRunAnteyElectronicSuiteTests DeepRunTests

      - name: Run focused tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --preset windows-debug -R "DeepRunAnteyElectronicSuiteTests|DeepRunTests" --output-on-failure

      - name: Normal gameplay startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DR_NO_CAPTURE='1'
          & 'build/windows-debug/bin/Debug/DeepRun.exe' --windowed-smoke
          if ($LASTEXITCODE -ne 0) { throw "normal gameplay startup smoke failed: $LASTEXITCODE" }

      - name: Commit SIGNAL-3 gameplay closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Force '.github/workflows/fix-signal3-gameplay-closure.yml'
          Remove-Item -Force 'Tools/fix_signal3_gameplay_closure.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close SIGNAL-3 gameplay integration'
          git push origin HEAD:feature/antey-electronic-intelligence-suite
