name: Apply Antey Electronics Gameplay

on:
  push:
    branches:
      - feature/antey-electronic-intelligence-suite
    paths:
      - Tools/apply_antey_electronics_gameplay_integration.py
      - Tools/run_antey_electronics_gameplay_integration.py
      - Game/Combat/AnteyElectronicCombatRuntime.h
      - .github/workflows/apply-antey-electronics-gameplay.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply gameplay integration patch
        shell: pwsh
        run: python Tools/run_antey_electronics_gameplay_integration.py

      - name: Configure and build focused targets
        shell: pwsh
        run: |
          cmake --preset windows-debug
          cmake --build --preset windows-debug --target DeepRun DeepRunAnteyElectronicSuiteTests DeepRunPeriscopeBallastGameplayTests DeepRunM5PlayerControlledCombatTests DeepRunTests

      - name: Run focused tests
        shell: pwsh
        run: ctest --preset windows-debug -R "DeepRunAnteyElectronicSuiteTests|DeepRunPeriscopeBallastGameplayTests|DeepRunM5PlayerControlledCombatTests|DeepRunTests" --output-on-failure

      - name: Commit gameplay integration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Game/Combat/AnteyElectronicSuite.h Game/Combat/PlayerCombatCommandRuntime.h Game/Combat/CombatPlaygroundRuntime.h Engine/Input/InputState.h Engine/Input/InputSystem.h Engine/Input/InputSystem.cpp Game/PhysicalPlayground.h Game/PhysicalPlayground.cpp Game/Combat/CombatCommandUi.h Game/Combat/CombatCommandUi.cpp DeepRun/Main.cpp Tests/AnteyElectronicSuiteTest.cpp
          git diff --cached --check
          git commit -m "feat: integrate Antey electronic suite into gameplay"
          git push origin HEAD:feature/antey-electronic-intelligence-suite
