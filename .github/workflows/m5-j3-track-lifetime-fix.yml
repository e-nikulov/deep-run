name: M5 J3 Track Lifetime Fix

on:
  push:
    branches:
      - tmp/m5-j3-incoming-threat-ui
    paths:
      - Tools/CI/apply_m5_j3_track_lifetime_fix.py
      - .github/workflows/m5-j3-track-lifetime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        shell: pwsh
        run: python Tools/CI/apply_m5_j3_track_lifetime_fix.py
      - name: Commit clean tree
        shell: pwsh
        run: |
          git config user.name "Deep Run CI"
          git config user.email "actions@users.noreply.github.com"
          git rm Tools/CI/apply_m5_j3_track_lifetime_fix.py .github/workflows/m5-j3-track-lifetime-fix.yml
          git add Game/Combat/CombatPlaygroundRuntime.h
          git commit -m "fix: keep M5 J3 threat track snapshot lifetime safe"
          git push origin HEAD:tmp/m5-j3-incoming-threat-ui
