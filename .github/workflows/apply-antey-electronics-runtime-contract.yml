name: Apply Antey Electronics Runtime Contract

on:
  push:
    branches:
      - feature/antey-electronic-intelligence-suite
    paths:
      - Tools/apply_antey_electronics_runtime_contract.py
      - .github/workflows/apply-antey-electronics-runtime-contract.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime/content contract patch
        shell: pwsh
        run: python Tools/apply_antey_electronics_runtime_contract.py

      - name: Configure and build focused targets
        shell: pwsh
        run: |
          cmake --preset windows-debug
          cmake --build --preset windows-debug --target DeepRunAnteyElectronicSuiteTests DeepRunTests

      - name: Commit contract changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Game/Submarine/ProductionAnteyAsset.h Game/Submarine/ProductionAnteyAsset.cpp Tools/Blender/write_production_sidecars.py docs/development/m5-combat-playground.md docs/development/periscope-ballast-gameplay.md
          git diff --cached --check
          git commit -m "content: bind confirmed Antey retractable systems"
          git push origin HEAD:feature/antey-electronic-intelligence-suite
