name: Apply M5 final closure phase 2

on:
  push:
    branches:
      - fix/m5-final-closure-gaps
    paths:
      - Tools/apply_m5_final_closure_phase2.py
      - .github/workflows/apply-m5-final-closure-phase2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-final-closure-gaps
      - name: Apply closure presentation patch
        run: python Tools/apply_m5_final_closure_phase2.py
      - name: Commit generated repair
        shell: bash
        run: |
          git config user.name "DeepRun CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "fix: close M5 periscope and documentation gaps"
          git push origin HEAD:fix/m5-final-closure-gaps
