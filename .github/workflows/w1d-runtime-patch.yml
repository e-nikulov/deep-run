name: Apply W1-D Runtime Patch

on:
  push:
    branches:
      - feature/w1-d-wave-slamming
    paths:
      - Tools/patch_w1d_runtime.py
      - .github/workflows/w1d-runtime-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply W1-D runtime patch
        shell: pwsh
        run: python Tools/patch_w1d_runtime.py
      - name: Commit production changes and remove patch plumbing
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm Tools/patch_w1d_runtime.py .github/workflows/w1d-runtime-patch.yml
          git add Game/PhysicalPlayground.h Game/PhysicalPlayground.cpp
          git diff --cached --check
          git commit -m "game: integrate W1-D wave slamming runtime"
          git push origin HEAD:feature/w1-d-wave-slamming
