name: Patch W1-J adaptive sea tessellation

on:
  push:
    branches:
      - feature/w1-j-adaptive-sea-tessellation
    paths:
      - .github/workflows/patch-w1-j-adaptive-sea.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/w1-j-adaptive-sea-tessellation
      - name: Apply W1-J production patch
        run: python Tools/patch_w1_j_adaptive_sea.py
      - name: Commit production changes
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Engine/Render/GerstnerSurface.h Engine/Render/GerstnerSurface.cpp Engine/Render/D3D12Renderer.cpp Game/WaterPresentation.cpp Tests/TestMain.cpp
          git commit -m "W1-J: add adaptive sea surface tessellation"
          git push origin HEAD:feature/w1-j-adaptive-sea-tessellation
