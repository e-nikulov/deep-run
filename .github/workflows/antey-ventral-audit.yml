name: Antey Ventral Rudder Audit

on:
  push:
    branches:
      - fix/antey-ventral-rudder-selected-geometry
    paths:
      - Content/submarines/Antey/selected_geometry_ventral.txt
      - Tools/Blender/audit_antey_ventral_selection.py
      - .github/workflows/antey-ventral-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antey-ventral-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Blender 5.2.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'blender-5.2.1-windows-x64.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'blender-5.2.1'
          if (-not (Test-Path $dir)) {
            curl.exe -L --fail --retry 4 --retry-delay 5 `
              -o $zip `
              https://download.blender.org/release/Blender5.2/blender-5.2.1-windows-x64.zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
          }
          $blender = Get-ChildItem -Path $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $blender) { throw 'Blender 5.2.1 executable not found' }
          "BLENDER_EXE=$($blender.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $blender.FullName --version

      - name: Audit current GameReady ventral selection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'artifacts/antey-ventral' | Out-Null
          & $env:BLENDER_EXE `
            --background `
            'Content/submarines/Antey/Antey_GameReady.blend' `
            --python 'Tools/Blender/audit_antey_ventral_selection.py' `
            -- `
            --selection 'Content/submarines/Antey/selected_geometry_ventral.txt' `
            --output 'artifacts/antey-ventral/audit.json'
          if ($LASTEXITCODE -ne 0) { throw "Ventral audit failed with exit code $LASTEXITCODE" }
          Get-Content -Raw 'artifacts/antey-ventral/audit.json'

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antey-ventral-audit
          if-no-files-found: error
          path: artifacts/antey-ventral/audit.json
