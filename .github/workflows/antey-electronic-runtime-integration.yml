name: Antey Electronic Runtime Integration

on:
  push:
    branches: [feature/antey-electronic-intelligence-suite]
    paths: [.github/workflows/antey-electronic-runtime-integration.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch player controls, multisensor runtime and HUD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # --- configurable second optical channel ---------------------------------------------
          path = 'Game/Combat/PeriscopeCombatRuntime.h'
          replace_once(path,
          '''[[nodiscard]] inline std::expected<PlayerCombatCommandFeedback, std::string> VisualIdentifySelectedTrack(\n    PeriscopeState& periscope,''',
          '''[[nodiscard]] inline std::expected<PlayerCombatCommandFeedback, std::string> VisualIdentifySelectedTrackWithConfig(\n    const PeriscopeObservationConfig& config,\n    PeriscopeState& periscope,''')
          replace_once(path,
          '''        PeriscopeObservationConfig{},\n        periscope,''',
          '''        config,\n        periscope,''')
          replace_once(path,
          '''            .message = ownshipDepthMeters > PeriscopeObservationConfig{}.maximumOperatingDepthMeters\n                ? "visual identification unavailable: ownship is too deep"''',
          '''            .message = ownshipDepthMeters > config.maximumOperatingDepthMeters\n                ? "visual identification unavailable: ownship is too deep"''')
          marker = '''inline void ApplyPeriscopePresentation(\n'''
          wrapper = '''[[nodiscard]] inline std::expected<PlayerCombatCommandFeedback, std::string> VisualIdentifySelectedTrack(\n    PeriscopeState& periscope,\n    Perception::TrackManager& tracks,\n    const std::optional<std::uint64_t> selectedTrackId,\n    const Physics::PhysicsVector3& ownshipPositionMeters,\n    const float ownshipDepthMeters,\n    const float surfaceLevelYMeters,\n    const PeriscopeTargetTruth& targetTruth,\n    const double simulationTimeSeconds,\n    const PeriscopeOpticalConditions& opticalConditions = {})\n{\n    return VisualIdentifySelectedTrackWithConfig(\n        PeriscopeObservationConfig{}, periscope, tracks, selectedTrackId, ownshipPositionMeters,\n        ownshipDepthMeters, surfaceLevelYMeters, targetTruth, simulationTimeSeconds, opticalConditions);\n}\n\n'''
          replace_once(path, marker, wrapper + marker)

          # --- command and presentation contract -----------------------------------------------
          path = 'Game/Combat/PlayerCombatCommandRuntime.h'
          replace_once(path,
          '''#include "Game/Combat/SonarPresentation.h"''',
          '''#include "Game/Combat/AnteyElectronicSuite.h"\n#include "Game/Combat/SonarPresentation.h"''')
          replace_once(path,
          '''    VisualIdentify,\n    ToggleP700SalvoMode,''',
          '''    VisualIdentify,\n    ToggleP700SalvoMode,\n    CycleElectronicSuite,\n    OperateElectronicSuite,''')
          replace_once(path,
          '''    SonarPresentationSnapshot sonar{};\n\n    // Periscope state''',
          '''    SonarPresentationSnapshot sonar{};\n\n    // Multi-sensor / retractable-device suite. These fields are perceived/gameplay state only.\n    AnteyElectronicSystem selectedElectronicSystem = AnteyElectronicSystem::ZonaRadioDirectionFinder;\n    bool selectedElectronicSystemDeployed = false;\n    bool zonaListening = false;\n    bool radianTransmitting = false;\n    bool radioTransmitting = false;\n    bool rkpCompressorRequested = false;\n    bool rkpCompressorRunning = false;\n    bool signal3Raised = false;\n    float navigationErrorMeters = 0.0F;\n    float highPressureAirFraction = 1.0F;\n    std::optional<ExternalTargetReportSource> externalTargetReportSource{};\n    std::optional<float> externalTargetReportAgeSeconds{};\n    std::optional<float> externalTargetReportUncertaintyMeters{};\n    bool selectedTrackHasPassiveAcousticEvidence = false;\n    bool selectedTrackHasActiveAcousticEvidence = false;\n    bool selectedTrackHasOpticalEvidence = false;\n    bool selectedTrackHasElectronicSupportEvidence = false;\n    bool selectedTrackHasSurfaceRadarEvidence = false;\n    bool selectedTrackHasExternalReportEvidence = false;\n    std::optional<float> selectedTrackExternalReportAgeSeconds{};\n\n    // Periscope state''')
          replace_once(path,
          '''        case PlayerCombatCommandType::ToggleP700SalvoMode:\n            return ToggleP700SalvoMode();\n        }''',
          '''        case PlayerCombatCommandType::ToggleP700SalvoMode:\n            return ToggleP700SalvoMode();\n        case PlayerCombatCommandType::CycleElectronicSuite:\n        case PlayerCombatCommandType::OperateElectronicSuite:\n            return std::unexpected("Antey electronic-suite commands are owned by CombatPlaygroundRuntime");\n        }''')
          replace_once(path,
          '''        snapshot.selectedTrackVisuallyIdentified = selected->visuallyIdentified;\n        snapshot.selectedTrackWeaponQualified''',
          '''        snapshot.selectedTrackVisuallyIdentified = selected->visuallyIdentified;\n        snapshot.selectedTrackHasPassiveAcousticEvidence = selected->hasPassiveAcousticEvidence;\n        snapshot.selectedTrackHasActiveAcousticEvidence = selected->hasActiveAcousticEvidence;\n        snapshot.selectedTrackHasOpticalEvidence = selected->hasOpticalEvidence;\n        snapshot.selectedTrackHasElectronicSupportEvidence = selected->hasElectronicSupportEvidence;\n        snapshot.selectedTrackHasSurfaceRadarEvidence = selected->hasSurfaceRadarEvidence;\n        snapshot.selectedTrackHasExternalReportEvidence = selected->hasExternalReportEvidence;\n        snapshot.selectedTrackExternalReportAgeSeconds = selected->externalReportAgeSeconds;\n        snapshot.selectedTrackWeaponQualified''')

          # --- input actions -------------------------------------------------------------------
          path = 'Engine/Input/InputState.h'
          replace_once(path,
          '''    ToggleP700SalvoMode,\n    Count,''',
          '''    ToggleP700SalvoMode,\n    CycleElectronicSuite,\n    OperateElectronicSuite,\n    Count,''')

          path = 'Engine/Input/InputSystem.h'
          replace_once(path,
          '''    bool toggleP700SalvoMode = false;\n};''',
          '''    bool toggleP700SalvoMode = false;\n    bool cycleElectronicSuite = false;\n    bool operateElectronicSuite = false;\n};''')
          replace_once(path,
          '''    bool toggleP700SalvoModeKeyDown_ = false;\n};''',
          '''    bool toggleP700SalvoModeKeyDown_ = false;\n    bool cycleElectronicSuiteKeyDown_ = false;\n    bool operateElectronicSuiteKeyDown_ = false;\n};''')

          path = 'Engine/Input/InputSystem.cpp'
          replace_once(path,
          '''        .visualIdentify = HasGamepadButton(gamepad, GamepadButton::A),\n        .toggleP700SalvoMode = HasGamepadButton(gamepad, GamepadButton::DpadDown)};''',
          '''        .visualIdentify = HasGamepadButton(gamepad, GamepadButton::A),\n        .toggleP700SalvoMode = HasGamepadButton(gamepad, GamepadButton::DpadDown),\n        .cycleElectronicSuite = HasGamepadButton(gamepad, GamepadButton::LeftShoulder),\n        .operateElectronicSuite = HasGamepadButton(gamepad, GamepadButton::B)};''')
          replace_once(path,
          '''            else if (event.key == Platform::Key::G)\n            {\n                toggleP700SalvoModeKeyDown_ = true;\n            }''',
          '''            else if (event.key == Platform::Key::G)\n            {\n                toggleP700SalvoModeKeyDown_ = true;\n            }\n            else if (event.key == Platform::Key::R)\n            {\n                cycleElectronicSuiteKeyDown_ = true;\n            }\n            else if (event.key == Platform::Key::Equals)\n            {\n                operateElectronicSuiteKeyDown_ = true;\n            }''')
          replace_once(path,
          '''            else if (event.key == Platform::Key::G)\n            {\n                toggleP700SalvoModeKeyDown_ = false;\n            }''',
          '''            else if (event.key == Platform::Key::G)\n            {\n                toggleP700SalvoModeKeyDown_ = false;\n            }\n            else if (event.key == Platform::Key::R)\n            {\n                cycleElectronicSuiteKeyDown_ = false;\n            }\n            else if (event.key == Platform::Key::Equals)\n            {\n                operateElectronicSuiteKeyDown_ = false;\n            }''')
          replace_once(path,
          '''    state_.SetActionDown(InputAction::ToggleP700SalvoMode, toggleP700SalvoModeKeyDown_ || controller.toggleP700SalvoMode);\n}''',
          '''    state_.SetActionDown(InputAction::ToggleP700SalvoMode, toggleP700SalvoModeKeyDown_ || controller.toggleP700SalvoMode);\n    state_.SetActionDown(InputAction::CycleElectronicSuite, cycleElectronicSuiteKeyDown_ || controller.cycleElectronicSuite);\n    state_.SetActionDown(InputAction::OperateElectronicSuite, operateElectronicSuiteKeyDown_ || controller.operateElectronicSuite);\n}''')

          # --- runtime multisensor suite --------------------------------------------------------
          path = 'Game/Combat/CombatPlaygroundRuntime.h'
          replace_once(path,
          '''#include "Game/Combat/CombatKnowledge.h"''',
          '''#include "Game/Combat/AnteyElectronicSuite.h"\n#include "Game/Combat/CombatKnowledge.h"''')
          replace_once(path,
          '''            .coastAfterSeconds = 5.0,\n            .lostAfterSeconds = 20.0,\n            .confidenceDecayPerSecond = 0.02F,\n            .bearingUncertaintyGrowthRadiansPerSecond = 0.01F,\n            .positionUncertaintyGrowthMetersPerSecond = 5.0F,\n            .maximumTracks = 8U});\n        const auto destroyerTracks''',
          '''            .coastAfterSeconds = 30.0,\n            .lostAfterSeconds = 90.0,\n            .confidenceDecayPerSecond = 0.005F,\n            .bearingUncertaintyGrowthRadiansPerSecond = 0.005F,\n            .positionUncertaintyGrowthMetersPerSecond = 5.0F,\n            .maximumTracks = 8U});\n        const auto destroyerTracks''')
          replace_once(path,
          '''                    .maximumBearingUncertaintyRadians = 0.12F,\n                    .maximumPositionUncertaintyMeters = 500.0F,''',
          '''                    .maximumBearingUncertaintyRadians = 0.20F,\n                    .maximumPositionUncertaintyMeters = 20'000.0F,''')
          replace_once(path,
          '''          p700AcceptanceMode_(p700AcceptanceMode)\n    {\n    }''',
          '''          p700AcceptanceMode_(p700AcceptanceMode)\n    {\n        electronicSuiteState_.lastUpdateTimeSeconds = simulationTimeSeconds;\n    }''')

          runtime_helpers_marker = '''    [[nodiscard]] std::expected<CombatPlaygroundFrame, std::string> AdvanceImpl(\n'''
          runtime_helpers = r'''    [[nodiscard]] std::expected<bool, std::string> IntegratePlayerElectronicSuiteObservations(
        const Submarine::AnteyAcousticSnapshot& playerSnapshot,
        const std::vector<SurfaceContactSensorTruth>& surfaceTruths,
        const double simulationTimeSeconds)
    {
        bool integrated = false;
        const Physics::PhysicsVector3 navigationPosition = AnteyNavigationEstimatedPosition(
            playerSnapshot.passiveReceiver.positionMeters, electronicSuiteState_);

        if (AnteyElectronicSystemDeployed(electronicSuiteState_, AnteyElectronicSystem::ZonaRadioDirectionFinder))
        {
            for (const auto& truth : surfaceTruths)
            {
                if (truth.kind != SurfaceContactTruthKind::MilitaryCombatant)
                    continue;
                const auto observed = ObserveZonaEmitter(
                    electronicSuiteConfig_, electronicSuiteState_, navigationPosition,
                    truth.emitter.positionMeters, true, simulationTimeSeconds);
                if (!observed)
                    return std::unexpected("ZONA ESM simulation failed: " + observed.error());
                if (observed->has_value())
                {
                    if (!playerTracks_.IntegrateObservation(**observed))
                        return std::unexpected("ZONA ESM evidence failed TrackManager integration");
                    integrated = true;
                }
            }
        }

        if (AnteyElectronicSystemDeployed(electronicSuiteState_, AnteyElectronicSystem::RadianSurfaceRadar) &&
            electronicSuiteState_.radianTransmitting)
        {
            for (const auto& truth : surfaceTruths)
            {
                const auto observed = ObserveRadianSurfaceTarget(
                    electronicSuiteConfig_, electronicSuiteState_, navigationPosition,
                    truth.emitter.positionMeters, simulationTimeSeconds);
                if (!observed)
                    return std::unexpected("RADIAN surface-radar simulation failed: " + observed.error());
                if (observed->has_value())
                {
                    if (!playerTracks_.IntegrateObservation(**observed))
                        return std::unexpected("RADIAN evidence failed TrackManager integration");
                    integrated = true;
                }
            }
        }

        const auto selectedTrack = FindTrack(playerTracks_.Tracks(), playerCombat_.SelectedTrackId());
        const auto selectedTruth = selectedTrack
            ? SelectSurfaceContactTruthByBearing(
                  playerSnapshot.passiveReceiver.positionMeters,
                  selectedTrack->estimatedBearingRadians,
                  surfaceTruths,
                  M5CombatSurfaceTruthAssociationGateRadians)
            : std::nullopt;

        const auto receiveExternal = [&](
            const AnteyElectronicSystem system,
            const ExternalTargetReportSource source,
            std::optional<double>& lastIssueTime) -> std::expected<bool, std::string>
        {
            if (!AnteyElectronicSystemDeployed(electronicSuiteState_, system) || !selectedTruth)
                return false;
            if (lastIssueTime && simulationTimeSeconds - *lastIssueTime + 1.0e-9 < electronicSuiteConfig_.externalReportIntervalSeconds)
                return false;

            const ExternalTargetReport report = BuildExternalTargetReport(
                electronicSuiteConfig_, source, selectedTruth->emitter.positionMeters, simulationTimeSeconds);
            const auto observed = ExternalTargetReportObservation(
                electronicSuiteConfig_, report, navigationPosition, simulationTimeSeconds);
            if (!observed)
                return std::unexpected("external target-designation report failed: " + observed.error());
            if (!playerTracks_.IntegrateObservation(*observed))
                return std::unexpected("external target-designation evidence failed TrackManager integration");

            lastIssueTime = simulationTimeSeconds;
            electronicSuiteState_.lastReceivedReportSource = source;
            electronicSuiteState_.lastReceivedReportUncertaintyMeters = observed->rangeUncertaintyMeters;
            return true;
        };

        auto mrsc2 = receiveExternal(
            AnteyElectronicSystem::Mrsc2TargetingReceiver,
            ExternalTargetReportSource::Tu95Rts,
            electronicSuiteState_.lastMrsc2ReportIssueTimeSeconds);
        if (!mrsc2) return std::unexpected(mrsc2.error());
        integrated = integrated || *mrsc2;

        auto selena = receiveExternal(
            AnteyElectronicSystem::SelenaSatelliteTargeting,
            ExternalTargetReportSource::MkrcSatellite,
            electronicSuiteState_.lastSelenaReportIssueTimeSeconds);
        if (!selena) return std::unexpected(selena.error());
        integrated = integrated || *selena;
        return integrated;
    }

    void ApplyElectronicSuitePresentation(
        PlayerCombatPresentationSnapshot& snapshot,
        const float ownshipDepthMeters,
        const double simulationTimeSeconds) const noexcept
    {
        snapshot.selectedElectronicSystem = electronicSuiteState_.selectedSystem;
        snapshot.selectedElectronicSystemDeployed = electronicSuiteState_.selectedSystem == AnteyElectronicSystem::Pzns10AttackPeriscope
            ? periscopeState_.raised
            : AnteyElectronicSystemDeployed(electronicSuiteState_, electronicSuiteState_.selectedSystem);
        snapshot.zonaListening = AnteyElectronicSystemDeployed(
            electronicSuiteState_, AnteyElectronicSystem::ZonaRadioDirectionFinder);
        snapshot.radianTransmitting = electronicSuiteState_.radianTransmitting;
        snapshot.radioTransmitting = electronicSuiteState_.radioTransmitUntilSeconds > simulationTimeSeconds;
        snapshot.rkpCompressorRequested = AnteyElectronicSystemDeployed(
            electronicSuiteState_, AnteyElectronicSystem::RkpCompressorIntake);
        snapshot.signal3Raised = AnteyElectronicSystemDeployed(
            electronicSuiteState_, AnteyElectronicSystem::Signal3NavigationPeriscope);
        snapshot.navigationErrorMeters = electronicSuiteState_.navigationErrorMeters;
        if (electronicSuiteState_.lastReceivedReportSource)
        {
            snapshot.externalTargetReportSource = electronicSuiteState_.lastReceivedReportSource;
            const auto issueTime = *electronicSuiteState_.lastReceivedReportSource == ExternalTargetReportSource::Tu95Rts
                ? electronicSuiteState_.lastMrsc2ReportIssueTimeSeconds
                : electronicSuiteState_.lastSelenaReportIssueTimeSeconds;
            if (issueTime)
                snapshot.externalTargetReportAgeSeconds = static_cast<float>(std::max(0.0, simulationTimeSeconds - *issueTime));
            snapshot.externalTargetReportUncertaintyMeters = electronicSuiteState_.lastReceivedReportUncertaintyMeters;
        }
        if (snapshot.signal3Raised && AnteyElectronicMastsAvailable(electronicSuiteConfig_, ownshipDepthMeters) &&
            snapshot.selectedTrackPresent &&
            snapshot.selectedTrackLifecycle != std::optional<Perception::TrackLifecycleState>{Perception::TrackLifecycleState::Lost})
        {
            snapshot.canVisualIdentify = true;
        }
    }

'''
          replace_once(path, runtime_helpers_marker, runtime_helpers + runtime_helpers_marker)

          replace_once(path,
          '''        const std::vector<SurfaceContactSensorTruth> surfaceTruths =\n            BuildSurfaceContactTruths(*destroyerAcoustics, civilianEmitter);\n\n        const double passiveDistance''',
          '''        const std::vector<SurfaceContactSensorTruth> surfaceTruths =\n            BuildSurfaceContactTruths(*destroyerAcoustics, civilianEmitter);\n\n        const auto& playerVelocity = playerSnapshot.emitter.velocityMetersPerSecond;\n        const float playerSpeedMetersPerSecond = static_cast<float>(std::sqrt(\n            static_cast<double>(playerVelocity.x) * playerVelocity.x +\n            static_cast<double>(playerVelocity.y) * playerVelocity.y +\n            static_cast<double>(playerVelocity.z) * playerVelocity.z));\n        const auto electronicAdvanced = AdvanceAnteyElectronicSuite(\n            electronicSuiteConfig_, electronicSuiteState_, playerSnapshot.signedDepthMeters,\n            playerSpeedMetersPerSecond, simulationTimeSeconds);\n        if (!electronicAdvanced)\n            return std::unexpected("Antey electronic suite advance failed: " + electronicAdvanced.error());\n\n        const double passiveDistance''')

          replace_once(path,
          '''        else if (!destroyerTracks_.AdvanceTo(simulationTimeSeconds))\n        {\n            return std::unexpected("M5-H destroyer TrackManager failed to advance");\n        }\n\n        if (periscopeState_.raised)''',
          '''        else if (!destroyerTracks_.AdvanceTo(simulationTimeSeconds))\n        {\n            return std::unexpected("M5-H destroyer TrackManager failed to advance");\n        }\n\n        const bool playerRadioEmission = electronicSuiteState_.radioTransmitUntilSeconds > simulationTimeSeconds;\n        if (electronicSuiteState_.radianTransmitting || playerRadioEmission)\n        {\n            const Perception::SensorObservation esmExposure{\n                .modality = Perception::SensorModality::ElectronicSupport,\n                .sensorId = electronicSuiteState_.radianTransmitting\n                    ? "DESTROYER_ESM_ANTEY_RADAR" : "DESTROYER_ESM_ANTEY_RADIO",\n                .sensorPositionMeters = destroyerAcoustics->passiveReceiver.positionMeters,\n                .observationTimeSeconds = simulationTimeSeconds,\n                .measuredBearingRadians = AnteyElectronicBearing2d(\n                    destroyerAcoustics->passiveReceiver.positionMeters, playerSnapshot.emitter.positionMeters),\n                .bearingUncertaintyRadians = 3.0F * AnteyElectronicPi / 180.0F,\n                .confidence = 0.74F};\n            if (!destroyerTracks_.IntegrateObservation(esmExposure))\n                return std::unexpected("player electronic emission failed hostile ESM integration");\n        }\n\n        if (periscopeState_.raised)''')

          replace_once(path,
          '''        if (!destroyerActivePulse_ && simulationTimeSeconds >= nextDestroyerActivePulseTimeSeconds_)''',
          '''        const bool auxiliaryMastExposed = std::any_of(\n            electronicSuiteState_.deployed.begin(), electronicSuiteState_.deployed.end(), [](const bool deployed) { return deployed; });\n        if (auxiliaryMastExposed && !periscopeState_.raised)\n        {\n            const float surfaceLevelYMeters =\n                playerSnapshot.emitter.positionMeters.y + playerSnapshot.signedDepthMeters;\n            const PeriscopeState genericRaisedMast{.raised = true, .viewBearingRadians = 0.0F};\n            const auto mastObserved = ObserveExposedPeriscopeMast(\n                ExposedPeriscopeMastDetectionConfig{}, genericRaisedMast,\n                playerSnapshot.emitter.positionMeters, playerSnapshot.signedDepthMeters,\n                surfaceLevelYMeters, destroyerAcoustics->passiveReceiver.positionMeters,\n                simulationTimeSeconds, periscopeOpticalConditions_);\n            if (!mastObserved)\n                return std::unexpected("destroyer visual-watch auxiliary mast detection failed: " + mastObserved.error());\n            if (mastObserved->has_value() && !destroyerTracks_.IntegrateObservation(**mastObserved))\n                return std::unexpected("auxiliary mast visual exposure failed hostile Track integration");\n        }\n\n        if (!destroyerActivePulse_ && simulationTimeSeconds >= nextDestroyerActivePulseTimeSeconds_)''')

          replace_once(path,
          '''        if (!integratedPlayerEvidence && !playerTracks_.AdvanceTo(simulationTimeSeconds))\n        {\n            return std::unexpected("M5-H player TrackManager failed to advance");\n        }''',
          '''        const auto electronicEvidence = IntegratePlayerElectronicSuiteObservations(\n            playerSnapshot, surfaceTruths, simulationTimeSeconds);\n        if (!electronicEvidence)\n            return std::unexpected(electronicEvidence.error());\n        integratedPlayerEvidence = integratedPlayerEvidence || *electronicEvidence;\n        if (!integratedPlayerEvidence && !playerTracks_.AdvanceTo(simulationTimeSeconds))\n        {\n            return std::unexpected("M5-H player TrackManager failed to advance");\n        }''')

          replace_once(path,
          '''                if (command.type == PlayerCombatCommandType::PreviousWeapon ||\n                    command.type == PlayerCombatCommandType::NextWeapon)''',
          '''                if (command.type == PlayerCombatCommandType::CycleElectronicSuite)\n                {\n                    CycleAnteyElectronicSystem(electronicSuiteState_);\n                    lastCombatCommand_ = PlayerCombatCommandFeedback{\n                        .command = command.type, .accepted = true, .trackId = playerCombat_.SelectedTrackId(),\n                        .message = "electronic suite selected: " + std::string(AnteyElectronicSystemName(electronicSuiteState_.selectedSystem))};\n                    continue;\n                }\n                if (command.type == PlayerCombatCommandType::OperateElectronicSuite)\n                {\n                    if (electronicSuiteState_.selectedSystem == AnteyElectronicSystem::Pzns10AttackPeriscope)\n                    {\n                        auto feedback = TogglePeriscopeForSelectedTrack(\n                            periscopeState_, playerTracks_, playerCombat_.SelectedTrackId(), playerSnapshot.signedDepthMeters);\n                        feedback.command = command.type;\n                        feedback.message = "PZNS-10S / " + feedback.message;\n                        lastCombatCommand_ = std::move(feedback);\n                        continue;\n                    }\n                    const bool available = AnteyElectronicMastsAvailable(\n                        electronicSuiteConfig_, playerSnapshot.signedDepthMeters);\n                    const auto operated = OperateAnteyElectronicSystem(\n                        electronicSuiteConfig_, electronicSuiteState_, playerSnapshot.signedDepthMeters, simulationTimeSeconds);\n                    if (!operated)\n                        return std::unexpected("electronic suite command failed: " + operated.error());\n                    lastCombatCommand_ = PlayerCombatCommandFeedback{\n                        .command = command.type, .accepted = available, .trackId = playerCombat_.SelectedTrackId(),\n                        .message = *operated};\n                    continue;\n                }\n                if (command.type == PlayerCombatCommandType::PreviousWeapon ||\n                    command.type == PlayerCombatCommandType::NextWeapon)''')

          old_visual_call = '''                    const auto feedback = VisualIdentifySelectedTrack(\n                        periscopeState_,\n                        playerTracks_,\n                        playerCombat_.SelectedTrackId(),\n                        playerSnapshot.emitter.positionMeters,\n                        playerSnapshot.signedDepthMeters,\n                        surfaceLevelYMeters,\n                        PeriscopeTargetTruth{\n                            .positionMeters = truth->emitter.positionMeters,\n                            .visualClassification = truth->visualClassification,\n                            .visibleHeightAboveSurfaceMeters = truth->visibleHeightAboveSurfaceMeters},\n                        simulationTimeSeconds,\n                        periscopeOpticalConditions_);'''
          new_visual_call = '''                    std::expected<PlayerCombatCommandFeedback, std::string> feedback =\n                        std::unexpected("no raised optical mast");\n                    const PeriscopeTargetTruth opticalTruth{\n                        .positionMeters = truth->emitter.positionMeters,\n                        .visualClassification = truth->visualClassification,\n                        .visibleHeightAboveSurfaceMeters = truth->visibleHeightAboveSurfaceMeters};\n                    if (periscopeState_.raised)\n                    {\n                        feedback = VisualIdentifySelectedTrack(\n                            periscopeState_, playerTracks_, playerCombat_.SelectedTrackId(),\n                            playerSnapshot.emitter.positionMeters, playerSnapshot.signedDepthMeters,\n                            surfaceLevelYMeters, opticalTruth, simulationTimeSeconds, periscopeOpticalConditions_);\n                    }\n                    else if (AnteyElectronicSystemDeployed(\n                        electronicSuiteState_, AnteyElectronicSystem::Signal3NavigationPeriscope))\n                    {\n                        PeriscopeState signal3{\n                            .raised = true,\n                            .viewBearingRadians = electronicSuiteState_.signal3ViewBearingRadians.value_or(\n                                selectedTrack->estimatedBearingRadians)};\n                        feedback = VisualIdentifySelectedTrackWithConfig(\n                            Signal3NavigationPeriscopeConfig(), signal3, playerTracks_, playerCombat_.SelectedTrackId(),\n                            playerSnapshot.emitter.positionMeters, playerSnapshot.signedDepthMeters,\n                            surfaceLevelYMeters, opticalTruth, simulationTimeSeconds, periscopeOpticalConditions_);\n                        electronicSuiteState_.signal3ViewBearingRadians = signal3.viewBearingRadians;\n                        if (feedback)\n                            feedback->message = "SIGNAL-3 / " + feedback->message;\n                    }\n                    else\n                    {\n                        feedback = PlayerCombatCommandFeedback{\n                            .command = PlayerCombatCommandType::VisualIdentify, .accepted = false,\n                            .trackId = playerCombat_.SelectedTrackId(),\n                            .message = "visual identification requires PZNS-10S or SIGNAL-3 to be raised"};\n                    }'''
          replace_once(path, old_visual_call, new_visual_call)

          replace_once(path,
          '''        ApplyPeriscopePresentation(playerCombatPresentation, periscopeState_, playerSnapshot.signedDepthMeters);\n\n        float sonarOwnshipHeadingRadians''',
          '''        ApplyPeriscopePresentation(playerCombatPresentation, periscopeState_, playerSnapshot.signedDepthMeters);\n        ApplyElectronicSuitePresentation(\n            playerCombatPresentation, playerSnapshot.signedDepthMeters, simulationTimeSeconds);\n\n        float sonarOwnshipHeadingRadians''')

          replace_once(path,
          '''    PeriscopeState periscopeState_{};\n    PeriscopeOpticalConditions periscopeOpticalConditions_{};''',
          '''    PeriscopeState periscopeState_{};\n    PeriscopeOpticalConditions periscopeOpticalConditions_{};\n    AnteyElectronicSuiteConfig electronicSuiteConfig_{};\n    AnteyElectronicSuiteState electronicSuiteState_{};''')

          # --- HUD -----------------------------------------------------------------------------
          path = 'Game/Combat/CombatCommandUi.h'
          replace_once(path,
          '''    float dynamicMassKg = 0.0F;\n    bool bowPlanesDeployed = true;''',
          '''    float dynamicMassKg = 0.0F;\n    float highPressureAirFraction = 1.0F;\n    bool rkpCompressorRunning = false;\n    bool bowPlanesDeployed = true;''')

          path = 'Game/Combat/CombatCommandUi.cpp'
          replace_once(path,
          '''    case PlayerCombatCommandType::ToggleP700SalvoMode: return "P-700 SALVO MODE";\n    }''',
          '''    case PlayerCombatCommandType::ToggleP700SalvoMode: return "P-700 SALVO MODE";\n    case PlayerCombatCommandType::CycleElectronicSuite: return "ELECTRONICS SELECT";\n    case PlayerCombatCommandType::OperateElectronicSuite: return "ELECTRONICS OPERATE";\n    }''')
          replace_once(path,
          '''            ImGui::Text("Optical detail: %s", OpticalDetailName(snapshot.selectedTrackOpticalIdentificationLevel));''',
          '''            ImGui::Text("Sources: %s%s%s%s%s%s",\n                snapshot.selectedTrackHasPassiveAcousticEvidence ? "PASSIVE " : "",\n                snapshot.selectedTrackHasActiveAcousticEvidence ? "ACTIVE " : "",\n                snapshot.selectedTrackHasElectronicSupportEvidence ? "ESM " : "",\n                snapshot.selectedTrackHasSurfaceRadarEvidence ? "RADAR " : "",\n                snapshot.selectedTrackHasExternalReportEvidence ? "EXT-CU " : "",\n                snapshot.selectedTrackHasOpticalEvidence ? "OPTICAL" : "");\n            if (snapshot.selectedTrackExternalReportAgeSeconds)\n                ImGui::Text("External-CU evidence age: %.0f s", *snapshot.selectedTrackExternalReportAgeSeconds);\n            ImGui::Text("Optical detail: %s", OpticalDetailName(snapshot.selectedTrackOpticalIdentificationLevel));''')
          replace_once(path,
          '''    ImGui::Text("Visual ID: %s", snapshot.canVisualIdentify ? "READY" : "UNAVAILABLE");\n\n    ImGui::Separator();\n    ImGui::TextUnformatted("THREAT");''',
          '''    ImGui::Text("Visual ID: %s", snapshot.canVisualIdentify ? "READY" : "UNAVAILABLE");\n    ImGui::Text("SIGNAL-3: %s", snapshot.signal3Raised ? "RAISED / WIDE SEARCH OPTIC" : "STOWED");\n\n    ImGui::Separator();\n    ImGui::TextUnformatted("ELECTRONICS / RETRACTABLE DEVICES");\n    const std::string_view electronicName = AnteyElectronicSystemName(snapshot.selectedElectronicSystem);\n    ImGui::Text("Selected: %.*s [%s]", static_cast<int>(electronicName.size()), electronicName.data(),\n                snapshot.selectedElectronicSystemDeployed ? "RAISED" : "STOWED");\n    ImGui::Text("ZONA ESM: %s", snapshot.zonaListening ? "LISTENING / PASSIVE" : "STOWED");\n    ImGui::Text("RADIAN: %s", snapshot.radianTransmitting ? "TRANSMITTING - INTERCEPT RISK" : "EMCON / OFF");\n    ImGui::Text("Radio: %s", snapshot.radioTransmitting ? "BURST TX - INTERCEPT RISK" : "SILENT / RECEIVE");\n    ImGui::Text("INS position error: +/- %.0f m", snapshot.navigationErrorMeters);\n    if (snapshot.externalTargetReportSource)\n    {\n        const std::string_view source = ExternalTargetReportSourceName(*snapshot.externalTargetReportSource);\n        ImGui::Text("External CU: %.*s | age %.0f s | unc +/- %.1f km",\n                    static_cast<int>(source.size()), source.data(),\n                    snapshot.externalTargetReportAgeSeconds.value_or(0.0F),\n                    snapshot.externalTargetReportUncertaintyMeters.value_or(0.0F) / 1000.0F);\n    }\n    else\n        ImGui::TextUnformatted("External CU: NONE");\n    ImGui::Text("HP air: %.0f%% | RKP compressor: %s",\n                snapshot.highPressureAirFraction * 100.0F,\n                snapshot.rkpCompressorRunning ? "RUNNING" : (snapshot.rkpCompressorRequested ? "REQUESTED" : "OFF"));\n\n    ImGui::Separator();\n    ImGui::TextUnformatted("THREAT");''')
          replace_once(path,
          '''    ImGui::TextUnformatted("X / F            Deploy decoy");\n    ImGui::End();''',
          '''    ImGui::TextUnformatted("X / F            Deploy decoy");\n    ImGui::TextUnformatted("LB / R           Select mast/electronic system");\n    ImGui::TextUnformatted("B / =            Raise/operate selected system");\n    ImGui::End();''')
          replace_once(path,
          '''    ImGui::Text("Main ballast: %.0f%% / %s | Trim: %+0.1f t",\n                snapshot.mainBallastFillFraction * 100.0F,\n                MainBallastStateName(snapshot),\n                snapshot.trimMassDeltaKg / 1000.0F);''',
          '''    ImGui::Text("Main ballast: %.0f%% / %s | Trim: %+0.1f t",\n                snapshot.mainBallastFillFraction * 100.0F,\n                MainBallastStateName(snapshot),\n                snapshot.trimMassDeltaKg / 1000.0F);\n    ImGui::Text("HP air: %.0f%% | RKP compressor: %s",\n                snapshot.highPressureAirFraction * 100.0F,\n                snapshot.rkpCompressorRunning ? "RUNNING" : "OFF");''')

          # --- application input bridge / physical RKP sync ------------------------------------
          path = 'DeepRun/Main.cpp'
          replace_once(path,
          '''        std::uint64_t consumedP700SalvoModeSequence = 0;\n        bool loggedHapticSubmissionFailure''',
          '''        std::uint64_t consumedP700SalvoModeSequence = 0;\n        std::uint64_t consumedCycleElectronicSuiteSequence = 0;\n        std::uint64_t consumedOperateElectronicSuiteSequence = 0;\n        bool loggedHapticSubmissionFailure''')
          replace_once(path,
          '''             &consumedTogglePeriscopeSequence, &consumedVisualIdentifySequence, &consumedP700SalvoModeSequence,\n             &loggedHapticSubmissionFailure''',
          '''             &consumedTogglePeriscopeSequence, &consumedVisualIdentifySequence, &consumedP700SalvoModeSequence,\n             &consumedCycleElectronicSuiteSequence, &consumedOperateElectronicSuiteSequence,\n             &loggedHapticSubmissionFailure''')
          replace_once(path,
          '''                    std::array<DeepRun::Game::Combat::PlayerCombatCommand, 10> playerCommands{};''',
          '''                    std::array<DeepRun::Game::Combat::PlayerCombatCommand, 12> playerCommands{};''')
          replace_once(path,
          '''                        consume(*inputState, DeepRun::Input::InputAction::DeployDecoy,\n                                DeepRun::Game::Combat::PlayerCombatCommandType::DeployDecoy,\n                                consumedDeployDecoySequence);''',
          '''                        consume(*inputState, DeepRun::Input::InputAction::DeployDecoy,\n                                DeepRun::Game::Combat::PlayerCombatCommandType::DeployDecoy,\n                                consumedDeployDecoySequence);\n                        consume(*inputState, DeepRun::Input::InputAction::CycleElectronicSuite,\n                                DeepRun::Game::Combat::PlayerCombatCommandType::CycleElectronicSuite,\n                                consumedCycleElectronicSuiteSequence);\n                        consume(*inputState, DeepRun::Input::InputAction::OperateElectronicSuite,\n                                DeepRun::Game::Combat::PlayerCombatCommandType::OperateElectronicSuite,\n                                consumedOperateElectronicSuiteSequence);''')
          replace_once(path,
          '''                    combatUiSnapshot = combatFrame->playerCombat;\n                    const auto periscopePresentation =''',
          '''                    combatUiSnapshot = combatFrame->playerCombat;\n                    playground.SetRkpCompressorRequested(combatFrame->playerCombat.rkpCompressorRequested);\n                    const auto physicalTelemetry = playground.BuildVesselPresentationTelemetry();\n                    if (!physicalTelemetry)\n                    {\n                        std::cerr << "[Game][ERROR] electronic-suite physical telemetry failed: "\n                                  << physicalTelemetry.error() << '\\n';\n                        return false;\n                    }\n                    combatUiSnapshot->highPressureAirFraction = physicalTelemetry->highPressureAirFraction;\n                    combatUiSnapshot->rkpCompressorRunning = physicalTelemetry->rkpCompressorRunning;\n                    const auto periscopePresentation =''')
          replace_once(path,
          '''                            .dynamicMassKg = navigationTelemetry->dynamicMassKg,\n                            .bowPlanesDeployed = navigationTelemetry->bowPlanesDeployed,''',
          '''                            .dynamicMassKg = navigationTelemetry->dynamicMassKg,\n                            .highPressureAirFraction = navigationTelemetry->highPressureAirFraction,\n                            .rkpCompressorRunning = navigationTelemetry->rkpCompressorRunning,\n                            .bowPlanesDeployed = navigationTelemetry->bowPlanesDeployed,''')

          # --- test controller bindings ---------------------------------------------------------
          path = 'Tests/AnteyElectronicSuiteTest.cpp'
          replace_once(path,
          '''#include "Simulation/Perception/TrackManager.h"''',
          '''#include "Simulation/Perception/TrackManager.h"\n#include "Engine/Input/InputSystem.h"''')
          replace_once(path,
          '''    std::cout << "[AnteyElectronicSuiteTest][PASS] ESM radar external-CU navigation radio RKP and dual-optics contracts\\n";''',
          '''    Input::GamepadState controls{};\n    controls.connected = true;\n    controls.buttons = static_cast<std::uint16_t>(Input::GamepadButton::LeftShoulder) |\n                       static_cast<std::uint16_t>(Input::GamepadButton::B);\n    const auto semanticActions = Input::SemanticActionsForGamepad(controls);\n    Require(semanticActions.cycleElectronicSuite && semanticActions.operateElectronicSuite,\n            "controller must expose electronic-suite select/operate actions");\n\n    std::cout << "[AnteyElectronicSuiteTest][PASS] ESM radar external-CU navigation radio RKP dual-optics and controls\\n";''')

          git diff --check
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\patch_runtime.py"
          python "$env:RUNNER_TEMP\patch_runtime.py"
          if ($LASTEXITCODE -ne 0) { throw 'runtime integration patch failed' }
          git diff --check

      - name: Configure, build and run focused tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset windows-debug
          cmake --build --preset windows-debug --target DeepRun DeepRunAnteyElectronicSuiteTests DeepRunPeriscopeBallastGameplayTests DeepRunM5PlayerControlledCombatTests
          ctest --preset windows-debug -R "DeepRunAnteyElectronicSuiteTests|DeepRunPeriscopeBallastGameplayTests|DeepRunM5PlayerControlledCombatTests" --output-on-failure

      - name: Normal gameplay startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DR_NO_CAPTURE='1'
          & 'build/windows-debug/bin/Debug/DeepRun.exe' --windowed-smoke
          if ($LASTEXITCODE -ne 0) { throw "normal gameplay startup smoke failed: $LASTEXITCODE" }

      - name: Commit runtime integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Force '.github/workflows/antey-electronic-runtime-integration.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: integrate Antey electronic suite into gameplay'
          git push origin HEAD:feature/antey-electronic-intelligence-suite
