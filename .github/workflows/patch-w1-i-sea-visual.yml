name: Patch W1-I sea-state visual acceptance

on:
  push:
    branches:
      - feature/w1-i-sea-state-visual-acceptance
    paths:
      - .github/workflows/patch-w1-i-sea-visual.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/w1-i-sea-state-visual-acceptance
      - name: Apply W1-I visual acceptance patch
        run: python Tools/patch_w1_i_visual_acceptance.py
      - name: Commit production changes and remove patch plumbing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-w1-i-sea-visual.yml Tools/patch_w1_i_visual_acceptance.py
          git add Game/PhysicalPlayground.h Game/PhysicalPlayground.cpp DeepRun/Main.cpp
          git commit -m "W1-I: add production sea-state visual acceptance harness"
          git push origin HEAD:feature/w1-i-sea-state-visual-acceptance
