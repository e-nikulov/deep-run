name: Patch W1-B Active Count

on:
  push:
    branches:
      - feature/w1-b-spectral-production-ocean
    paths:
      - Tools/patch_w1b_active_count.py
      - .github/workflows/w1b-active-count-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: pwsh
        run: python Tools/patch_w1b_active_count.py
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Engine/Render/D3D12Renderer.cpp
          git diff --cached --check
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "render: upload active spectral wave count"
          git push origin HEAD:feature/w1-b-spectral-production-ocean
