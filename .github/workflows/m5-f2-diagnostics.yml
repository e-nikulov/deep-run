name: M5 F2 Apply Diagnostics

on:
  push:
    branches:
      - tmp/m5-f2-enemy-torpedo-threat
    paths:
      - Tools/CI/apply_m5_f2_diagnostics.ps1
      - .github/workflows/m5-f2-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/m5-f2-enemy-torpedo-threat
          fetch-depth: 0

      - name: Apply M5-F.2 diagnostics
        shell: pwsh
        run: ./Tools/CI/apply_m5_f2_diagnostics.ps1

      - name: Commit diagnostic tree
        shell: pwsh
        run: |
          Remove-Item Tools/CI/apply_m5_f2_diagnostics.ps1
          Remove-Item .github/workflows/m5-f2-diagnostics.yml
          git config user.name "Deep Run CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "test: diagnose M5-F2 reciprocal torpedo failure"
            git push origin HEAD:tmp/m5-f2-enemy-torpedo-threat
          }
