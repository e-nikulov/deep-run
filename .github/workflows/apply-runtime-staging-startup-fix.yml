name: Apply runtime staging and startup fix

on:
  push:
    branches:
      - fix/runtime-asset-staging-and-startup-draw-gate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-asset-staging-and-startup-draw-gate
          fetch-depth: 0

      - name: Apply scoped fix
        shell: pwsh
        run: python Tools/apply_runtime_staging_startup_fix.py

      - name: Validate patch
        shell: pwsh
        run: |
          git diff --check
          if (Select-String -Path CMakeLists.txt -SimpleMatch '${CMAKE_CURRENT_SOURCE_DIR}/Engine/Assets/Weapons/P700') {
            throw 'P-700 source-tree runtime staging reference remains in CMakeLists.txt'
          }
          if (Select-String -Path CMakeLists.txt -SimpleMatch '${CMAKE_CURRENT_SOURCE_DIR}/Engine/Assets/submarines/Antey') {
            throw 'Antey source-tree runtime staging reference remains in CMakeLists.txt'
          }

      - name: Commit fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Tools/apply_runtime_staging_startup_fix.py
          Remove-Item .github/workflows/apply-runtime-staging-startup-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep runtime assets in build tree and allow FOW-empty startup frames"
          if ($LASTEXITCODE -ne 0) { throw "runtime staging/startup fix commit failed" }
          git push origin HEAD:fix/runtime-asset-staging-and-startup-draw-gate
          if ($LASTEXITCODE -ne 0) { throw "runtime staging/startup fix push failed" }
