name: M5 Torpedo Closure Documentation

on:
  push:
    paths:
      - '.github/workflows/m5-torpedo-closure-docs.yml'

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/torpedo-active-passive-seeker
          fetch-depth: 0
      - name: Apply documentation closure
        run: python Tools/patch_m5_torpedo_closure_docs.py
      - name: Verify documentation closure
        shell: bash
        run: |
          grep -q 'autonomous torpedo seeker and causal misses' docs/development/m5-combat-playground.md
          grep -q 'm5-torpedo-active-passive-seeker.md' docs/development/testing.md
      - name: Commit documentation closure
        shell: bash
        run: |
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git add docs/development/m5-combat-playground.md docs/development/testing.md
          git commit -m 'docs: close M5 torpedo seeker hardening'
          git push origin feature/torpedo-active-passive-seeker
