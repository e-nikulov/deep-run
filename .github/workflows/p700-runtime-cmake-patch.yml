name: P700 runtime CMake patch

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar
    paths:
      - .github/workflows/p700-runtime-cmake-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0

      - name: Wire staged P700 runtime and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text(encoding="utf-8")

          anchor = "add_custom_target(DeepRunAnteyRuntimeAssets DEPENDS ${DEEPRUN_ANTEY_RUNTIME_FILES})\n"
          block = """add_custom_target(DeepRunAnteyRuntimeAssets DEPENDS ${DEEPRUN_ANTEY_RUNTIME_FILES})

set(DEEPRUN_P700_SOURCE_DIR "${CMAKE_CURRENT_SOURCE_DIR}/Content/Weapons/P700")
set(DEEPRUN_P700_RUNTIME_DIR "${CMAKE_CURRENT_SOURCE_DIR}/Engine/Assets/Weapons/P700")
set(DEEPRUN_P700_RUNTIME_FILES
    "${DEEPRUN_P700_RUNTIME_DIR}/P700_Granit.glb"
    "${DEEPRUN_P700_RUNTIME_DIR}/P700.asset.json"
    "${DEEPRUN_P700_RUNTIME_DIR}/P700.authoring.json"
)
add_custom_command(
    OUTPUT ${DEEPRUN_P700_RUNTIME_FILES}
    COMMAND ${CMAKE_COMMAND}
        -DDEEPRUN_P700_SOURCE_DIR=${DEEPRUN_P700_SOURCE_DIR}
        -DDEEPRUN_P700_DESTINATION_DIR=${DEEPRUN_P700_RUNTIME_DIR}
        -P "${CMAKE_CURRENT_SOURCE_DIR}/cmake/StageP700Runtime.cmake"
    DEPENDS
        "${CMAKE_CURRENT_SOURCE_DIR}/cmake/StageP700Runtime.cmake"
        "${DEEPRUN_P700_SOURCE_DIR}/P700_Granit.glb"
        "${DEEPRUN_P700_SOURCE_DIR}/P700.asset.json"
        "${DEEPRUN_P700_SOURCE_DIR}/P700.authoring.json"
    VERBATIM
)
add_custom_target(DeepRunP700RuntimeAssets DEPENDS ${DEEPRUN_P700_RUNTIME_FILES})
"""
          if "DeepRunP700RuntimeAssets" not in text:
              if anchor not in text:
                  raise SystemExit("Antey staging anchor not found")
              text = text.replace(anchor, block, 1)

          source_anchor = "    Game/PropulsionPresentation.cpp\n    Game/Submarine/ProductionAnteyAsset.cpp\n"
          source_replacement = "    Game/PropulsionPresentation.cpp\n    Game/Submarine/ProductionAnteyAsset.cpp\n    Game/Weapons/ProductionP700Asset.cpp\n"
          deep_run_sources = text.split("add_executable(DeepRun", 1)[1].split(")", 1)[0]
          if "Game/Weapons/ProductionP700Asset.cpp" not in deep_run_sources:
              if source_anchor not in text:
                  raise SystemExit("DeepRun source anchor not found")
              text = text.replace(source_anchor, source_replacement, 1)

          dependency_anchor = "add_dependencies(DeepRun DeepRunAnteyRuntimeAssets)\n"
          if "add_dependencies(DeepRun DeepRunP700RuntimeAssets)" not in text:
              if dependency_anchor not in text:
                  raise SystemExit("DeepRun dependency anchor not found")
              text = text.replace(
                  dependency_anchor,
                  dependency_anchor + "add_dependencies(DeepRun DeepRunP700RuntimeAssets)\n",
                  1)

          copy_anchor = """    COMMAND ${CMAKE_COMMAND} -E copy_directory
        "${DEEPRUN_ANTEY_RUNTIME_DIR}"
        "$<TARGET_FILE_DIR:DeepRun>/Content/submarines/Antey"
"""
          copy_replacement = copy_anchor + """    COMMAND ${CMAKE_COMMAND} -E copy_directory
        "${DEEPRUN_P700_RUNTIME_DIR}"
        "$<TARGET_FILE_DIR:DeepRun>/Content/Weapons/P700"
"""
          if "$<TARGET_FILE_DIR:DeepRun>/Content/Weapons/P700" not in text:
              if copy_anchor not in text:
                  raise SystemExit("DeepRun copy anchor not found")
              text = text.replace(copy_anchor, copy_replacement, 1)

          marker = "set_property(DIRECTORY PROPERTY VS_STARTUP_PROJECT DeepRun)"
          test_block = """# M5 P-700 production content gate. It loads only the staged hash-validated package and verifies
# the bounded P700_Deploy metadata, the eight-object LOD0 partition and six fixed-hinge surfaces.
add_executable(DeepRunP700ProductionAssetTests
    Tests/P700ProductionAssetTest.cpp
    Game/Weapons/ProductionP700Asset.cpp
)
target_compile_features(DeepRunP700ProductionAssetTests PRIVATE cxx_std_23)
target_compile_definitions(DeepRunP700ProductionAssetTests PRIVATE
    NOMINMAX
    WIN32_LEAN_AND_MEAN
)
deeprun_set_project_warnings(DeepRunP700ProductionAssetTests)
target_link_libraries(DeepRunP700ProductionAssetTests PRIVATE DeepRunEngine nlohmann_json::nlohmann_json)
add_dependencies(DeepRunP700ProductionAssetTests DeepRunP700RuntimeAssets)
add_custom_command(TARGET DeepRunP700ProductionAssetTests POST_BUILD
    COMMAND ${CMAKE_COMMAND} -E make_directory
        "$<TARGET_FILE_DIR:DeepRunP700ProductionAssetTests>/Assets/Weapons"
    COMMAND ${CMAKE_COMMAND} -E copy_directory
        "${DEEPRUN_P700_RUNTIME_DIR}"
        "$<TARGET_FILE_DIR:DeepRunP700ProductionAssetTests>/Assets/Weapons/P700"
)
add_test(NAME DeepRunP700ProductionAssetTests COMMAND DeepRunP700ProductionAssetTests)
set_tests_properties(DeepRunP700ProductionAssetTests PROPERTIES
    WORKING_DIRECTORY "$<TARGET_FILE_DIR:DeepRunP700ProductionAssetTests>"
)

set_property(DIRECTORY PROPERTY VS_STARTUP_PROJECT DeepRun)"""
          if "add_executable(DeepRunP700ProductionAssetTests" not in text:
              if marker not in text:
                  raise SystemExit("CMake final marker not found")
              text = text.replace(marker, test_block, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate CMake wiring
        shell: bash
        run: |
          grep -q 'DeepRunP700RuntimeAssets' CMakeLists.txt
          grep -q 'Game/Weapons/ProductionP700Asset.cpp' CMakeLists.txt
          grep -q 'DeepRunP700ProductionAssetTests' CMakeLists.txt
          grep -q 'Content/Weapons/P700' CMakeLists.txt

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/p700-runtime-cmake-patch.yml
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git add CMakeLists.txt .github/workflows/p700-runtime-cmake-patch.yml
          git commit -m "build: stage and test production P-700 assets"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
