name: Normalize PhysicalPlayground diff

on:
  push:
    branches:
      - feature/periscope-ballast-gameplay

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize with semantic-equivalence guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main
          python Tools/normalize_physical_playground_diff.py
          if ($LASTEXITCODE -ne 0) { throw "PhysicalPlayground semantic normalization failed: $LASTEXITCODE" }
          git diff --check

      - name: Commit normalized file when needed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --quiet -- Game/PhysicalPlayground.cpp
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'PhysicalPlayground.cpp is already normalized'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Game/PhysicalPlayground.cpp
          git commit -m 'chore: normalize PhysicalPlayground ballast diff'
          git push origin HEAD:feature/periscope-ballast-gameplay
