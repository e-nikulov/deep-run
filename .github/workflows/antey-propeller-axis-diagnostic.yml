name: Antey Propeller Axis Diagnostic

on:
  push:
    branches:
      - fix/antey-propeller-runtime-presentation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: Inspect canonical GLB propeller hierarchy and geometry
        shell: pwsh
        run: |
          @'
          import json, math, struct
          from pathlib import Path

          glb_path = Path('Content/submarines/Antey/Antey.glb')
          data = glb_path.read_bytes()
          magic, version, total_len = struct.unpack_from('<III', data, 0)
          assert magic == 0x46546C67 and version == 2 and total_len == len(data)
          off = 12
          chunks = []
          while off < len(data):
              length, kind = struct.unpack_from('<II', data, off)
              off += 8
              chunks.append((kind, data[off:off+length]))
              off += length
          js = json.loads(next(payload for kind, payload in chunks if kind == 0x4E4F534A).decode('utf-8').rstrip('\x00 '))
          bin_chunk = next(payload for kind, payload in chunks if kind == 0x004E4942)

          def ident():
              return [[1.0 if r == c else 0.0 for c in range(4)] for r in range(4)]

          def mul(a,b):
              return [[sum(a[r][k]*b[k][c] for k in range(4)) for c in range(4)] for r in range(4)]

          def trs(node):
              if 'matrix' in node:
                  v=node['matrix']
                  return [[float(v[c*4+r]) for c in range(4)] for r in range(4)]
              t=[float(x) for x in node.get('translation',[0,0,0])]
              q=[float(x) for x in node.get('rotation',[0,0,0,1])]
              s=[float(x) for x in node.get('scale',[1,1,1])]
              x,y,z,w=q
              xx,yy,zz=x*x,y*y,z*z
              xy,xz,yz=x*y,x*z,y*z
              wx,wy,wz=w*x,w*y,w*z
              m=ident()
              rot=[
                  [1-2*(yy+zz), 2*(xy-wz), 2*(xz+wy)],
                  [2*(xy+wz), 1-2*(xx+zz), 2*(yz-wx)],
                  [2*(xz-wy), 2*(yz+wx), 1-2*(xx+yy)],
              ]
              for r in range(3):
                  for c in range(3):
                      m[r][c]=rot[r][c]*s[c]
              for r in range(3): m[r][3]=t[r]
              return m

          def inv_affine(m):
              a=[[m[r][c] for c in range(3)] for r in range(3)]
              det=(a[0][0]*(a[1][1]*a[2][2]-a[1][2]*a[2][1])
                   -a[0][1]*(a[1][0]*a[2][2]-a[1][2]*a[2][0])
                   +a[0][2]*(a[1][0]*a[2][1]-a[1][1]*a[2][0]))
              assert abs(det)>1e-12
              d=1.0/det
              ai=[
                  [(a[1][1]*a[2][2]-a[1][2]*a[2][1])*d,(a[0][2]*a[2][1]-a[0][1]*a[2][2])*d,(a[0][1]*a[1][2]-a[0][2]*a[1][1])*d],
                  [(a[1][2]*a[2][0]-a[1][0]*a[2][2])*d,(a[0][0]*a[2][2]-a[0][2]*a[2][0])*d,(a[0][2]*a[1][0]-a[0][0]*a[1][2])*d],
                  [(a[1][0]*a[2][1]-a[1][1]*a[2][0])*d,(a[0][1]*a[2][0]-a[0][0]*a[2][1])*d,(a[0][0]*a[1][1]-a[0][1]*a[1][0])*d],
              ]
              out=ident()
              for r in range(3):
                  for c in range(3): out[r][c]=ai[r][c]
                  out[r][3]=-sum(ai[r][c]*m[c][3] for c in range(3))
              return out

          def point(m,p):
              return [sum(m[r][c]*p[c] for c in range(3))+m[r][3] for r in range(3)]

          nodes=js['nodes']
          parent=[None]*len(nodes)
          for i,n in enumerate(nodes):
              for ch in n.get('children',[]): parent[ch]=i
          world=[None]*len(nodes)
          def world_m(i):
              if world[i] is not None: return world[i]
              l=trs(nodes[i])
              world[i]=l if parent[i] is None else mul(world_m(parent[i]),l)
              return world[i]

          def descendants(root):
              out=[]
              stack=[root]
              while stack:
                  i=stack.pop(); out.append(i); stack.extend(nodes[i].get('children',[]))
              return out

          def accessor_vec3(ai):
              acc=js['accessors'][ai]
              assert acc['componentType']==5126 and acc['type']=='VEC3'
              bv=js['bufferViews'][acc['bufferView']]
              stride=bv.get('byteStride',12)
              base=bv.get('byteOffset',0)+acc.get('byteOffset',0)
              for i in range(acc['count']):
                  yield struct.unpack_from('<fff',bin_chunk,base+i*stride)

          report={}
          for root_name in ('SM_Propeller_Port','SM_Propeller_Starboard'):
              matches=[i for i,n in enumerate(nodes) if n.get('name')==root_name]
              assert len(matches)==1, (root_name,matches)
              root=matches[0]
              rw=world_m(root)
              ri=inv_affine(rw)
              ds=descendants(root)
              mesh_nodes=[i for i in ds if 'mesh' in nodes[i]]
              model_pts=[]; root_pts=[]; prim_count=0; tri_count=0
              node_records=[]
              for ni in mesh_nodes:
                  nw=world_m(ni)
                  mesh=js['meshes'][nodes[ni]['mesh']]
                  node_tri=0
                  for prim in mesh['primitives']:
                      prim_count += 1
                      pos_ai=prim['attributes']['POSITION']
                      pts=list(accessor_vec3(pos_ai))
                      for p in pts:
                          mp=point(nw,p); model_pts.append(mp); root_pts.append(point(ri,mp))
                      if 'indices' in prim:
                          node_tri += js['accessors'][prim['indices']]['count']//3
                  tri_count += node_tri
                  node_records.append({
                      'index':ni,'name':nodes[ni].get('name',''),'triangles':node_tri,
                      'world_translation':[nw[0][3],nw[1][3],nw[2][3]],
                      'world_x_axis':[nw[0][0],nw[1][0],nw[2][0]],
                      'world_y_axis':[nw[0][1],nw[1][1],nw[2][1]],
                      'world_z_axis':[nw[0][2],nw[1][2],nw[2][2]],
                  })
              def bounds(pts):
                  mn=[min(p[k] for p in pts) for k in range(3)]
                  mx=[max(p[k] for p in pts) for k in range(3)]
                  return {'min':mn,'max':mx,'extent':[mx[k]-mn[k] for k in range(3)],'center':[(mn[k]+mx[k])*0.5 for k in range(3)]}
              axes={
                  'local_plus_x_to_model':[rw[0][0],rw[1][0],rw[2][0]],
                  'local_plus_y_to_model':[rw[0][1],rw[1][1],rw[2][1]],
                  'local_plus_z_to_model':[rw[0][2],rw[1][2],rw[2][2]],
              }
              report[root_name]={
                  'root_index':root,
                  'root_world':rw,
                  'root_translation':[rw[0][3],rw[1][3],rw[2][3]],
                  'axes':axes,
                  'descendant_count':len(ds),'mesh_node_count':len(mesh_nodes),'primitive_count':prim_count,'triangle_count':tri_count,
                  'model_bounds':bounds(model_pts),'root_local_bounds':bounds(root_pts),'mesh_nodes':node_records,
              }
          mats=[]
          for i,m in enumerate(js.get('materials',[])):
              if 'Propeller' in m.get('name',''):
                  mats.append({'index':i,'name':m.get('name',''),'doubleSided':m.get('doubleSided',False)})
          report['propeller_materials']=mats
          Path('antey-propeller-axis-diagnostic.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          '@ | Set-Content -Encoding UTF8 .tmp_axis_diag.py
          python .tmp_axis_diag.py
      - uses: actions/upload-artifact@v4
        with:
          name: antey-propeller-axis-diagnostic
          path: antey-propeller-axis-diagnostic.json
