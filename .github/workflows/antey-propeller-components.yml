name: Antey Propeller Components Diagnostic

on:
  push:
    branches:
      - fix/antey-propeller-runtime-presentation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: Resolve actual hub and seven blade components
        shell: pwsh
        run: |
          @'
          import json, math, struct
          from pathlib import Path
          raw=Path('Content/submarines/Antey/Antey.glb').read_bytes(); off=12; chunks=[]
          while off<len(raw):
              n,t=struct.unpack_from('<II',raw,off); off+=8; chunks.append((t,raw[off:off+n])); off+=n
          g=json.loads(next(x for t,x in chunks if t==0x4E4F534A).decode().rstrip('\x00 ')); b=next(x for t,x in chunks if t==0x004E4942)
          side=json.loads(Path('Content/submarines/Antey/Antey.authoring.json').read_text(encoding='utf-8'))
          fmt={5121:'B',5123:'H',5125:'I'}; sz={5121:1,5123:2,5125:4}
          def pos(ai):
              a=g['accessors'][ai]; v=g['bufferViews'][a['bufferView']]; st=v.get('byteStride',12); base=v.get('byteOffset',0)+a.get('byteOffset',0)
              return [struct.unpack_from('<fff',b,base+i*st) for i in range(a['count'])]
          def idx(ai):
              a=g['accessors'][ai]; v=g['bufferViews'][a['bufferView']]; s=sz[a['componentType']]; st=v.get('byteStride',s); base=v.get('byteOffset',0)+a.get('byteOffset',0); f=fmt[a['componentType']]
              return [struct.unpack_from('<'+f,b,base+i*st)[0] for i in range(a['count'])]
          def comps(prim):
              p=pos(prim['attributes']['POSITION']); ind=idx(prim['indices']); adj=[set() for _ in p]
              for k in range(0,len(ind),3):
                  t=ind[k:k+3]
                  for a,c in ((t[0],t[1]),(t[1],t[2]),(t[2],t[0])): adj[a].add(c); adj[c].add(a)
              unseen=set(range(len(p))); out=[]
              while unseen:
                  s=unseen.pop(); stack=[s]; ids=[s]
                  while stack:
                      u=stack.pop()
                      for v in adj[u]:
                          if v in unseen: unseen.remove(v); stack.append(v); ids.append(v)
                  q=[p[i] for i in ids]; mn=[min(x[j] for x in q) for j in range(3)]; mx=[max(x[j] for x in q) for j in range(3)]
                  out.append({'vertices':len(ids),'center':[sum(x[j] for x in q)/len(q) for j in range(3)],'bounds_center':[(mn[j]+mx[j])*0.5 for j in range(3)],'extent':[mx[j]-mn[j] for j in range(3)]})
              return out
          def conv(src): x,y,z=src; return [x,z,-y]
          report={}
          for label,root_name,semantic in [('port','SM_Propeller_Port','propeller.port'),('starboard','SM_Propeller_Starboard','propeller.starboard')]:
              ri=next(i for i,n in enumerate(g['nodes']) if n.get('name')==root_name); stack=list(g['nodes'][ri].get('children',[])); allc=[]
              while stack:
                  ni=stack.pop(); n=g['nodes'][ni]; stack.extend(n.get('children',[]))
                  if 'mesh' not in n: continue
                  for prim in g['meshes'][n['mesh']]['primitives']:
                      for c in comps(prim): c['node']=n.get('name',''); allc.append(c)
              pivot=conv(next(x for x in side['propellers'] if x['semanticId']==semantic)['origin'])
              # Rank by YZ area: physical hub is the compact component nearest the assembly center.
              for c in allc:
                  c['distance_to_authoring_pivot_yz']=math.hypot(c['bounds_center'][1]-pivot[1],c['bounds_center'][2]-pivot[2])
              hub=min(allc,key=lambda c:c['distance_to_authoring_pivot_yz'])
              blades=[c for c in allc if c is not hub]
              for c in blades:
                  dy=c['center'][1]-hub['bounds_center'][1]; dz=c['center'][2]-hub['bounds_center'][2]
                  c['radius_from_hub']=math.hypot(dy,dz); c['angle_from_hub_deg']=math.degrees(math.atan2(dz,dy))
              blades.sort(key=lambda c:c['angle_from_hub_deg'])
              report[label]={'component_count':len(allc),'hub':hub,'blade_count':len(blades),'authoring_runtime_pivot':pivot,'hub_minus_authoring':[hub['bounds_center'][i]-pivot[i] for i in range(3)],'blades':blades}
          print(json.dumps(report,indent=2)); Path('antey-propeller-components.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 .tmp_components.py
          python .tmp_components.py
      - uses: actions/upload-artifact@v4
        with:
          name: antey-propeller-components
          path: antey-propeller-components.json
