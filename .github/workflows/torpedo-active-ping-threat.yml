name: Torpedo Active Ping Threat Wiring

on:
  push:
    paths:
      - '.github/workflows/torpedo-active-ping-threat.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/torpedo-active-passive-seeker
          fetch-depth: 0
      - name: Apply active-ping threat wiring
        run: python Tools/patch_torpedo_active_ping_threat.py
      - name: Verify wiring
        shell: bash
        run: |
          grep -q 'active transmission emission failed' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'pendingIncomingThreatEmissions_.push_back(\*outgoingPing)' Game/Combat/CombatPlaygroundRuntime.h
      - name: Commit product wiring
        shell: bash
        run: |
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git add Game/Combat/CombatPlaygroundRuntime.h
          git commit -m 'feat: expose torpedo active ping to threat perception'
          git push origin feature/torpedo-active-passive-seeker
