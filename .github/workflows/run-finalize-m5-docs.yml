name: Run M5 closure doc finalization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-finalize-m5-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final M5 documentation
        run: python .github/finalize_m5_docs.py
      - name: Commit documentation and remove helpers
        shell: bash
        run: |
          git config user.name "DeepRun CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/finalize_m5_docs.py .github/workflows/run-finalize-m5-docs.yml
          git add docs/development/periscope-ballast-gameplay.md docs/development/m5-combat-playground.md
          git commit -m "docs: record final M5 corrective acceptance"
          git push origin HEAD:main
