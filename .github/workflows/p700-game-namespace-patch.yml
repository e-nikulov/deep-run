name: P700 Game namespace patch

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar
    paths:
      - .github/workflows/p700-game-namespace-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Apply namespace repair
        run: python3 Tools/patch_p700_game_namespace.py
      - name: Validate namespace repair
        run: |
          ! grep -R 'namespace DeepRun::Game::Weapons' Game/Weapons Tests/P700ProductionAssetTest.cpp Tests/P700LauncherInventoryTest.cpp
          grep -q 'namespace DeepRun::Game::Armament' Game/Weapons/ProductionP700Asset.h
      - name: Commit repair and remove temporary files
        run: |
          rm Tools/patch_p700_game_namespace.py .github/workflows/p700-game-namespace-patch.yml
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git add -A
          git commit -m "refactor: isolate P-700 Game armament namespace"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
