name: Repair P700 cruise range edge

on:
  push:
    branches:
      - fix/weapon-runtime-range-budgets

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weapon-runtime-range-budgets
          fetch-depth: 0

      - name: Patch cruise expiry and regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p700Path = 'Simulation/Weapons/P700Granit.h'
          $p700 = Get-Content -Raw $p700Path
          $old = @"
          const auto impact = moveSegment(*direction, speed, stepSeconds);
          if (!impact) return std::unexpected(impact.error());
          if (*impact) return *impact;
          cursorTime += stepSeconds;
"@
          $new = @"
          const auto impact = moveSegment(*direction, speed, stepSeconds);
          if (!impact) return std::unexpected(impact.error());
          if (*impact) return *impact;
          if (state.phase == P700GranitPhase::Spent) return std::optional<P700GranitImpact>{};
          cursorTime += stepSeconds;
"@
          if (-not $p700.Contains($old)) { throw 'P-700 cruise movement block not found' }
          Set-Content -Path $p700Path -Value ($p700.Replace($old, $new)) -NoNewline

          $testPath = 'Tests/M5P700Checks.h'
          $test = Get-Content -Raw $testPath
          if (-not $test.Contains("shortRangeDefinition.maximumTravelDistanceMeters = 500.0F;")) { throw 'short range fixture not found' }
          $test = $test.Replace("shortRangeDefinition.maximumTravelDistanceMeters = 500.0F;", "shortRangeDefinition.maximumTravelDistanceMeters = 2'000.0F;")
          if (-not $test.Contains("shortRangeRuntime->travelledDistanceMeters - 500.0F")) { throw 'short range expectation not found' }
          $test = $test.Replace("shortRangeRuntime->travelledDistanceMeters - 500.0F", "shortRangeRuntime->travelledDistanceMeters - 2'000.0F")
          Set-Content -Path $testPath -Value $test -NoNewline

          git diff --check

      - name: Commit repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item .github/workflows/fix-p700-cruise-range.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: terminate P-700 cleanly at cruise range limit"
          if ($LASTEXITCODE -ne 0) { throw 'P-700 cruise-range commit failed' }
          git push origin HEAD:fix/weapon-runtime-range-budgets
          if ($LASTEXITCODE -ne 0) { throw 'P-700 cruise-range push failed' }
