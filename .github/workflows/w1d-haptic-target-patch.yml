name: Apply W1-D Haptic Target Patch

on:
  push:
    branches:
      - feature/w1-d-wave-slamming
    paths:
      - Tools/patch_w1d_haptic_target.py
      - .github/workflows/w1d-haptic-target-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply W1-D haptic target patch
        shell: pwsh
        run: python Tools/patch_w1d_haptic_target.py
      - name: Commit target and remove patch plumbing
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm Tools/patch_w1d_haptic_target.py .github/workflows/w1d-haptic-target-patch.yml
          git add CMakeLists.txt
          git diff --cached --check
          git commit -m "tests: register W1-D wave-slam haptic gate"
          git push origin HEAD:feature/w1-d-wave-slamming
