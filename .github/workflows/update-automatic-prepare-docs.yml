name: Update automatic weapon preparation docs

on:
  push:
    branches:
      - fix/m5-weapon-ux-soft-envelopes
    paths:
      - Tools/update_automatic_prepare_docs.py
      - .github/workflows/update-automatic-prepare-docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-weapon-ux-soft-envelopes
          fetch-depth: 0
      - name: Update documentation
        run: python Tools/update_automatic_prepare_docs.py
      - name: Validate patch
        run: git diff --check && git diff --stat
      - name: Commit docs and remove temporary scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm Tools/update_automatic_prepare_docs.py .github/workflows/update-automatic-prepare-docs.yml
          git add -A
          git commit -m "docs: remove obsolete manual weapon preparation controls"
          git push origin HEAD:fix/m5-weapon-ux-soft-envelopes
