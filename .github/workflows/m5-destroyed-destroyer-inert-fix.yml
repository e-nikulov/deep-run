name: M5 Destroyed Destroyer Inert Fix

on:
  push:
    paths:
      - '.github/workflows/m5-destroyed-destroyer-inert-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Patch destroyed actor lifecycle and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('Game/Combat/SimpleDestroyerRuntime.h')
          text = runtime_path.read_text(encoding='utf-8')
          old = '''    if (runtime.integrity.destroyed)\n    {\n        return std::unexpected("destroyed simple destroyer cannot advance combat behavior");\n    }\n'''
          new = '''    if (runtime.integrity.destroyed)\n    {\n        // A destroyed surface actor is a valid terminal gameplay state, not a frame error.\n        // Keep the physical/damage authority available for presentation and post-impact acceptance,\n        // but freeze its weapon/controller behavior so it cannot acquire, prepare, or launch again.\n        if (!std::isfinite(simulationTimeSeconds) ||\n            simulationTimeSeconds < runtime.combatController.lastUpdateTimeSeconds ||\n            simulationTimeSeconds < runtime.weapon.lastUpdateTimeSeconds)\n        {\n            return std::unexpected("destroyed simple destroyer combat state is invalid or time-reversing");\n        }\n        runtime.combatController.selectedTrackId.reset();\n        runtime.combatController.lastUpdateTimeSeconds = simulationTimeSeconds;\n        return SimpleDestroyerCombatDecision{\n            .action = SimpleDestroyerCombatAction::Hold,\n            .perceivedTrackId = std::nullopt};\n    }\n'''
          if old not in text:
              raise SystemExit('destroyed-runtime patch anchor not found')
          runtime_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('Tests/M5SimpleDestroyerRuntimeChecks.h')
          text = test_path.read_text(encoding='utf-8')
          old = '''    if (!ApplySimpleDestroyerDamage(destroyerDefinition, destroyer, finishingDamage) ||\n        !destroyer.integrity.destroyed || destroyer.integrity.remainingIntegrity != 0.0F ||\n        AdvanceSimpleDestroyerCombatRuntime(destroyerDefinition, destroyer, {awarenessTrack}, 5.1))\n    {\n        return false;\n    }\n'''
          new = '''    if (!ApplySimpleDestroyerDamage(destroyerDefinition, destroyer, finishingDamage) ||\n        !destroyer.integrity.destroyed || destroyer.integrity.remainingIntegrity != 0.0F)\n    {\n        return false;\n    }\n\n    const auto weaponPhaseAtDestruction = destroyer.weapon.phase;\n    const auto weaponTrackAtDestruction = destroyer.weapon.targetTrackId;\n    const auto destroyedDecision = AdvanceSimpleDestroyerCombatRuntime(\n        destroyerDefinition, destroyer, {awarenessTrack}, 5.1);\n    if (!destroyedDecision || destroyedDecision->action != SimpleDestroyerCombatAction::Hold ||\n        destroyedDecision->perceivedTrackId.has_value() || destroyer.weapon.phase != weaponPhaseAtDestruction ||\n        destroyer.weapon.targetTrackId != weaponTrackAtDestruction ||\n        destroyer.combatController.selectedTrackId.has_value() ||\n        std::abs(destroyer.combatController.lastUpdateTimeSeconds - 5.1) > 1.0e-9)\n    {\n        return false;\n    }\n    if (AdvanceSimpleDestroyerCombatRuntime(destroyerDefinition, destroyer, {awarenessTrack}, 5.05))\n    {\n        return false;\n    }\n'''
          if old not in text:
              raise SystemExit('destroyed-runtime regression patch anchor not found')
          test_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit product fix
        shell: bash
        run: |
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git add Game/Combat/SimpleDestroyerRuntime.h Tests/M5SimpleDestroyerRuntimeChecks.h
          git diff --cached --check
          git commit -m 'fix: keep destroyed combat actors inert'
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
