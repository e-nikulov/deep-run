name: Finalize launcher cycle

on:
  push:
    branches:
      - fix/m5-weapon-ux-soft-envelopes
    paths:
      - Tools/finalize_launcher_cycle.py
      - .github/workflows/finalize-launcher-cycle.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-weapon-ux-soft-envelopes
          fetch-depth: 0
      - name: Apply finalization
        shell: pwsh
        run: python Tools/finalize_launcher_cycle.py
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-debug
      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-debug --parallel
      - name: Test
        shell: pwsh
        run: ctest --preset windows-debug --output-on-failure
      - name: Commit finalization and clean temporary scaffolding
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm Tools/finalize_launcher_cycle.py .github/workflows/finalize-launcher-cycle.yml
          git add -A
          git commit -m "fix: finalize launcher cycle runtime and acceptance"
          git push origin HEAD:fix/m5-weapon-ux-soft-envelopes
