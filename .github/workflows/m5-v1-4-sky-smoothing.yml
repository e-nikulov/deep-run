name: M5 V1.4 Sky Smoothing

on:
  push:
    branches:
      - fix/m5-v1-2-underwater-camera-scale

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/m5-v1-2-underwater-camera-scale
          fetch-depth: 0

      - name: Smooth M5 day sky
        shell: pwsh
        run: |
          $path = 'Game/Environment/ScalableEnvironmentPresentation.h'
          $content = [IO.File]::ReadAllText($path)
          $oldZenith = 'constexpr Render::RgbaColor ZenithColor{0.012F, 0.055F, 0.180F, 1.0F};'
          $newZenith = 'constexpr Render::RgbaColor ZenithColor{0.050F, 0.155F, 0.360F, 1.0F};'
          $oldHorizon = 'constexpr Render::RgbaColor HorizonColor{0.180F, 0.350F, 0.620F, 1.0F};'
          $newHorizon = 'constexpr Render::RgbaColor HorizonColor{0.085F, 0.225F, 0.465F, 1.0F};'
          if (-not $content.Contains($oldZenith) -or -not $content.Contains($oldHorizon)) { throw 'sky constants did not match expected V1.4 source' }
          $content = $content.Replace($oldZenith, $newZenith).Replace($oldHorizon, $newHorizon)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))
          git diff --check
          git diff --name-only
          if (@(git diff --name-only).Count -ne 1 -or @(git diff --name-only)[0] -ne $path) { throw 'unexpected files changed' }

      - name: Commit smoothing
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Game/Environment/ScalableEnvironmentPresentation.h
          git commit -m "fix: smooth M5 day sky gradient"
          git push origin HEAD:fix/m5-v1-2-underwater-camera-scale
