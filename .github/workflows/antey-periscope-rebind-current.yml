name: Antey Periscope Rebind Current

on:
  push:
    branches:
      - fix/periscope-saildevice11-current
    paths:
      - .github/workflows/antey-periscope-rebind-current.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebind:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - name: Checkout current-main repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebind production primary periscope to SailDevice11
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          from pathlib import Path

          writer = Path('Tools/Blender/write_production_sidecars.py')
          text = writer.read_text(encoding='utf-8')
          old = '    "SM_Antey_LOD0_SailDevice_08": "PERISCOPE_PRIMARY",'
          new = '    "SM_Antey_LOD0_SailDevice_11": "PERISCOPE_PRIMARY",'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old generator binding, found {text.count(old)}')
          writer.write_text(text.replace(old, new), encoding='utf-8')

          content_path = Path('Content/submarines/Antey/Antey.authoring.json')
          engine_path = Path('Engine/Assets/submarines/Antey/Antey.authoring.json')
          data = json.loads(content_path.read_text(encoding='utf-8'))
          devices = {item['nodeReference']: item for item in data['retractableSailDevices']}
          d08 = devices['SM_Antey_LOD0_SailDevice_08']
          d11 = devices['SM_Antey_LOD0_SailDevice_11']
          d17 = devices['SM_Antey_LOD0_SailDevice_17']
          if d08['semanticId'] != 'sail.retractable.03' or d11['semanticId'] != 'sail.retractable.06':
              raise SystemExit('unexpected retractable-device semantic IDs')
          if d08['functionalRole'] != 'PERISCOPE_PRIMARY' or d11['functionalRole'] != 'OTHER_RETRACTABLE':
              raise SystemExit('unexpected pre-fix primary-periscope roles')
          if d17['functionalRole'] != 'PERISCOPE_SECONDARY':
              raise SystemExit('secondary periscope binding changed unexpectedly')
          d08['functionalRole'] = 'OTHER_RETRACTABLE'
          d11['functionalRole'] = 'PERISCOPE_PRIMARY'
          rendered = json.dumps(data, indent=2)
          content_path.write_text(rendered, encoding='utf-8')
          engine_path.write_text(rendered, encoding='utf-8')

          gameplay = Path('docs/development/periscope-ballast-gameplay.md')
          text = gameplay.read_text(encoding='utf-8')
          old = '`SailDevice_08` as the gameplay primary periscope'
          new = '`SailDevice_11` as the gameplay primary periscope'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one gameplay-doc primary binding, found {text.count(old)}')
          gameplay.write_text(text.replace(old, new), encoding='utf-8')

          playground = Path('docs/development/m5-combat-playground.md')
          text = playground.read_text(encoding='utf-8')
          old = '(`sail.retractable.03`, production `SailDevice_08`)'
          new = '(`sail.retractable.06`, production `SailDevice_11`)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one M5-doc primary binding, found {text.count(old)}')
          playground.write_text(text.replace(old, new), encoding='utf-8')
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\rebind_periscope.py"
          python "$env:RUNNER_TEMP\rebind_periscope.py"
          if ($LASTEXITCODE -ne 0) { throw 'Periscope rebind failed' }
          python -m py_compile Tools/Blender/write_production_sidecars.py

      - name: Validate corrected authoring contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          from pathlib import Path

          content_path = Path('Content/submarines/Antey/Antey.authoring.json')
          engine_path = Path('Engine/Assets/submarines/Antey/Antey.authoring.json')
          if content_path.read_bytes() != engine_path.read_bytes():
              raise SystemExit('Content and Engine authoring sidecars are not byte-identical')
          data = json.loads(content_path.read_text(encoding='utf-8'))
          devices = {item['nodeReference']: item for item in data['retractableSailDevices']}
          expected = {
              'SM_Antey_LOD0_SailDevice_08': ('sail.retractable.03', 'OTHER_RETRACTABLE'),
              'SM_Antey_LOD0_SailDevice_11': ('sail.retractable.06', 'PERISCOPE_PRIMARY'),
              'SM_Antey_LOD0_SailDevice_17': ('sail.retractable.09', 'PERISCOPE_SECONDARY'),
          }
          for name, (semantic_id, role) in expected.items():
              item = devices[name]
              if item['semanticId'] != semantic_id or item['functionalRole'] != role:
                  raise SystemExit(f'{name}: {item["semanticId"]}/{item["functionalRole"]} != {semantic_id}/{role}')
          roles = [item['functionalRole'] for item in data['retractableSailDevices']]
          if roles.count('PERISCOPE_PRIMARY') != 1 or roles.count('PERISCOPE_SECONDARY') != 1:
              raise SystemExit('periscope role cardinality is invalid')
          writer = Path('Tools/Blender/write_production_sidecars.py').read_text(encoding='utf-8')
          if '"SM_Antey_LOD0_SailDevice_11": "PERISCOPE_PRIMARY"' not in writer:
              raise SystemExit('generator does not bind SailDevice11 as primary')
          if '"SM_Antey_LOD0_SailDevice_08": "PERISCOPE_PRIMARY"' in writer:
              raise SystemExit('stale SailDevice08 primary binding remains in generator')
          print('ANTEY_PERISCOPE_REBIND_OK SailDevice11=sail.retractable.06/PERISCOPE_PRIMARY')
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\validate_periscope.py"
          python "$env:RUNNER_TEMP\validate_periscope.py"
          if ($LASTEXITCODE -ne 0) { throw 'Periscope contract validation failed' }
          git diff --check

      - name: Commit correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Force '.github/workflows/antey-periscope-rebind-current.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          if (git diff --cached --quiet) { throw 'No periscope correction changes generated' }
          git commit -m 'fix: bind Antey primary periscope to SailDevice11'
          git push origin HEAD:fix/periscope-saildevice11-current
