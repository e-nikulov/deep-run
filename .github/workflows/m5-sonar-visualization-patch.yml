name: M5 sonar visualization patch

on:
  push:
    paths:
      - '.github/workflows/m5-sonar-visualization-patch.yml'
      - 'Tools/patch_m5_sonar_visualization.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Apply perceived-world sonar presentation slice
        run: python Tools/patch_m5_sonar_visualization.py
      - name: Validate source boundaries
        shell: bash
        run: |
          test -f Game/Combat/SonarPresentation.h
          grep -q 'BuildSonarPresentation' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'DrawSonarScope' Game/Combat/CombatCommandUi.cpp
          grep -q 'DrawSonarScope(combatUiSnapshot->sonar)' DeepRun/Main.cpp
          ! grep -q 'destroyer_' Game/Combat/SonarPresentation.h
          ! grep -q 'AcousticReflector' Game/Combat/SonarPresentation.h
      - name: Commit sonar visualization and remove temporary patch files
        shell: bash
        run: |
          rm .github/workflows/m5-sonar-visualization-patch.yml
          rm Tools/patch_m5_sonar_visualization.py
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git add -A
          git commit -m 'feat: add perceived-world sonar visualization'
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
