name: Antey HP Air Integration

on:
  push:
    branches: [feature/antey-electronic-intelligence-suite]
    paths: [.github/workflows/antey-hp-air-integration.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch physical HP-air authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one patch marker, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          path = 'Game/Submarine/AnteyBallastControl.h'
          replace_once(path,
          '''    const float requestedWeaponCompensationWaterMassKg,\n    const float fixedDeltaSeconds)''',
          '''    const float requestedWeaponCompensationWaterMassKg,\n    const float fixedDeltaSeconds,\n    const float mainBallastBlowAuthorityFraction = 1.0F)''')
          replace_once(path,
          '''        requestedWeaponCompensationWaterMassKg > config.maximumWeaponCompensationWaterMassKg ||\n        !std::isfinite(fixedDeltaSeconds) || fixedDeltaSeconds <= 0.0F)''',
          '''        requestedWeaponCompensationWaterMassKg > config.maximumWeaponCompensationWaterMassKg ||\n        !std::isfinite(fixedDeltaSeconds) || fixedDeltaSeconds <= 0.0F ||\n        !std::isfinite(mainBallastBlowAuthorityFraction) || mainBallastBlowAuthorityFraction < 0.0F ||\n        mainBallastBlowAuthorityFraction > 1.0F)''')
          replace_once(path,
          '''                depthCommandFraction * config.mainBallastBlowRateFractionPerSecond * fixedDeltaSeconds,''',
          '''                depthCommandFraction * config.mainBallastBlowRateFractionPerSecond *\n                    mainBallastBlowAuthorityFraction * fixedDeltaSeconds,''')

          path = 'Game/PhysicalPlayground.h'
          replace_once(path,
          '''#include "Game/Submarine/AnteyHandlingModel.h"\n#include "Game/Submarine/VesselCommandState.h"''',
          '''#include "Game/Submarine/AnteyHandlingModel.h"\n#include "Game/Submarine/AnteyHighPressureAir.h"\n#include "Game/Submarine/VesselCommandState.h"''')
          replace_once(path,
          '''    float dynamicMassKg = 0.0F;\n    bool bowPlanesDeployed = true;''',
          '''    float dynamicMassKg = 0.0F;\n    float highPressureAirFraction = 1.0F;\n    bool rkpCompressorRunning = false;\n    bool bowPlanesDeployed = true;''')
          replace_once(path,
          '''    [[nodiscard]] std::expected<Submarine::AnteyPhysicalCollisionProxySnapshot, std::string>\n    BuildPhysicalCollisionProxySnapshot() const''',
          '''    void SetRkpCompressorRequested(const bool requested) noexcept\n    {\n        rkpCompressorRequested_ = requested;\n    }\n\n    [[nodiscard]] std::expected<Submarine::AnteyPhysicalCollisionProxySnapshot, std::string>\n    BuildPhysicalCollisionProxySnapshot() const''')
          replace_once(path,
          '''    Submarine::AnteyBallastState ballastState_{};\n    float expendedOrdnanceMassKg_ = 0.0F;''',
          '''    Submarine::AnteyBallastState ballastState_{};\n    Submarine::AnteyHighPressureAirState highPressureAirState_{};\n    bool rkpCompressorRequested_ = false;\n    float expendedOrdnanceMassKg_ = 0.0F;''')

          path = 'Game/PhysicalPlayground.cpp'
          replace_once(path,
          '''constexpr Submarine::AnteyBallastControlConfig M5AnteyBallastControl{};\n// Effective Cd*A''',
          '''constexpr Submarine::AnteyBallastControlConfig M5AnteyBallastControl{};\nconstexpr Submarine::AnteyHighPressureAirConfig M5AnteyHighPressureAir{};\n// Effective Cd*A''')
          replace_once(path,
          '''    ballastState_ = {};\n    committedMainBallastFlowFractionPerSecond_ = 0.0F;''',
          '''    ballastState_ = {};\n    highPressureAirState_ = {};\n    rkpCompressorRequested_ = false;\n    committedMainBallastFlowFractionPerSecond_ = 0.0F;''')
          replace_once(path,
          '''    const auto nextBallastState = Submarine::AdvanceAnteyBallastState(\n        M5AnteyBallastControl, ballastState_, command.depthCommandFraction,\n        bodyWaterSample->signedDepthMeters, requestedTrimMassDeltaKg, expendedOrdnanceMassKg_, fixedDeltaSeconds);''',
          '''    const float mainBallastBlowAuthority = Submarine::AnteyMainBallastBlowAuthorityFraction(\n        M5AnteyHighPressureAir, highPressureAirState_);\n    const auto nextBallastState = Submarine::AdvanceAnteyBallastState(\n        M5AnteyBallastControl, ballastState_, command.depthCommandFraction,\n        bodyWaterSample->signedDepthMeters, requestedTrimMassDeltaKg, expendedOrdnanceMassKg_, fixedDeltaSeconds,\n        mainBallastBlowAuthority);''')
          replace_once(path,
          '''    if (!std::isfinite(nextMainBallastFlowFractionPerSecond))\n        return std::unexpected("physical playground main-ballast flow is non-finite");\n    const float nextDynamicMassKg =''',
          '''    if (!std::isfinite(nextMainBallastFlowFractionPerSecond))\n        return std::unexpected("physical playground main-ballast flow is non-finite");\n    const auto nextHighPressureAirState = Submarine::AdvanceAnteyHighPressureAir(\n        M5AnteyHighPressureAir, highPressureAirState_, rkpCompressorRequested_,\n        bodyWaterSample->signedDepthMeters, nextMainBallastFlowFractionPerSecond, fixedDeltaSeconds);\n    if (!nextHighPressureAirState)\n        return std::unexpected("physical playground high-pressure-air advance failed: " + nextHighPressureAirState.error());\n    const float nextDynamicMassKg =''')
          replace_once(path,
          '''    ballastState_ = *nextBallastState;\n    committedMainBallastFlowFractionPerSecond_ = nextMainBallastFlowFractionPerSecond;''',
          '''    ballastState_ = *nextBallastState;\n    highPressureAirState_ = *nextHighPressureAirState;\n    committedMainBallastFlowFractionPerSecond_ = nextMainBallastFlowFractionPerSecond;''')
          replace_once(path,
          '''        .weaponCompensationWaterMassKg = ballastState_.weaponCompensationWaterMassKg,\n        .dynamicMassKg = committedDynamicMassKg_,\n        .bowPlanesDeployed = true,''',
          '''        .weaponCompensationWaterMassKg = ballastState_.weaponCompensationWaterMassKg,\n        .dynamicMassKg = committedDynamicMassKg_,\n        .highPressureAirFraction = highPressureAirState_.pressureFraction,\n        .rkpCompressorRunning = highPressureAirState_.rkpCompressorRunning,\n        .bowPlanesDeployed = true,''')
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\patch.py"
          python "$env:RUNNER_TEMP\patch.py"
          git diff --check

      - name: Build and test ballast and electronics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset windows-debug
          cmake --build --preset windows-debug --target DeepRunAnteyElectronicSuiteTests DeepRunPeriscopeBallastGameplayTests
          ctest --preset windows-debug -R "DeepRunAnteyElectronicSuiteTests|DeepRunPeriscopeBallastGameplayTests" --output-on-failure

      - name: Commit HP-air integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Force '.github/workflows/antey-hp-air-integration.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: couple RKP air reserve to main ballast blow'
          git push origin HEAD:feature/antey-electronic-intelligence-suite
