name: Antey Propeller Hub Diagnostic

on:
  push:
    branches:
      - fix/antey-propeller-runtime-presentation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: Compare authored pivot with actual hub geometry
        shell: pwsh
        run: |
          @'
          import json, struct
          from pathlib import Path

          data=Path('Content/submarines/Antey/Antey.glb').read_bytes()
          off=12; chunks=[]
          while off<len(data):
              n,t=struct.unpack_from('<II',data,off); off+=8
              chunks.append((t,data[off:off+n])); off+=n
          g=json.loads(next(x for t,x in chunks if t==0x4E4F534A).decode('utf-8').rstrip('\x00 '))
          b=next(x for t,x in chunks if t==0x004E4942)
          side=json.loads(Path('Content/submarines/Antey/Antey.authoring.json').read_text(encoding='utf-8'))

          def positions(node_name):
              node=next(n for n in g['nodes'] if n.get('name')==node_name)
              mesh=g['meshes'][node['mesh']]
              out=[]
              for prim in mesh['primitives']:
                  a=g['accessors'][prim['attributes']['POSITION']]
                  v=g['bufferViews'][a['bufferView']]
                  stride=v.get('byteStride',12); base=v.get('byteOffset',0)+a.get('byteOffset',0)
                  out += [struct.unpack_from('<fff',b,base+i*stride) for i in range(a['count'])]
              return out
          def bounds(pts):
              mn=[min(p[k] for p in pts) for k in range(3)]
              mx=[max(p[k] for p in pts) for k in range(3)]
              return {'min':mn,'max':mx,'center':[(mn[k]+mx[k])*0.5 for k in range(3)],'extent':[mx[k]-mn[k] for k in range(3)]}
          def runtime_origin(src):
              x,y,z=src
              return [x,z,-y]

          result={}
          for side_name,node_name,semantic in [
              ('port','SM_Propeller_Port_Hub','propeller.port'),
              ('starboard','SM_Propeller_Starboard_Hub','propeller.starboard')]:
              h=bounds(positions(node_name))
              meta=next(p for p in side['propellers'] if p['semanticId']==semantic)
              pivot=runtime_origin(meta['origin'])
              delta=[pivot[k]-h['center'][k] for k in range(3)]
              result[side_name]={'hub_bounds':h,'sidecar_runtime_pivot':pivot,'pivot_minus_hub_bounds_center':delta}
          print(json.dumps(result,indent=2))
          Path('antey-propeller-hub-diagnostic.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 .tmp_hub_diag.py
          python .tmp_hub_diag.py
      - uses: actions/upload-artifact@v4
        with:
          name: antey-propeller-hub-diagnostic
          path: antey-propeller-hub-diagnostic.json
