name: M5 V1.5 Camera Scale Limit Repair

on:
  push:
    branches:
      - fix/m5-v1-2-underwater-camera-scale

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/m5-v1-2-underwater-camera-scale
          fetch-depth: 0

      - name: Apply scoped camera scale repair
        shell: pwsh
        run: |
          python .github/m5_v15_camera_scale_limit_fix.py
          if ($LASTEXITCODE -ne 0) { throw "repair script failed" }
          git diff --check
          $changed = @(git status --short)
          $allowed = @(
            'Game/Camera/MultiScaleTacticalCamera.h',
            'Game/PhysicalPlayground.h',
            'Game/Combat/CombatCommandUi.h',
            'Game/Combat/CombatCommandUi.cpp',
            'DeepRun/Main.cpp',
            'Tests/M5MultiScaleCameraChecks.h',
            'docs/design/vertical-ocean-gameplay.md'
          )
          foreach ($line in $changed) {
            $path = $line.Substring(3)
            if ($allowed -notcontains $path) { throw "unexpected changed file: $path" }
          }

      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Game/Camera/MultiScaleTacticalCamera.h Game/PhysicalPlayground.h Game/Combat/CombatCommandUi.h Game/Combat/CombatCommandUi.cpp DeepRun/Main.cpp Tests/M5MultiScaleCameraChecks.h docs/design/vertical-ocean-gameplay.md
          git commit -m "fix: cap camera zoom by ownship pixel footprint"
          git push origin HEAD:fix/m5-v1-2-underwater-camera-scale
