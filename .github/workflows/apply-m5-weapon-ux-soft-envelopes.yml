name: Apply M5 weapon UX soft envelopes

on:
  push:
    branches:
      - fix/m5-weapon-ux-soft-envelopes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/m5-weapon-ux-soft-envelopes
          fetch-depth: 0

      - name: Apply weapon UX patch
        run: python Tools/apply_weapon_ux_soft_envelopes.py

      - name: Show diff
        run: git diff --check && git diff --stat && git diff

      - name: Commit production changes and remove patch scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm Tools/apply_weapon_ux_soft_envelopes.py .github/workflows/apply-m5-weapon-ux-soft-envelopes.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: make weapon selection immediate and range advisory"
          git push origin HEAD:fix/m5-weapon-ux-soft-envelopes
