name: M5 V2 Torpedo Playground Integration

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Apply playground integration
        run: python .github/m5_v2_torpedo_playground.py
      - name: Validate diff
        run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt DeepRun/Main.cpp Game/Combat/CombatPlaygroundPresentation.h Game/Combat/CombatPlaygroundView.h Game/Combat/CombatPlaygroundWindowedComposition.h docs/development/m5-v2-player-navigation-sonar.md
          git commit -m "feat: use current torpedo models in combat playground"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
