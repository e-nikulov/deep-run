name: Antey Sail Device Audit

on:
  push:
    branches:
      - feature/antey-electronic-intelligence-suite
    paths:
      - .github/workflows/antey-sail-device-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: antey-sail-device-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Blender 5.2.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'blender-5.2.1-windows-x64.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'blender-5.2.1'
          curl.exe -L --fail --retry 4 --retry-delay 5 -o $zip https://download.blender.org/release/Blender5.2/blender-5.2.1-windows-x64.zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $blender = Get-ChildItem -Path $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $blender) { throw 'Blender 5.2.1 executable not found' }
          "BLENDER_EXE=$($blender.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract production sail-device geometry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import bpy
          import json
          from mathutils import Vector
          from pathlib import Path

          records = []
          for obj in sorted(bpy.context.scene.objects, key=lambda item: item.name):
              if obj.type != 'MESH' or int(obj.get('lod', -1)) != 0 or not bool(obj.get('runtime_export', False)):
                  continue
              if obj.get('source_first_role') != 'SAIL_DEVICE':
                  continue
              pts = [obj.matrix_world @ Vector(corner) for corner in obj.bound_box]
              mn = [min(float(p[i]) for p in pts) for i in range(3)]
              mx = [max(float(p[i]) for p in pts) for i in range(3)]
              center = [(mn[i] + mx[i]) * 0.5 for i in range(3)]
              dims = [mx[i] - mn[i] for i in range(3)]
              records.append({
                  'name': obj.name,
                  'center': center,
                  'minimum': mn,
                  'maximum': mx,
                  'dimensions': dims,
                  'deployment': obj.get('DEVICE_DEPLOYMENT'),
                  'motion': obj.get('MOTION'),
                  'axis': obj.get('AXIS'),
                  'sourceObject': obj.get('source_object'),
                  'sourceFirstRole': obj.get('source_first_role'),
                  'properties': {str(k): obj.get(k) for k in obj.keys() if k not in {'_RNA_UI'}},
              })

          payload = {
              'schemaVersion': 1,
              'coordinateContract': '+X bow; +Y port; +Z up; 1 BU = 1 m',
              'deviceCount': len(records),
              'devices': records,
              'byBowToStern': [r['name'] for r in sorted(records, key=lambda r: (-r['center'][0], r['center'][1], r['center'][2]))],
              'bySternToBow': [r['name'] for r in sorted(records, key=lambda r: (r['center'][0], r['center'][1], r['center'][2]))],
          }
          out = Path('docs/development/antey-sail-device-geometry.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\audit_sail_devices.py"

          & $env:BLENDER_EXE --background 'Content/submarines/Antey/Antey_GameReady.blend' --python "$env:RUNNER_TEMP\audit_sail_devices.py"
          if ($LASTEXITCODE -ne 0) { throw "Blender sail-device audit failed: $LASTEXITCODE" }

      - name: Commit geometry audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/development/antey-sail-device-geometry.json
          git diff --cached --check
          if (git diff --cached --quiet) { Write-Host 'No geometry audit changes'; exit 0 }
          git commit -m 'docs: audit Antey sail device geometry'
          git push origin HEAD:feature/antey-electronic-intelligence-suite
