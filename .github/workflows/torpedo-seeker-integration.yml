name: Torpedo Seeker Runtime Integration

on:
  push:
    paths:
      - '.github/workflows/torpedo-seeker-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/torpedo-active-passive-seeker
          fetch-depth: 0
      - name: Apply runtime integration patch
        run: python Tools/patch_torpedo_seeker_runtime.py
      - name: Verify runtime integration
        shell: bash
        run: |
          grep -q 'playerTorpedoActiveSeekerTracks_' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'destroyerTorpedoActiveSeekerTracks_' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'M5_PLAYER_TORPEDO_ACTIVE_SEEKER' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'M5_DESTROYER_TORPEDO_ACTIVE_SEEKER' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'UpdateTorpedoSeekerMode' Game/Combat/CombatPlaygroundRuntime.h
          git diff --check
      - name: Commit product integration
        shell: bash
        run: |
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git add Game/Combat/CombatPlaygroundRuntime.h
          git commit -m 'feat: integrate torpedo active passive seeker modes'
          git push origin HEAD:feature/torpedo-active-passive-seeker
