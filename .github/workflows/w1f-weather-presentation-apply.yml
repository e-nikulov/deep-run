name: Apply W1-F Weather Presentation Patch

on:
  push:
    branches:
      - feature/w1-f-weather-presentation
    paths:
      - .github/workflows/w1f-weather-presentation-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply W1-F weather presentation patch
        run: python Tools/patch_w1f_weather_presentation.py
      - name: Validate patch
        run: |
          git diff --check
          test -f Game/Environment/WeatherPresentation.h
          test -f Tests/W1WeatherPresentationChecks.h
          grep -q "static_assert(sizeof(ScenePresentationConstants) == 128U)" Engine/Render/D3D12Renderer.cpp
          grep -q "ApplyPrecipitationPresentation" Shaders/PostProcess/ToneMap.hlsl
      - name: Commit production changes and remove patch plumbing
        run: |
          rm Tools/patch_w1f_weather_presentation.py
          rm .github/workflows/w1f-weather-presentation-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "render: couple W1-F weather presentation"
          git push
