name: M5 P700 build fixes

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar
    paths:
      - .github/workflows/m5-p700-build-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Apply build fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def r(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: patch marker mismatch')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          r('Game/Combat/CombatCommandUi.cpp',
            '#include "Game/Combat/CombatCommandUi.h"\n',
            '#include "Game/Combat/CombatCommandUi.h"\n#include "Game/Weapons/P700LauncherInventory.h"\n')

          r('Game/Combat/CombatPlaygroundView.h',
            '    Armament::ProductionP700AssetDefinition p700Definition_{};\n',
            '    Armament::ProductionP700AssetDefinition p700Definition_;\n')

          r('CMakeLists.txt',
            'add_executable(DeepRunM5WeaponRuntimeTests\n    Tests/M5WeaponRuntimeTest.cpp\n)\n',
            'add_executable(DeepRunM5WeaponRuntimeTests\n    Tests/M5WeaponRuntimeTest.cpp\n    Game/PhysicsRenderSync.cpp\n)\n')
          PY
          git diff --check
      - name: Commit and clean temporary workflow
        run: |
          rm .github/workflows/m5-p700-build-fix.yml
          git add -A
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git commit -m 'fix: close P-700 integration build dependencies'
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
