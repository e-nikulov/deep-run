name: Add torpedo tube HUD

on:
  push:
    branches:
      - fix/m5-weapon-ux-soft-envelopes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-weapon-ux-soft-envelopes
          fetch-depth: 0

      - name: Apply HUD patch
        shell: pwsh
        run: |
          $path = "Tools/add_torpedo_tube_hud.py"
          $text = Get-Content -Raw $path
          $text = $text.Replace(
            '        static_assert(std::tuple_size_v<decltype(torpedoTubes)> == 6U);\n',
            '        static_assert(Armament::AnteyTorpedoTubeCount == 6U);\n')
          Set-Content -Path $path -Value $text -NoNewline
          python $path

      - name: Configure debug
        shell: pwsh
        run: cmake --preset windows-debug

      - name: Build debug
        shell: pwsh
        run: cmake --build --preset windows-debug --parallel

      - name: Test debug
        shell: pwsh
        run: ctest --preset windows-debug --output-on-failure

      - name: Commit verified HUD
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm Tools/add_torpedo_tube_hud.py .github/workflows/add-torpedo-tube-hud.yml
          git add Game/Combat/PlayerCombatCommandRuntime.h Game/Combat/CombatPlaygroundRuntime.h Game/Combat/CombatCommandUi.cpp Tests/M5PlayerControlledCombatChecks.h
          git commit -m "feat: show torpedo tube states on combat HUD"
          git push origin HEAD:fix/m5-weapon-ux-soft-envelopes
