name: Apply W1-B Spectral Runtime

on:
  push:
    branches:
      - feature/w1-b-spectral-production-ocean
    paths:
      - Tools/apply_w1b_spectral_runtime.py
      - .github/workflows/w1b-spectral-runtime-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply W1-B runtime patch
        shell: pwsh
        run: python Tools/apply_w1b_spectral_runtime.py

      - name: Commit W1-B runtime changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Engine/Render/D3D12Renderer.cpp Game/PhysicalPlayground.cpp
          git diff --cached --check
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "game: activate W1-B spectral production ocean"
          git push origin HEAD:feature/w1-b-spectral-production-ocean
