name: M5 V2 Sync Main Assets

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Configure merge identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Resolve current main into V2
        run: python .github/m5_v2_sync_main.py
      - name: Commit merge
        run: |
          git commit -m "merge: sync M5 V2 with current main assets"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
