name: Apply torpedo range rearm repair

on:
  push:
    branches:
      - fix/weapon-runtime-range-budgets

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/weapon-runtime-range-budgets
          fetch-depth: 0

      - name: Apply scoped repair
        shell: pwsh
        run: python Tools/fix_torpedo_range_rearm.py

      - name: Validate patch
        shell: pwsh
        run: git diff --check

      - name: Commit repaired runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Tools/fix_torpedo_range_rearm.py
          Remove-Item .github/workflows/apply-torpedo-range-rearm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rearm after torpedo range exhaustion"
          if ($LASTEXITCODE -ne 0) { throw "torpedo range rearm commit failed" }
          git push origin HEAD:fix/weapon-runtime-range-budgets
          if ($LASTEXITCODE -ne 0) { throw "torpedo range rearm push failed" }
