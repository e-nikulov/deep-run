name: One-shot M5 surface blow fallback

on:
  push:
    branches:
      - fix/m5-surface-blow-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-surface-blow-fallback
          fetch-depth: 0

      - name: Apply surface-blow deadlock fix and HUD state
        run: python .github/scripts/patch-m5-surface-blow-fallback.py

      - name: Commit corrected runtime
        shell: bash
        run: |
          rm .github/workflows/one-shot-m5-surface-blow-fallback.yml
          rm .github/scripts/patch-m5-surface-blow-fallback.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(m5): escalate saturated surface trim to ballast blow"
          git push origin HEAD:fix/m5-surface-blow-fallback
