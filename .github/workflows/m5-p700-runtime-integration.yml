          grep -q 'InputAction::PreviousWeapon' DeepRun/Main.cpp
          grep -q 'MaterializePlayerP700Launch' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'BuildProductionP700DeploymentOverrides' Game/Combat/CombatPlaygroundView.h

