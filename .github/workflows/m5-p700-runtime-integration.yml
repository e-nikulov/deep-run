name: M5 P700 runtime integration

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar
    paths:
      - .github/workflows/m5-p700-runtime-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 Tools/apply_m5_p700_runtime_patch.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'InputAction::PreviousWeapon' DeepRun/Main.cpp
          grep -q 'MaterializePlayerP700Launch' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'BuildProductionP700DeploymentOverrides' Game/Combat/CombatPlaygroundView.h
      - name: Commit integration and remove temporary tooling
        run: |
          rm .github/workflows/m5-p700-runtime-integration.yml Tools/apply_m5_p700_runtime_patch.py
          git add -A
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git commit -m 'feat: integrate P-700 weapon selector and production launch path'
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
