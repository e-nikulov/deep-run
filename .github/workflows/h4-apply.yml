name: H4 Apply Render Integration

on:
  push:
    branches:
      - tmp/m5-h4-scalable-environment
    paths:
      - .github/workflows/h4-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply render integration
        shell: pwsh
        run: ./Tools/CI/apply_h4_render_integration.ps1
