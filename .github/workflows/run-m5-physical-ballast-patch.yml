name: Run M5 physical ballast patch

on:
  push:
    branches:
      - fix/m5-final-closure-gaps
    paths:
      - .github/workflows/run-m5-physical-ballast-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-final-closure-gaps
      - name: Apply vertical dynamics closure
        run: python .github/apply_m5_physics.py
      - name: Commit vertical dynamics closure
        shell: bash
        run: |
          git config user.name "DeepRun CI"
          git config user.email "actions@users.noreply.github.com"
          git add Game/PhysicalPlayground.cpp Tests/PeriscopeBallastGameplayChecks.h docs/development/periscope-ballast-gameplay.md
          git commit -m "fix: stabilize Antey vertical dynamics"
          git push origin HEAD:fix/m5-final-closure-gaps