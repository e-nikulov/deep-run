name: M5 J3 Incoming Threat Apply

on:
  push:
    branches:
      - tmp/m5-j3-incoming-threat-ui
    paths:
      - Tools/CI/apply_m5_j3_incoming_threat.py
      - .github/workflows/m5-j3-incoming-threat-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply J3 patch
        shell: pwsh
        run: python Tools/CI/apply_m5_j3_incoming_threat.py
      - name: Commit clean J3 tree
        shell: pwsh
        run: |
          git config user.name "Deep Run CI"
          git config user.email "actions@users.noreply.github.com"
          git rm Tools/CI/apply_m5_j3_incoming_threat.py .github/workflows/m5-j3-incoming-threat-apply.yml
          git add Game/Combat/PlayerCombatCommandRuntime.h Game/Combat/CombatPlaygroundRuntime.h Game/Combat/CombatCommandUi.cpp Tests/M5CombatPlaygroundRuntimeChecks.h docs/roadmap/milestones.md docs/development/m5-combat-playground.md
          git commit -m "feat: add perceived incoming threat combat UI"
          git push origin HEAD:tmp/m5-j3-incoming-threat-ui
