name: Apply final M5 CI contract repair

on:
  push:
    branches:
      - fix/m5-final-closure-gaps
    paths:
      - .github/workflows/apply-m5-final-ci-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-final-closure-gaps
      - name: Apply final CI contract repair
        run: python .github/fix_m5_final_ci.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "DeepRun CI"
          git config user.email "actions@users.noreply.github.com"
          git add Tests/TestMain.cpp Tests/M5PlayerCombatInputChecks.h Game/PhysicalPlayground.cpp
          git commit -m "test: align M5 closure gates with physical Antey model"
          git push origin HEAD:fix/m5-final-closure-gaps
