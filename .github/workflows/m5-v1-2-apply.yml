name: M5 V1.2 Apply Verify

on:
  push:
    branches:
      - fix/m5-v1-2-underwater-camera-scale

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout scoped branch
        uses: actions/checkout@v4
        with:
          ref: fix/m5-v1-2-underwater-camera-scale
          fetch-depth: 0

      - name: Apply production M5-V1.2 changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("Tools/m5_v12_apply.py")
          text = path.read_text(encoding="utf-8")
          old_helper = "write(path, text[:first] + replacement + text[last:])"
          new_helper = "write(path, text[:first] + replacement + text[last + len(end):])"
          if text.count(old_helper) != 1:
              raise RuntimeError("temporary transform helper contract changed")
          text = text.replace(old_helper, new_helper, 1)

          block_start = text.index('replace_once(\n    "Game/PhysicalPlayground.h",')
          block_end = text.index('\n\nreplace_between(\n    "Game/PhysicalPlayground.cpp",', block_start)
          physical_transform = r'''replace_between(
              "Game/PhysicalPlayground.h",
              """    [[nodiscard]] std::expected<void, std::string> SetPresentationCameraFraming(
                  const float targetOffsetXMeters,
                  const float targetOffsetYMeters,
                  const float horizontalSpanMeters)
              {""",
              """    [[nodiscard]] std::expected<void, std::string> SetPresentationCameraFraming(
                  const float targetOffsetXMeters,
                  const float horizontalSpanMeters)
              {""",
              """    [[nodiscard]] std::expected<void, std::string> SetPresentationCameraFraming(
                  const float targetOffsetXMeters,
                  const float targetOffsetYMeters,
                  const float horizontalSpanMeters,
                  const float cameraAspectRatio)
              {
                  if (!std::isfinite(targetOffsetXMeters) || !std::isfinite(targetOffsetYMeters) ||
                      !std::isfinite(horizontalSpanMeters) || horizontalSpanMeters <= 0.0F ||
                      !std::isfinite(cameraAspectRatio) || cameraAspectRatio <= 0.0F)
                  {
                      return std::unexpected(\"physical playground presentation camera framing must be finite and positive\");
                  }

                  float effectiveTargetOffsetYMeters = targetOffsetYMeters;
                  // M5-V1.2 underwater-first composition derives vertical framing from the live renderer aspect.
                  // Y=0 remains the production normal-play opt-in; explicit future vertical framing is untouched.
                  constexpr float M5NormalCombatAboveWaterFraction = 0.15F;
                  constexpr float M5NormalCombatSurfaceBiasMinimumHorizontalSpanMeters = 600.0F;
                  if (water_.has_value() && std::abs(targetOffsetYMeters) <= 1.0e-4F &&
                      horizontalSpanMeters >= M5NormalCombatSurfaceBiasMinimumHorizontalSpanMeters)
                  {
                      const float unshiftedTargetYMeters =
                          initialBodyWorldCenter_.y - presentationCameraTargetOffsetYMeters_;
                      const float verticalSpanMeters = horizontalSpanMeters / cameraAspectRatio;
                      const float desiredTargetWorldYMeters = water_->Config().surfaceLevelY +
                          (M5NormalCombatAboveWaterFraction - 0.5F) * verticalSpanMeters;
                      effectiveTargetOffsetYMeters = desiredTargetWorldYMeters - unshiftedTargetYMeters;
                  }

                  initialBodyWorldCenter_.x += targetOffsetXMeters - presentationCameraTargetOffsetXMeters_;
                  initialBodyWorldCenter_.y += effectiveTargetOffsetYMeters - presentationCameraTargetOffsetYMeters_;
                  presentationCameraTargetOffsetXMeters_ = targetOffsetXMeters;
                  presentationCameraTargetOffsetYMeters_ = effectiveTargetOffsetYMeters;
                  M2GameplayCameraHorizontalSpanMeters = horizontalSpanMeters;
                  freePresentationCameraFraming_ = true;
                  return {};
              }

              // Compatibility overload for older presentation-only call sites. Production M5 supplies the live
              // renderer aspect so resize composition remains exact.
              [[nodiscard]] std::expected<void, std::string> SetPresentationCameraFraming(
                  const float targetOffsetXMeters,
                  const float targetOffsetYMeters,
                  const float horizontalSpanMeters)
              {
                  return SetPresentationCameraFraming(
                      targetOffsetXMeters, targetOffsetYMeters, horizontalSpanMeters, 16.0F / 9.0F);
              }

              [[nodiscard]] std::expected<void, std::string> SetPresentationCameraFraming(
                  const float targetOffsetXMeters,
                  const float horizontalSpanMeters)
              {""")'''
          text = text[:block_start] + physical_transform + text[block_end:]

          main_start = text.index('main = read("DeepRun/Main.cpp")')
          main_end = text.index('# Existing early visual capture becomes', main_start)
          main_transform = r'''main = read("DeepRun/Main.cpp")
          smoke_old = """cameraFraming->targetOffsetXMeters, 0.0F, cameraFraming->horizontalSpanMeters);"""
          smoke_new = """cameraFraming->targetOffsetXMeters, 0.0F, cameraFraming->horizontalSpanMeters,
                              renderer.AspectRatio());"""
          if main.count(smoke_old) != 1:
              raise RuntimeError("DeepRun/Main.cpp: smoke camera framing call site changed")
          main = main.replace(smoke_old, smoke_new, 1)

          manual_old = """cameraFraming->targetOffsetXMeters,
                              cameraFraming->targetOffsetYMeters,
                              cameraFraming->horizontalSpanMeters);"""
          manual_new = """cameraFraming->targetOffsetXMeters,
                              cameraFraming->targetOffsetYMeters,
                              cameraFraming->horizontalSpanMeters,
                              renderer.AspectRatio());"""
          if main.count(manual_old) != 1:
              raise RuntimeError("DeepRun/Main.cpp: multi-scale camera framing call site changed")
          main = main.replace(manual_old, manual_new, 1)
          '''
          text = text[:main_start] + main_transform + text[main_end:]
          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python Tools/m5_v12_apply.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit only production changes
        shell: pwsh
        run: |
          git rm Tools/m5_v12_apply.py .github/workflows/m5-v1-2-apply.yml
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close M5 underwater composition'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:fix/m5-v1-2-underwater-camera-scale
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Debug
        run: cmake --preset windows-debug

      - name: Build Debug
        run: cmake --build --preset windows-debug

      - name: CTest Debug
        run: ctest --preset windows-debug --output-on-failure

      - name: Debug headless smoke
        shell: pwsh
        run: |
          & .\build\windows-debug\Debug\DeepRun.exe --headless
          exit $LASTEXITCODE

      - name: Configure Release
        run: cmake --preset windows-release

      - name: Build Release
        run: cmake --build --preset windows-release

      - name: CTest Release
        run: ctest --preset windows-release --output-on-failure

      - name: Release headless smoke
        shell: pwsh
        run: |
          & .\build\windows-release\Release\DeepRun.exe --headless
          exit $LASTEXITCODE

      - name: Debug windowed combat smoke and capture
        id: debug_smoke
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\debug | Out-Null
          & .\build\windows-debug\Debug\DeepRun.exe --smoke-test
          $code = $LASTEXITCODE
          Get-ChildItem -File | Where-Object {
            $_.Name -eq 'm5-combat-acceptance.json' -or
            $_.Name -like 'm5-*.bmp'
          } | Move-Item -Destination artifacts\debug -Force
          exit $code

      - name: Release windowed combat smoke and capture
        id: release_smoke
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\release | Out-Null
          & .\build\windows-release\Release\DeepRun.exe --smoke-test
          $code = $LASTEXITCODE
          Get-ChildItem -File | Where-Object {
            $_.Name -eq 'm5-combat-acceptance.json' -or
            $_.Name -like 'm5-*.bmp'
          } | Move-Item -Destination artifacts\release -Force
          exit $code

      - name: Final diff check
        if: always()
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $failed = $false
          if (-not (Test-Path artifacts\debug\m5-normal-local.bmp)) {
            Write-Host '::error::Debug NORMAL LOCAL capture is missing'
            $failed = $true
          }
          if (-not (Test-Path artifacts\release\m5-normal-local.bmp)) {
            Write-Host '::error::Release NORMAL LOCAL capture is missing'
            $failed = $true
          }
          if ('${{ steps.debug_smoke.outcome }}' -ne 'success') {
            Write-Host '::error::Debug windowed smoke failed'
            $failed = $true
          }
          if ('${{ steps.release_smoke.outcome }}' -ne 'success') {
            Write-Host '::error::Release windowed smoke failed'
            $failed = $true
          }
          if ($failed) { exit 1 }

      - name: Upload M5-V1.2 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-v1-2-visual-acceptance
          path: artifacts
          if-no-files-found: warn
