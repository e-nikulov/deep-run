name: Apply W1-G Thunderstorm Patch

on:
  push:
    branches:
      - feature/w1-g-thunderstorm-presentation
    paths:
      - Tools/patch_w1g_thunderstorm.py
      - .github/workflows/w1g-thunderstorm-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply W1-G thunderstorm patch
        run: python Tools/patch_w1g_thunderstorm.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q "lightningFlashIntensity" Engine/Render/D3D12Renderer.cpp
          grep -q "ThunderstormPresentation" Game/PhysicalPlayground.cpp
      - name: Commit production changes and remove patch plumbing
        shell: bash
        run: |
          rm -f Tools/patch_w1g_thunderstorm.py .github/workflows/w1g-thunderstorm-apply.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "render: wire W1-G thunderstorm presentation"
          git push origin HEAD:feature/w1-g-thunderstorm-presentation
