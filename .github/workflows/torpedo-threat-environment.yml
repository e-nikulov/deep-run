name: Torpedo Threat Environment Wiring

on:
  push:
    paths:
      - '.github/workflows/torpedo-threat-environment.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/torpedo-active-passive-seeker
          fetch-depth: 0
      - name: Apply threat environment wiring
        run: python Tools/patch_torpedo_threat_environment.py
      - name: Verify wiring
        shell: bash
        run: |
          grep -q 'incoming-threat environment path failed' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'simulationTimeSeconds, \*environment' Game/Combat/CombatPlaygroundRuntime.h
      - name: Commit product wiring
        shell: bash
        run: |
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git add Game/Combat/CombatPlaygroundRuntime.h
          git commit -m 'fix: apply acoustic environment to torpedo threat perception'
          git push origin feature/torpedo-active-passive-seeker
