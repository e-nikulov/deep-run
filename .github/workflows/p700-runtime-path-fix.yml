name: P700 runtime path repair

on:
  push:
    branches:
      - feature/p700-signature-launch-vfx

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Add one-shot P-700 runtime path repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p700-signature-launch-vfx
      - name: Bind VFX resources to executable content root
        shell: python
        run: |
          from pathlib import Path

          path = Path('Game/Combat/CombatPlaygroundView.h')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'transientVfx.Initialize(renderer, "Shaders")':
                  'transientVfx.Initialize(renderer, assets.Root().parent_path() / "Shaders")',
              'Armament::LoadP700LaunchVfxTuning(std::filesystem::path("Config") / "p700_vfx.json")':
                  'Armament::LoadP700LaunchVfxTuning(assets.Root().parent_path() / "Config" / "p700_vfx.json")',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
      - name: Commit runtime path repair and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/p700-runtime-path-fix.yml
          git add Game/Combat/CombatPlaygroundView.h
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git commit -m "Fix P-700 VFX runtime resource paths"
          git push origin HEAD:feature/p700-signature-launch-vfx
