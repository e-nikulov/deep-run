name: Torpedo Miss Physics Refinement

on:
  push:
    paths:
      - '.github/workflows/torpedo-miss-physics.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/torpedo-active-passive-seeker
          fetch-depth: 0
      - name: Apply refinement
        run: python Tools/patch_torpedo_miss_physics.py
      - name: Verify refinement
        shell: bash
        run: |
          grep -q 'ConventionalTorpedoTerminalReason::EnduranceExpired' Simulation/Weapons/ConventionalTorpedo.h
          grep -q 'EvaluateAcousticEnvironmentPath' Game/Combat/CombatPlaygroundRuntime.h
          grep -q 'maximumRunTimeSeconds = 1.0' Tests/M5ConventionalTorpedoChecks.h
          git diff --check
      - name: Commit product refinement
        shell: bash
        run: |
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git add Simulation/Weapons/ConventionalTorpedo.h Simulation/Weapons/TorpedoSeeker.h Game/Combat/CombatPlaygroundRuntime.h Tests/M5ConventionalTorpedoChecks.h
          git commit -m 'feat: model torpedo endurance and acoustic layer losses'
          git push origin HEAD:feature/torpedo-active-passive-seeker
