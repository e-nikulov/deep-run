name: W1-K crest effects patch

on:
  push:
    branches:
      - feature/w1-k-beaufort-sea-effects
    paths:
      - Tools/CI/apply_w1_k_crest_effects.py
      - .github/workflows/w1-k-crest-effects-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w1-k-crest-effects-patch
  cancel-in-progress: true

jobs:
  apply-build-test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply crest effects patch
        shell: pwsh
        run: python Tools/CI/apply_w1_k_crest_effects.py
      - name: Configure Debug
        shell: pwsh
        run: cmake --preset windows-debug
      - name: Build Debug
        shell: pwsh
        run: cmake --build --preset windows-debug --parallel
      - name: Test Debug
        shell: pwsh
        run: ctest --preset windows-debug --output-on-failure
      - name: Commit validated crest effects
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Engine/Render/GerstnerSurface.cpp Engine/Render/D3D12Renderer.cpp Shaders/GerstnerSurface.hlsl Tests/W1MeshletOceanTest.cpp
          if (git diff --cached --quiet) { throw "W1-K crest patch produced no product changes" }
          git commit -m "W1-K.1: add procedural crest whitening"
          git push origin HEAD:feature/w1-k-beaufort-sea-effects
