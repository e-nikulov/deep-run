name: Normalize M5 authoring diff

on:
  push:
    branches:
      - fix/m5-final-closure-gaps
    paths:
      - .github/workflows/normalize-m5-authoring-diff.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-final-closure-gaps
      - name: Restore escaped display labels only
        shell: python
        run: |
          import json
          from pathlib import Path

          for rel in (
              "Content/submarines/Antey/Antey.authoring.json",
              "Engine/Assets/submarines/Antey/Antey.authoring.json",
          ):
              path = Path(rel)
              lines = path.read_text(encoding="utf-8").splitlines()
              out = []
              for line in lines:
                  marker = '"displayNameRu": '
                  if marker in line:
                      prefix, raw = line.split(marker, 1)
                      comma = raw.endswith(',')
                      token = raw[:-1] if comma else raw
                      value = json.loads(token)
                      encoded = json.dumps(value, ensure_ascii=True)
                      line = prefix + marker + encoded + (',' if comma else '')
                  out.append(line)
              path.write_text("\n".join(out) + "\n", encoding="utf-8", newline="\n")
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "DeepRun CI"
          git config user.email "actions@users.noreply.github.com"
          git add Content/submarines/Antey/Antey.authoring.json Engine/Assets/submarines/Antey/Antey.authoring.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: keep Antey authoring diff scoped"
          git push origin HEAD:fix/m5-final-closure-gaps
