name: Genericize Double-Sided Renderer Wording

on:
  push:
    branches:
      - fix/antey-propeller-runtime-presentation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep renderer gameplay-agnostic
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("Engine/Render/D3D12Renderer.cpp")
          text = path.read_text(encoding="utf-8")
          old = "surfaces such as the production Antey propeller blades."
          new = "surfaces that require visibility from both winding orientations."
          if text.count(old) != 1:
              raise RuntimeError(f"expected one renderer wording match, got {text.count(old)}")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          lower = text.lower()
          if "propeller" in lower or "submarine" in lower:
              raise RuntimeError("generic renderer contains gameplay vocabulary")
          '@ | Set-Content -Encoding UTF8 .tmp_genericize_renderer.py
          python .tmp_genericize_renderer.py
          Remove-Item .tmp_genericize_renderer.py
          git diff --check
      - name: Commit and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git rm .github/workflows/genericize-double-sided-comment.yml
          git add Engine/Render/D3D12Renderer.cpp
          git commit -m "fix: keep double-sided renderer contract generic"
          git push origin HEAD:fix/antey-propeller-runtime-presentation
