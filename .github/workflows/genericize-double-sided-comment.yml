name: Genericize Double-Sided Renderer Wording

on:
  push:
    branches:
      - fix/antey-propeller-runtime-presentation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep renderer gameplay-agnostic
        shell: pwsh
        run: |
          $path = 'Engine/Render/D3D12Renderer.cpp'
          $text = Get-Content -Raw $path
          $old = "        // back-face-culling PSO for ordinary meshes and a second PSO for authored two-sided`r`n        // surfaces such as the production Antey propeller blades."
          $new = "        // back-face-culling PSO for ordinary meshes and a second PSO for authored two-sided`r`n        // surfaces that require visibility from both winding orientations."
          if (-not $text.Contains($old)) { throw 'expected renderer comment not found' }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -Encoding UTF8 -NoNewline
          git diff --check
          if ((Get-Content -Raw $path).ToLowerInvariant().Contains('propeller')) { throw 'generic renderer still contains gameplay propeller vocabulary' }
          if ((Get-Content -Raw $path).ToLowerInvariant().Contains('submarine')) { throw 'generic renderer still contains gameplay submarine vocabulary' }
      - name: Commit and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git rm .github/workflows/genericize-double-sided-comment.yml
          git add Engine/Render/D3D12Renderer.cpp
          git commit -m "fix: keep double-sided renderer contract generic"
          git push origin HEAD:fix/antey-propeller-runtime-presentation
