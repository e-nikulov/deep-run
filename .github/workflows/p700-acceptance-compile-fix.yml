name: P700 Acceptance Compile Fix

on:
  push:
    paths:
      - '.github/workflows/p700-acceptance-compile-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Patch renderer acceptance types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Game/Combat/P700VisualAcceptance.h')
          s = p.read_text(encoding='utf-8')
          fixes = [
              ('#include <cstdint>\n', '#include <cstddef>\n#include <cstdint>\n'),
              ('#include <string>\n', '#include <string>\n#include <utility>\n'),
              ('const Render::Camera& camera,', 'const Render::OrthographicCamera& camera,'),
              ('const Render::ModelDrawStatistics& combatDrawStats,', 'const Render::ModelDrawStats& combatDrawStats,'),
          ]
          for old, new in fixes:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one match for {old!r}, got {s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Commit product fix
        shell: bash
        run: |
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git add Game/Combat/P700VisualAcceptance.h
          git commit -m "fix: align P-700 acceptance with render types"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
