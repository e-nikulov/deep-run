name: Verify paired P700 acceptance

on:
  push:
    branches:
      - fix/m5-weapon-ux-soft-envelopes
    paths:
      - Tools/raise_p700_acceptance_timeout.py
      - .github/workflows/raise-p700-acceptance-timeout.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-weapon-ux-soft-envelopes
          fetch-depth: 0
      - name: Apply paired acceptance repair
        shell: pwsh
        run: python Tools/raise_p700_acceptance_timeout.py
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-debug
      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-debug --parallel
      - name: Unit tests
        shell: pwsh
        run: ctest --preset windows-debug --output-on-failure
      - name: P-700 production smoke
        shell: pwsh
        run: |
          .\build\windows-debug\Debug\DeepRun.exe --smoke-p700
          if ($LASTEXITCODE -ne 0) { throw "P-700 smoke failed with exit code $LASTEXITCODE" }
      - name: Commit patch and remove temporary scaffolding
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm Tools/raise_p700_acceptance_timeout.py .github/workflows/raise-p700-acceptance-timeout.yml
          git add DeepRun/Main.cpp Game/Combat/CombatPlaygroundRuntime.h Game/Combat/P700VisualAcceptance.h
          git commit -m "test: exercise paired P-700 wet-launch acceptance"
          git push origin HEAD:fix/m5-weapon-ux-soft-envelopes
