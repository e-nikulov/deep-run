name: Repair IG1-C source scan

on:
  push:
    branches:
      - feature/m5-v2-player-navigation-sonar
    paths:
      - .github/workflows/repair-ig1c-source-scan.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair formatting-sensitive source scan
        shell: python
        run: |
          from pathlib import Path

          path = Path("Tests/TestMain.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''    const std::size_t bodyHalfExtents = source.find("bodyInfo.halfExtents = collisionHalfExtents");
              return productionSelection != std::string::npos && productionLoad != std::string::npos &&
                     source.find("legacyLod0") == std::string::npos && source.find("productionLod0") == std::string::npos &&
                     prototypeBridge == std::string::npos && productionCollision != std::string::npos &&
                     bodyHalfExtents != std::string::npos && source.find("assets.LoadModel(M2PhysicsProxyModelPath)") == std::string::npos &&
                     source.find("SubmarineModelPath") == std::string::npos &&
                     source.find("Render::PrepareModelDraws(*modelAsset_, modelToWorld,") != std::string::npos;
          '''
          new = '''    const std::size_t bodyHalfExtents = source.find("bodyInfo.halfExtents = collisionHalfExtents");
              const std::size_t productionDraw = source.find("const auto draws = Render::PrepareModelDraws(");
              const bool productionModelDraw = productionDraw != std::string::npos &&
                  source.find("*modelAsset_, modelToWorld", productionDraw) != std::string::npos;
              return productionSelection != std::string::npos && productionLoad != std::string::npos &&
                     source.find("legacyLod0") == std::string::npos && source.find("productionLod0") == std::string::npos &&
                     prototypeBridge == std::string::npos && productionCollision != std::string::npos &&
                     bodyHalfExtents != std::string::npos && source.find("assets.LoadModel(M2PhysicsProxyModelPath)") == std::string::npos &&
                     source.find("SubmarineModelPath") == std::string::npos && productionModelDraw;
          '''
          if text.count(old) != 1:
              raise RuntimeError(f"expected one stale IG1-C source-scan block, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -q 'const bool productionModelDraw' Tests/TestMain.cpp
          ! grep -q 'Render::PrepareModelDraws(\*modelAsset_, modelToWorld,' Tests/TestMain.cpp
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git add Tests/TestMain.cpp
          git rm .github/workflows/repair-ig1c-source-scan.yml
          git commit -m "test: make IG1-C render scan formatting-independent"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
