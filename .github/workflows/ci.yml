name: DeepRun CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deeprun-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-debug
            configuration: Debug
          - preset: windows-release
            configuration: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Antey compartment contract
        shell: pwsh
        run: python Tools/validate_antey_compartment_contract.py

      - name: Configure
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Verify build keeps runtime staging out of source tree
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain -- Engine/Assets)
          if ($dirty.Count -ne 0) {
            Write-Host "Build dirtied Engine/Assets:"
            $dirty | ForEach-Object { Write-Host $_ }
            throw "runtime asset staging must remain inside the build tree"
          }
          foreach ($path in @(
              ".\build\${{ matrix.preset }}\RuntimeAssets\submarines\Antey\.staged",
              ".\build\${{ matrix.preset }}\RuntimeAssets\Weapons\P700\.staged")) {
            if (-not (Test-Path $path)) {
              throw "expected build-tree runtime staging stamp is missing: $path"
            }
          }

      - name: Test
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }}

      - name: Normal gameplay startup smoke
        shell: pwsh
        run: |
          $executable = ".\build\${{ matrix.preset }}\${{ matrix.configuration }}\DeepRun.exe"
          $stdout = "normal-startup-${{ matrix.preset }}.stdout.log"
          $stderr = "normal-startup-${{ matrix.preset }}.stderr.log"
          Remove-Item $stdout, $stderr -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $executable -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Start-Sleep -Seconds 6
            $process.Refresh()
            $text = ((Get-Content $stdout -ErrorAction SilentlyContinue) +
                     (Get-Content $stderr -ErrorAction SilentlyContinue)) -join "`n"
            if ($process.HasExited) {
              Write-Host "----- normal startup output -----"
              Write-Host $text
              Write-Host "----- end normal startup output -----"
              throw "DeepRun normal gameplay exited unexpectedly during startup (exit code $($process.ExitCode))"
            }
            if ($text -match "\[(Game|Render)\]\[ERROR\]") {
              Write-Host "----- normal startup output -----"
              Write-Host $text
              Write-Host "----- end normal startup output -----"
              throw "DeepRun normal gameplay emitted a startup render/game error"
            }
            if ($text -notmatch "Engine initialized in windowed mode" -or
                $text -notmatch "M5 live combat runtime active") {
              throw "DeepRun normal gameplay did not reach the expected initialized combat state"
            }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Windowed acoustic smoke
        shell: pwsh
        run: |
          $executable = ".\build\${{ matrix.preset }}\${{ matrix.configuration }}\DeepRun.exe"
          $output = & $executable --smoke-test 2>&1 | Tee-Object -Variable smokeOutput
          $exitCode = $LASTEXITCODE
          $text = ($smokeOutput | Out-String)
          if ($exitCode -ne 0) {
            Write-Host "----- DeepRun smoke output -----"
            Write-Host $text
            Write-Host "----- end smoke output -----"
            throw "DeepRun windowed smoke failed with exit code $exitCode"
          }
          if ($text -notmatch "\[Game\]\[Acoustics\] Passive contact acquired:") {
            throw "M4 smoke did not acquire the expected passive acoustic observation"
          }
          if ($text -notmatch "\[Game\]\[Acoustics\] Track confirmed:") {
            throw "M4 smoke did not confirm the expected acoustic track"
          }
          $reportPath = "m5-combat-acceptance.json"
          if (-not (Test-Path $reportPath)) {
            throw "M5 visual acceptance did not produce its machine-readable report"
          }
          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          if (-not $report.all_state_checkpoints_seen -or $report.checkpoints.Count -ne 5) {
            throw "M5 visual acceptance did not observe all five required checkpoints"
          }

      - name: P-700 production launch smoke
        shell: pwsh
        run: |
          $executable = ".\build\${{ matrix.preset }}\${{ matrix.configuration }}\DeepRun.exe"
          $output = & $executable --smoke-p700 2>&1 | Tee-Object -Variable p700Output
          $exitCode = $LASTEXITCODE
          $text = ($p700Output | Out-String)
          if ($exitCode -ne 0) {
            Write-Host "----- P-700 smoke output -----"
            Write-Host $text
            Write-Host "----- end P-700 smoke output -----"
            throw "P-700 production smoke failed with exit code $exitCode"
          }
          foreach ($marker in @("HATCH_OPENING", "UNDERWATER_BOOSTER_EXIT", "WATER_EXIT", "HARDWARE_SEPARATION", "AERODYNAMIC_DEPLOY", "CRUISE", "TERMINAL", "PHYSICAL_IMPACT")) {
            if ($text -notmatch "\[Game\]\[P700\] $marker") {
              throw "P-700 smoke missed lifecycle marker $marker"
            }
          }
          if ($text -notmatch "PHYSICAL_IMPACT damage=100") {
            throw "P-700 smoke did not apply the accepted 100 HP direct hit"
          }
          $p700ReportPath = "m5-p700-acceptance.json"
          if (-not (Test-Path $p700ReportPath)) {
            throw "P-700 visual acceptance did not produce its machine-readable report"
          }
          $p700Report = Get-Content -Raw $p700ReportPath | ConvertFrom-Json
          if (-not $p700Report.all_state_checkpoints_seen -or $p700Report.checkpoints.Count -ne 5) {
            throw "P-700 visual acceptance did not observe all five required checkpoints"
          }
          $badInventory = @($p700Report.checkpoints | Where-Object { $_.p700_loaded_count -ne 23 })
          if ($badInventory.Count -ne 0) {
            throw "P-700 visual acceptance did not retain the expected 23/24 launcher inventory after launch"
          }
          $impact = @($p700Report.checkpoints | Where-Object { $_.name -eq 'M5_P700_IMPACT' })
          if ($impact.Count -ne 1 -or -not $impact[0].impact.target_is_destroyer_body -or $impact[0].impact.damage -ne 100) {
            throw "P-700 visual acceptance report did not confirm the physical 100 HP destroyer impact"
          }

      - name: Retain P-700 visual acceptance artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: m5-p700-visual-${{ matrix.preset }}
          if-no-files-found: warn
          path: |
            m5-p700-acceptance.json
            m5-p700-launch.bmp
            m5-p700-water-exit.bmp
            m5-p700-deploy.bmp
            m5-p700-cruise-terminal.bmp
            m5-p700-impact.bmp

      - name: Retain M5 visual acceptance artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: m5-combat-visual-${{ matrix.preset }}
          if-no-files-found: warn
          path: |
            m5-combat-acceptance.json
            m5-combat-initial.bmp
            m5-torpedo-flight.bmp
            m5-pre-impact.bmp
            m5-post-impact.bmp
            m5-resized.bmp
