name: DeepRun CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deeprun-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        preset:
          - windows-debug
          - windows-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }}
