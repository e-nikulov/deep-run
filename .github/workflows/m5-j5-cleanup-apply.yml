name: M5 J5 Cleanup Apply
on:
  push:
    branches: [tmp/m5-j5-active-sonar-command]
    paths:
      - Tools/CI/cleanup_m5_j5.ps1
      - .github/workflows/m5-j5-cleanup-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        shell: pwsh
        run: ./Tools/CI/cleanup_m5_j5.ps1
      - name: Commit clean tree
        shell: pwsh
        run: |
          Remove-Item Tools/CI/cleanup_m5_j5.ps1
          Remove-Item .github/workflows/m5-j5-cleanup-apply.yml
          git add -A
          git diff --cached --check
          git config user.name "Deep Run CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "refactor: clean M5 J5 verification tree"
          git push origin HEAD:tmp/m5-j5-active-sonar-command
