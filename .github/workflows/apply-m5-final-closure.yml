name: Apply M5 final closure

on:
  push:
    branches:
      - fix/m5-final-closure-gaps
    paths:
      - Tools/apply_m5_final_closure.py
      - .github/workflows/apply-m5-final-closure.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-final-closure-gaps
      - name: Normalize exact patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Game/PhysicalPlayground.h')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '    // Presentation-only bridge from the P-700 lifecycle. Semantic hatch identity was resolved from production\n'
              '    // authoring once at Initialize; no raw GLB node name or gameplay launch decision enters the renderer.\n',
              '    // Presentation-only bridge from the P-700 lifecycle.\n')
          s = s.replace(
              '    // Bounded H2 diagnostics: physics in FixedUpdate; camera/water/propeller presentation in Render.\n',
              '    // Bounded H2 diagnostics:\n')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Apply closure patch
        run: python Tools/apply_m5_final_closure.py
      - name: Commit generated repair
        shell: bash
        run: |
          git config user.name "DeepRun CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "fix: close M5 navigation and environment gaps"
          git push origin HEAD:fix/m5-final-closure-gaps
