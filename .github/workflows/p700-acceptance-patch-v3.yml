name: P700 acceptance patch v3

on:
  push:
    paths:
      - '.github/workflows/p700-acceptance-patch-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Repair patch matcher and exclude CI workflow edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Tools/patch_p700_acceptance.py')
          s=p.read_text()
          old="""s=rep(s,'''    if (!physics.IsInitialized() || !renderer.IsInitialized())''','''    if (!physics.IsInitialized() || !renderer.IsInitialized() || !std::isfinite(initialSubmarineDepthMeters) ||\n        initialSubmarineDepthMeters <= 0.0F || initialSubmarineDepthMeters > NormalGameplayMaximumVisibleDepthMeters)''','init depth validation')"""
          new="""s=rep(s,'''    const auto productionDefinition = Submarine::LoadProductionAnteyAssetDefinition(assets);''','''    if (!std::isfinite(initialSubmarineDepthMeters) || initialSubmarineDepthMeters <= 0.0F ||\n        initialSubmarineDepthMeters > NormalGameplayMaximumVisibleDepthMeters)\n    {\n        return std::unexpected(\"physical playground initial submarine depth is outside the visible gameplay ocean\");\n    }\n    const auto productionDefinition = Submarine::LoadProductionAnteyAssetDefinition(assets);''','init depth validation')"""
          if old not in s: raise SystemExit('old init-depth matcher not found')
          s=s.replace(old,new,1)
          start=s.find("# CI add separate Debug-only P700 smoke")
          end=s.find("# Docs update concise contract")
          if start < 0 or end < 0 or end <= start: raise SystemExit('CI block markers not found')
          s=s[:start]+s[end:]
          p.write_text(s)
          PY
      - name: Apply product patch
        run: python Tools/patch_p700_acceptance.py
      - name: Commit product changes only
        shell: bash
        run: |
          rm -f Tools/patch_p700_acceptance.py
          git config user.name "Evgeniy N."
          git config user.email "gnikulov@gmail.com"
          git add Engine Game DeepRun Simulation Tests docs Tools
          git commit -m "test: add full P-700 production acceptance scenario"
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
