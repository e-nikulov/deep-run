name: Temporary wire Antey compartment contract

on:
  push:
    branches:
      - feature/antey-compartment-reference-alignment

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python Tools/tmp_wire_antey_compartment_contract.py
      - run: |
          rm Tools/tmp_wire_antey_compartment_contract.py
          rm .github/workflows/tmp-wire-antey-compartment-contract.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: wire Antey compartment contract into authoring pipeline"
          git push origin HEAD:feature/antey-compartment-reference-alignment
