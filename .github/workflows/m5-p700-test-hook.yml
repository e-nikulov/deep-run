name: M5 P700 test hook

on:
  push:
    paths:
      - '.github/workflows/m5-p700-test-hook.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m5-v2-player-navigation-sonar
          fetch-depth: 0
      - name: Wire P-700 checks into M5 test chain
        shell: bash
        run: |
          sed -i '/#include "Tests\/M5NavalMineChecks.h"/a #include "Tests/M5P700Checks.h"' Tests/M5CombatImpactChecks.h
          python -c 'from pathlib import Path; p=Path("Tests/M5CombatImpactChecks.h"); s=p.read_text(); old="    return true;\n}\n} // namespace DeepRun::Tests\n"; new="    if (!RunM5P700Checks())\n    {\n        return fail(\"M5 P-700 perceived-track launch, surface/submerged exit, deployment and physical impact lifecycle\");\n    }\n\n    return true;\n}\n} // namespace DeepRun::Tests\n"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
          grep -q 'M5P700Checks.h' Tests/M5CombatImpactChecks.h
          grep -q 'RunM5P700Checks' Tests/M5CombatImpactChecks.h
      - name: Commit hook and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/m5-p700-test-hook.yml
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git add -A
          git commit -m 'test: integrate P-700 lifecycle regression gate'
          git push origin HEAD:feature/m5-v2-player-navigation-sonar
