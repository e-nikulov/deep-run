name: Tune Mast Visual Detection

on:
  push:
    branches: [feature/antey-electronic-intelligence-suite]
    paths: [.github/workflows/tune-mast-visual-detection.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reduce visual mast conspicuity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: patch marker not unique')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'Game/Combat/PeriscopeObservationSystem.h',
              '''    // GAME POLICY for a small exposed mast observed from a surface combatant. This is deliberately much shorter\n    // than the player's deliberate high-power periscope target-detection envelope and is not a historical spec.\n    float maximumDetectionRangeMeters = 8'000.0F;\n    float bearingUncertaintyRadians = 1.0F * PeriscopePi / 180.0F;\n    float minimumConfidence = 0.58F;''',
              '''    // GAME POLICY for naked-eye / ordinary optical-watch detection of a tiny exposed mast in open sea.\n    // Visual detection is intentionally a close-range event; the meaningful long-range penalty for RADIAN/radio\n    // use comes from hostile ESM, not from granting surface ships implausible long-range eyesight. Weather, glare\n    // and sea-state obscuration reduce this already-short envelope further. These are gameplay values, not TTX.\n    float maximumDetectionRangeMeters = 2'500.0F;\n    float bearingUncertaintyRadians = 2.5F * PeriscopePi / 180.0F;\n    float minimumConfidence = 0.30F;''')

          p = Path('Tests/PeriscopeBallastGameplayChecks.h')
          text = p.read_text(encoding='utf-8')
          old = '''    const auto exposedMast = ObserveExposedPeriscopeMast(\n        ExposedPeriscopeMastDetectionConfig{},\n        raisedPeriscope,\n        periscopeOwnship,\n        10.0F,\n        0.0F,\n        {.x = 3'000.0F, .y = 0.0F, .z = 0.0F},\n        0.97);\n    const auto stowedMast = ObserveExposedPeriscopeMast(\n        ExposedPeriscopeMastDetectionConfig{},\n        PeriscopeState{},\n        periscopeOwnship,\n        10.0F,\n        0.0F,\n        {.x = 3'000.0F, .y = 0.0F, .z = 0.0F},\n        0.98);\n    if (!exposedMast || !exposedMast->has_value() || !stowedMast || stowedMast->has_value() ||\n        (*exposedMast)->modality != Perception::SensorModality::Optical ||\n        (*exposedMast)->estimatedRangeMeters.has_value() || (*exposedMast)->classificationEvidence.has_value() ||\n        (*exposedMast)->opticalIdentificationLevel != Perception::OpticalIdentificationLevel::Detected)\n    {\n        return false;\n    }'''
          new = '''    const auto exposedMast = ObserveExposedPeriscopeMast(\n        ExposedPeriscopeMastDetectionConfig{},\n        raisedPeriscope,\n        periscopeOwnship,\n        10.0F,\n        0.0F,\n        {.x = 1'500.0F, .y = 0.0F, .z = 0.0F},\n        0.97);\n    const auto distantMast = ObserveExposedPeriscopeMast(\n        ExposedPeriscopeMastDetectionConfig{},\n        raisedPeriscope,\n        periscopeOwnship,\n        10.0F,\n        0.0F,\n        {.x = 3'000.0F, .y = 0.0F, .z = 0.0F},\n        0.975);\n    const auto stowedMast = ObserveExposedPeriscopeMast(\n        ExposedPeriscopeMastDetectionConfig{},\n        PeriscopeState{},\n        periscopeOwnship,\n        10.0F,\n        0.0F,\n        {.x = 1'500.0F, .y = 0.0F, .z = 0.0F},\n        0.98);\n    if (!exposedMast || !exposedMast->has_value() || !distantMast || distantMast->has_value() ||\n        !stowedMast || stowedMast->has_value() ||\n        (*exposedMast)->modality != Perception::SensorModality::Optical ||\n        (*exposedMast)->estimatedRangeMeters.has_value() || (*exposedMast)->classificationEvidence.has_value() ||\n        (*exposedMast)->opticalIdentificationLevel != Perception::OpticalIdentificationLevel::Detected)\n    {\n        return false;\n    }'''
          if text.count(old) != 1:
              raise SystemExit('PeriscopeBallastGameplayChecks.h: mast test marker not unique')
          p.write_text(text.replace(old, new), encoding='utf-8')
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\tune_mast.py"
          python "$env:RUNNER_TEMP\tune_mast.py"
          if ($LASTEXITCODE -ne 0) { throw 'mast visual tuning patch failed' }
          git diff --check

      - name: Build and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset windows-debug
          cmake --build --preset windows-debug --target DeepRunTests
          ctest --preset windows-debug -R DeepRunTests --output-on-failure

      - name: Commit mast visual tuning
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Force '.github/workflows/tune-mast-visual-detection.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'tune: make exposed masts difficult to spot visually'
          git push origin HEAD:feature/antey-electronic-intelligence-suite
