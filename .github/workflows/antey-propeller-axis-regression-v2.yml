name: Antey Propeller X Axis Regression Patch V2

on:
  push:
    branches:
      - fix/antey-propeller-runtime-presentation
    paths:
      - .github/workflows/antey-propeller-axis-regression-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply analytic X-axis regression
        shell: pwsh
        run: |
          $encoded = ''
          $bytes = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes('.tmp_axis_patch.py', $bytes)
          python .tmp_axis_patch.py
      - name: Commit hardened regression and clean temporary workflows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          git config user.name 'Evgeniy N.'
          git config user.email 'gnikulov@gmail.com'
          git add Tests/TestMain.cpp docs/development/antey-propeller-runtime-presentation-fix.md
          if (Test-Path '.github/workflows/antey-propeller-axis-regression.yml') { git rm '.github/workflows/antey-propeller-axis-regression.yml' }
          git rm '.github/workflows/antey-propeller-axis-regression-v2.yml'
          git commit -m 'test: prove Antey propellers rotate around model X shaft'
          git push origin HEAD:fix/antey-propeller-runtime-presentation
