name: Apply W1-C Surface Vessel Patch

on:
  push:
    branches:
      - feature/w1-c-surface-vessel-dynamics
    paths:
      - Tools/patch_w1c_surface_vessel.py
      - .github/workflows/w1c-surface-vessel-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply W1-C patch
        shell: pwsh
        run: python Tools/patch_w1c_surface_vessel.py
      - name: Commit production changes and remove patch plumbing
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm Tools/patch_w1c_surface_vessel.py .github/workflows/w1c-surface-vessel-patch.yml
          git add Game/PhysicalPlayground.h Game/PhysicalPlayground.cpp Tests/M4EnvironmentChecks.h Tests/W1SurfaceVesselDynamicsChecks.h
          git diff --cached --check
          git commit -m "physics: add W1-C surface vessel wave response"
          git push origin HEAD:feature/w1-c-surface-vessel-dynamics
