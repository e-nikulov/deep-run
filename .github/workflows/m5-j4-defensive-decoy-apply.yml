name: M5 J4 Defensive Decoy Apply

on:
  push:
    branches:
      - tmp/m5-j4-player-defensive-decoy
    paths:
      - Tools/CI/apply_m5_j4_player_defensive_decoy.py
      - .github/workflows/m5-j4-defensive-decoy-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply J4 patch
        run: python Tools/CI/apply_m5_j4_player_defensive_decoy.py

      - name: Commit clean J4 tree
        shell: pwsh
        run: |
          Remove-Item Tools/CI/apply_m5_j4_player_defensive_decoy.py
          Remove-Item .github/workflows/m5-j4-defensive-decoy-apply.yml
          git add -A
          git config user.name "Deep Run CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: add M5 J4 player defensive decoy"
          git push origin HEAD:tmp/m5-j4-player-defensive-decoy
