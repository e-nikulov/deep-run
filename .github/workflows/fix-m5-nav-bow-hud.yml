name: Fix M5 NAV bow HUD cleanup

on:
  push:
    branches:
      - fix/m5-final-closure-gaps
    paths:
      - .github/workflows/fix-m5-nav-bow-hud.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m5-final-closure-gaps
      - name: Remove stale bow-deflection HUD reference
        shell: python
        run: |
          from pathlib import Path
          p = Path('Game/Combat/CombatCommandUi.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''    ImGui::Text("Bow/Stern planes: %+0.0f%% / %+0.0f%%",\n                snapshot.bowPlaneDeflectionFraction * 100.0F,\n                snapshot.sternPlaneDeflectionFraction * 100.0F);\n'''
          new = '''    ImGui::Text("Bow planes: %s", snapshot.bowPlanesDeployed ? "DEPLOYED / FIXED" : "STOWED");\n    ImGui::Text("Stern planes: %+0.0f%%", snapshot.sternPlaneDeflectionFraction * 100.0F);\n'''
          if s.count(old) != 1:
              raise RuntimeError(f'expected one stale bow HUD block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          if 'bowPlaneDeflectionFraction' in s:
              raise RuntimeError('stale bowPlaneDeflectionFraction remains in CombatCommandUi.cpp')
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "DeepRun CI"
          git config user.email "actions@users.noreply.github.com"
          git add Game/Combat/CombatCommandUi.cpp
          git commit -m "fix: remove stale bow deflection HUD reference"
          git push origin HEAD:fix/m5-final-closure-gaps
