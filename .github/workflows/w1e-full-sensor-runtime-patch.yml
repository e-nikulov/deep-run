name: Apply W1-E Full Sensor Runtime Patch

on:
  push:
    branches:
      - feature/w1-e-weather-sensor-coupling
    paths:
      - Tools/patch_w1e_full_sensor_runtime.py
      - .github/workflows/w1e-full-sensor-runtime-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/w1-e-weather-sensor-coupling
      - name: Apply W1-E full sensor runtime patch
        run: python Tools/patch_w1e_full_sensor_runtime.py
      - name: Commit production changes and remove patch plumbing
        shell: bash
        run: |
          set -euo pipefail
          rm Tools/patch_w1e_full_sensor_runtime.py .github/workflows/w1e-full-sensor-runtime-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "game: couple W1-E weather to combat sensors"
          git push origin HEAD:feature/w1-e-weather-sensor-coupling
